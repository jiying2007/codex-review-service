name: Temporary Service 7.5 Role Routing Finalizer

on:
  push:
    branches: ["feat/model-routing-v1-runtime"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/model-routing-v1-runtime
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
      - name: Apply Config Schema 8 and production role routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(t.replace(old,new,1))
          def json_file(path,fn):
              p=Path(path); d=json.loads(p.read_text()); fn(d); p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          # Config Schema 8 hard-cuts model/fastModel and introduces administrator routing policy.
          rep('src/config.js',
              "codex:new Set(['path','model','fastModel','home','versionPolicy','allowedVersionPattern','providerMode','providerBaseUrl','apiKeyEnv','credentialSource','allowInsecureHttp','connectTimeoutSeconds','requestTimeoutSeconds','streamIdleTimeoutSeconds']),",
              "codex:new Set(['path','selectionStrategy','fixedModel','candidates','compatibilityPolicy','scoutEnabled','adjudicatorEnabled','adjudicatorMinSeverity','shadowCandidate','home','versionPolicy','allowedVersionPattern','providerMode','providerBaseUrl','apiKeyEnv','credentialSource','allowInsecureHttp','connectTimeoutSeconds','requestTimeoutSeconds','streamIdleTimeoutSeconds']),")
          marker="function stringList(value,fallback,label,{allowed=null,maxItems=64,maxLength=255}={}){"
          parser="function parseModelCandidates(value,label='codex.candidates'){if(value===undefined)return[];if(!Array.isArray(value)||value.length>8)throw configError(`${label} must be an array with at most 8 provider/model entries`);const out=[];for(let i=0;i<value.length;i++){const text=stringValue(value[i],'',`${label}[${i}]`,384),slash=text.indexOf('/');if(slash<=0||slash===text.length-1)throw configError(`${label}[${i}] must be provider/model`);const item=Object.freeze({provider:text.slice(0,slash),model:text.slice(slash+1)});if(!out.some(x=>x.provider===item.provider&&x.model===item.model))out.push(item);}return out;}\n"
          rep('src/config.js',marker,parser+marker)
          anchor="const dataDir=path.resolve(stringValue(s.dataDir,defaultStateDir(),'server.dataDir',2048)),language=enumValue(r.language,'zh-CN','review.language',['zh-CN','en']),reviewProfile=enumValue(r.profile,'general','review.profile',PROFILE_PACK_NAMES),analyzerReports=Object.freeze(parseAnalyzerReports(r.analyzerReports)),testPathPrefixes=Object.freeze(repositoryPaths(r.testPathPrefixes===undefined?['test/','tests/']:r.testPathPrefixes,'review.testPathPrefixes').map(value=>value.endsWith('/')?value:`${value}/`)),blockingSeverity=enumValue(r.blockingSeverity,'high','review.blockingSeverity',SEVERITIES),triggerAssignment=parseTriggerAssignment(r.triggerAssignment),maxDiffBytes=intValue(r.maxDiffBytes,1024*1024,'review.maxDiffBytes',4096,4*1024*1024);return Object.freeze({"
          insert="const dataDir=path.resolve(stringValue(s.dataDir,defaultStateDir(),'server.dataDir',2048)),language=enumValue(r.language,'zh-CN','review.language',['zh-CN','en']),reviewProfile=enumValue(r.profile,'general','review.profile',PROFILE_PACK_NAMES),analyzerReports=Object.freeze(parseAnalyzerReports(r.analyzerReports)),testPathPrefixes=Object.freeze(repositoryPaths(r.testPathPrefixes===undefined?['test/','tests/']:r.testPathPrefixes,'review.testPathPrefixes').map(value=>value.endsWith('/')?value:`${value}/`)),blockingSeverity=enumValue(r.blockingSeverity,'high','review.blockingSeverity',SEVERITIES),triggerAssignment=parseTriggerAssignment(r.triggerAssignment),maxDiffBytes=intValue(r.maxDiffBytes,1024*1024,'review.maxDiffBytes',4096,4*1024*1024),codexModelSelectionStrategy=enumValue(c.selectionStrategy,'auto','codex.selectionStrategy',['auto','preference','fixed']),codexFixedModel=stringValue(c.fixedModel,'','codex.fixedModel',256),codexModelCandidates=Object.freeze(parseModelCandidates(c.candidates)),codexModelCompatibilityPolicy=enumValue(c.compatibilityPolicy,codexModelSelectionStrategy==='fixed'?'warn':'strict','codex.compatibilityPolicy',['strict','warn','permissive']),codexShadowCandidate=stringValue(c.shadowCandidate,'','codex.shadowCandidate',384);if(codexModelSelectionStrategy==='fixed'&&!codexFixedModel)throw configError('codex.fixedModel is required when selectionStrategy=fixed');if(codexModelSelectionStrategy==='preference'&&!codexModelCandidates.length)throw configError('codex.candidates is required when selectionStrategy=preference');if(codexShadowCandidate)parseModelCandidates([codexShadowCandidate],'codex.shadowCandidate');return Object.freeze({"
          rep('src/config.js',anchor,insert)
          old="codexPath:stringValue(c.path,'codex','codex.path',1024)||'codex',codexModel:stringValue(c.model,'','codex.model',128),codexFastModel:stringValue(c.fastModel,'','codex.fastModel',128),codexHome:stringValue(c.home,'','codex.home',2048),"
          new="codexPath:stringValue(c.path,'codex','codex.path',1024)||'codex',codexModelSelectionStrategy,codexFixedModel,codexModelCandidates,codexModelCompatibilityPolicy,codexScoutEnabled:boolValue(c.scoutEnabled,false,'codex.scoutEnabled'),codexAdjudicatorEnabled:boolValue(c.adjudicatorEnabled,false,'codex.adjudicatorEnabled'),codexAdjudicatorMinSeverity:enumValue(c.adjudicatorMinSeverity,'high','codex.adjudicatorMinSeverity',['critical','high','medium','low','info']),codexShadowCandidate,codexModel:codexModelSelectionStrategy==='fixed'?codexFixedModel:'',codexHome:stringValue(c.home,'','codex.home',2048),"
          rep('src/config.js',old,new)
          rep('src/config.js',"parseFlowTracking,stringList,NOTIFICATION_EVENTS,FLOW_EVENTS,CONFIG_SCHEMA_VERSION};","parseFlowTracking,stringList,parseModelCandidates,NOTIFICATION_EVENTS,FLOW_EVENTS,CONFIG_SCHEMA_VERSION};")

          # Retire legacy fast-model planner: risk still controls evidence/context, not model authority.
          cp=Path('src/cost-planner.js'); text=cp.read_text(); text=text.replace("function selectModel(config,riskScore){return core.selectModel({model:config.codexModel,fastModel:config.codexFastModel,riskScore});}\n",''); text=text.replace(',selectModel,selectChunksWithinByteBudget',',selectChunksWithinByteBudget'); cp.write_text(text)
          cpt=Path('test/cost-planner.test.js'); text=cpt.read_text(); text=text.replace(',selectModel,selectChunksWithinByteBudget',',selectChunksWithinByteBudget'); text=text.replace("test('risk score expands context and routes low risk to fast model',()=>{const low={files:[{path:'docs/readme.md'}],diffText:'+ wording'},high={files:[{path:'src/auth/token.js'}],diffText:'+ await mutex.lock();\\n+ token = secret;'},config={contextEnabled:true,adaptiveContextEnabled:true,codexModel:'strong',codexFastModel:'fast'},policy={maxContextBytes:262144,maxContextFiles:12,contextLines:20};const lowCfg=adaptiveContextConfig(config,policy,low),highCfg=adaptiveContextConfig(config,policy,high);assert.ok(scoreChunkRisk(high)>scoreChunkRisk(low));assert.ok(highCfg.maxContextBytes>lowCfg.maxContextBytes);assert.equal(selectModel(config,lowCfg.riskScore),'fast');assert.equal(selectModel(config,highCfg.riskScore),'strong');});", "test('risk score expands evidence context without deciding model authority',()=>{const low={files:[{path:'docs/readme.md'}],diffText:'+ wording'},high={files:[{path:'src/auth/token.js'}],diffText:'+ await mutex.lock();\\n+ token = secret;'},config={contextEnabled:true,adaptiveContextEnabled:true},policy={maxContextBytes:262144,maxContextFiles:12,contextLines:20};const lowCfg=adaptiveContextConfig(config,policy,low),highCfg=adaptiveContextConfig(config,policy,high);assert.ok(scoreChunkRisk(high)>scoreChunkRisk(low));assert.ok(highCfg.maxContextBytes>lowCfg.maxContextBytes);});")
          cpt.write_text(text)
          ccf=Path('test/cost-config.test.js'); text=ccf.read_text().replace("assert.equal(config.codexFastModel,'');", "assert.equal(Object.prototype.hasOwnProperty.call(config,'codexFastModel'),false);assert.equal(config.codexModelSelectionStrategy,'auto');assert.equal(config.codexScoutEnabled,false);assert.equal(config.codexAdjudicatorEnabled,false);"); ccf.write_text(text)

          # Production service loop: role router + persistent numeric calibration + shadow/economics metadata.
          rep('src/service.js',"const crypto=require('node:crypto');\n","const crypto=require('node:crypto');\nconst path=require('node:path');\n")
          rep('src/service.js',"const{estimateChunkTokens,adaptiveContextConfig,selectModel,selectChunksWithinByteBudget,TokenBudgetLedger,TokenEstimatorCalibration}=require('./cost-planner');\n","const{estimateChunkTokens,adaptiveContextConfig,selectChunksWithinByteBudget,TokenBudgetLedger,TokenEstimatorCalibration}=require('./cost-planner');\nconst{createServiceModelRouter,executeRoleAwareReview}=require('./model-routing-runtime');\nconst{buildModelEconomicsScorecard}=require('./codex-safe-core/model-economics');\nconst{createTokenCalibrationStore}=require('./codex-safe-core/token-calibration-store');\n")
          old_ctor="this.active=new Map();this.stopping=false;this.workers=[];this.tokenLedger=new TokenBudgetLedger();this.tokenCalibration=new TokenEstimatorCalibration();}"
          new_ctor="this.active=new Map();this.stopping=false;this.workers=[];this.tokenLedger=new TokenBudgetLedger();this.tokenCalibration=new TokenEstimatorCalibration();this.tokenCalibrationStore=null;if(config.dataDir){try{this.tokenCalibrationStore=createTokenCalibrationStore({filePath:path.join(config.dataDir,'token-calibration.json')});this.tokenCalibrationStore.restore(this.tokenCalibration);}catch(error){this.logger.warn?.({event:'token_calibration_restore_failed',code:error.code||'ECALIBRATIONSTORE'});}}}"
          rep('src/service.js',old_ctor,new_ctor)
          old_decl="const perChunkFindings=Math.max(1,Math.ceil(policy.maxFindings/reviewSnapshot.chunks.length)),results=[],usage={inputTokens:0,cachedInputTokens:0,cacheWriteInputTokens:0,outputTokens:0,reasoningOutputTokens:0},models=new Set();let version='unknown',estimatedTotal=0;"
          new_decl="const perChunkFindings=Math.max(1,Math.ceil(policy.maxFindings/reviewSnapshot.chunks.length)),results=[],usage={inputTokens:0,cachedInputTokens:0,cacheWriteInputTokens:0,outputTokens:0,reasoningOutputTokens:0},models=new Set(),modelEvidence=[],shadowComparisons=[],economicsRecords=[],roleCalls=[];let version='unknown',estimatedTotal=0;const modelRouter=createServiceModelRouter(this.config);"
          rep('src/service.js',old_decl,new_decl)
          p=Path('src/service.js'); text=p.read_text()
          pattern=re.compile(r"      const model=selectModel\(this\.config,contextConfig\.riskScore\),prompt=buildPrompt\(reviewSnapshot,chunk,policy,context\),provider=this\.config\.codexProviderMode\|\|'openai';.*?results\.push\(validateChunkResult\(result\.parsed,chunk,policy\)\);",re.S)
          replacement="""      const prompt=buildPrompt(reviewSnapshot,chunk,policy,context),provider=this.config.codexProviderMode||'openai';
      let chunkEstimated=0;
      const beforeCall=({route,input,optional,shadow})=>{const effectiveProvider=route?.selection?.resolvedProvider||provider,effectiveModel=route?.model||'default',bytesPerToken=this.tokenCalibration.bytesPerToken(effectiveProvider,effectiveModel),estimate=estimateChunkTokens(input,perChunkFindings,bytesPerToken),effectiveMrTokenBudget=this.config.mrMaxTokenBudget?Math.max(1,Math.floor(this.config.mrMaxTokenBudget*profile.tokenFactor)):0;if(effectiveMrTokenBudget&&usageTotal(usage)+chunkEstimated+estimate.total>effectiveMrTokenBudget){const error=new Error('MR Model Routing token budget exhausted');error.code='ETOKENBUDGET';error.optional=optional||shadow;throw error;}this.reserveChunkBudget(job,estimate.total);chunkEstimated+=estimate.total;estimatedTotal+=estimate.total;return{estimatedTokens:estimate.total,riskScore:contextConfig.riskScore};};
      const afterCall=({route,input,result,budgetMeta})=>{const effectiveProvider=route?.selection?.resolvedProvider||provider,effectiveModel=result.model||route?.model||'default',calibration=this.tokenCalibration.observe(effectiveProvider,effectiveModel,{bytes:Buffer.byteLength(input,'utf8'),usage:result.usage});this.telemetry?.metrics.observe('codex_review_input_bytes_per_token',calibration.ratio,[1,1.5,2,2.5,3,4,6]);this.telemetry?.recordGenAiClient({operation:'review',provider:effectiveProvider,model:effectiveModel,durationSeconds:Number(result.durationMs||0)/1000,usage:result.usage});this.recordUsage(result.usage,budgetMeta?.estimatedTokens||0,contextConfig.riskScore);if(this.tokenCalibrationStore){try{this.tokenCalibrationStore.write(this.tokenCalibration);}catch(error){this.logger.warn?.({event:'token_calibration_write_failed',code:error.code||'ECALIBRATIONSTORE'});}}};
      let routed;try{routed=await executeRoleAwareReview({prompt,config:this.config,signal:controller.signal,maxFindings:perChunkFindings,runCodexFn:this.runCodexFn,validateResult:parsed=>validateChunkResult(parsed,chunk,policy),router:modelRouter,beforeCall,afterCall});}catch(error){if(error?.code==='ETOKENBUDGET'){fullSnapshot.coverageGaps.push('token_budget_preflight');fullSnapshot.coverageComplete=false;this.telemetry?.metrics.inc('codex_review_token_budget_preflight_blocks_total',1);break;}throw error;}
      usageAdd(usage,routed.usage);for(const model of routed.productionModels)models.add(model);modelEvidence.push(...routed.modelEvidence);roleCalls.push(...routed.calls);if(routed.shadowComparison)shadowComparisons.push({chunkIndex:chunk.index,...routed.shadowComparison});economicsRecords.push({usage:routed.usage,verifiedFindings:routed.finalValidated.findings.length,verifierCalls:routed.calls.filter(x=>!x.shadow&&x.role==='reviewer').length,scoutCalls:routed.calls.filter(x=>!x.shadow&&x.role==='scout').length,adjudicatorCalls:routed.calls.filter(x=>!x.shadow&&x.role==='adjudicator').length,latencyMs:routed.productionLatencyMs+routed.shadowLatencyMs});results.push(routed.finalValidated);version=routed.calls.find(x=>!x.shadow)?.model?'routed':version;
      evidenceEntries.push({index:chunk.index,diffDigest:fingerprint(chunk.diffText),contextDigest:fingerprint(context.blocks||[]),riskScore:contextConfig.riskScore,modelEvidence:routed.modelEvidence,shadowComparison:routed.shadowComparison||null});"""
          text2,n=pattern.subn(replacement,text,count=1)
          if n!=1: raise SystemExit(f'service model loop replacement count={n}')
          p.write_text(text2)
          old_meta="review.summary=deterministicSummary(review.findings,policy);review.codexVersion=version;review.codexModel=[...models].join(',');review.usage=usage;review.estimatedTokenBudget=estimatedTotal;review.reviewProfile=profile.name;review.impactNodes=qualityEvidence.impact?.nodes?.length||0;review.impactBytes=qualityEvidence.impact?.bytes||0;review.analyzerFindingCount=qualityEvidence.analyzerFindings?.length||0;review.modelInferenceCount=results.length;"
          new_meta="review.summary=deterministicSummary(review.findings,policy);review.codexVersion=version;review.codexModel=[...models].join(',');review.usage=usage;review.estimatedTokenBudget=estimatedTotal;review.reviewProfile=profile.name;review.impactNodes=qualityEvidence.impact?.nodes?.length||0;review.impactBytes=qualityEvidence.impact?.bytes||0;review.analyzerFindingCount=qualityEvidence.analyzerFindings?.length||0;review.modelInferenceCount=roleCalls.filter(x=>!x.shadow).length;review.shadowInferenceCount=roleCalls.filter(x=>x.shadow).length;review.modelRoutingContractVersion=1;review.modelRegistrySource=modelRouter.registrySource;review.modelRegistryRevision=modelRouter.registryRevision;review.modelEvidence=Object.freeze(modelEvidence);review.shadowComparisons=Object.freeze(shadowComparisons);review.modelEconomics=buildModelEconomicsScorecard(economicsRecords);this.logger.info?.({event:'model_routing_evidence',jobId:job.id,registryRevision:modelRouter.registryRevision,productionCalls:review.modelInferenceCount,shadowCalls:review.shadowInferenceCount,scoutCalls:roleCalls.filter(x=>!x.shadow&&x.role==='scout').length,adjudicatorCalls:roleCalls.filter(x=>!x.shadow&&x.role==='adjudicator').length,usage:review.usage,economics:review.modelEconomics});"
          rep('src/service.js',old_meta,new_meta)
          rep('src/service.js',"review.evidenceManifestDigest=fingerprint({version:1,diffFingerprint:fullSnapshot.diffFingerprint,coverageGaps:fullSnapshot.coverageGaps,advisories:fullSnapshot.advisories,profile:profile.name,quality:{impact:fingerprint(qualityEvidence.impact||{}),analyzers:fingerprint(qualityEvidence.analyzerFindings||[])},chunks:evidenceEntries});","review.evidenceManifestDigest=fingerprint({version:1,diffFingerprint:fullSnapshot.diffFingerprint,coverageGaps:fullSnapshot.coverageGaps,advisories:fullSnapshot.advisories,profile:profile.name,quality:{impact:fingerprint(qualityEvidence.impact||{}),analyzers:fingerprint(qualityEvidence.analyzerFindings||[])},modelRouting:{contractVersion:1,registryRevision:modelRouter.registryRevision,modelEvidence},chunks:evidenceEntries});")

          # Config tests hard-cut Schema 8 and retired fields.
          cfg=Path('test/config.test.js'); text=cfg.read_text(); text=text.replace("config schema is explicit and hard-cut at v7","config schema is explicit and hard-cut at v8").replace("schemaVersion:8,...baseConfig()","schemaVersion:9,...baseConfig()",1).replace("schemaVersion:6,...baseConfig()","schemaVersion:7,...baseConfig()",1).replace("assert.equal(CONFIG_SCHEMA_VERSION,7)","assert.equal(CONFIG_SCHEMA_VERSION,8)").replace("Unsupported config schema 8","Unsupported config schema 9").replace("Unsupported config schema 6","Unsupported config schema 7").replace("Config Schema 7 rejects retired","Config Schema 8 rejects retired");
          extra="\ntest('Config Schema 8 hard-cuts legacy model fields and validates role routing policy',()=>{const legacy=tempConfig({...baseConfig(),codex:{model:'old'}}),legacyFast=tempConfig({...baseConfig(),codex:{fastModel:'old-fast'}}),valid=tempConfig({...baseConfig(),codex:{selectionStrategy:'preference',candidates:['relay/a','relay/b'],compatibilityPolicy:'strict',scoutEnabled:true,adjudicatorEnabled:true,adjudicatorMinSeverity:'high',shadowCandidate:'relay/shadow'}});try{assert.throws(()=>loadStructuredConfig(legacy.file),/unsupported field: model/);assert.throws(()=>loadStructuredConfig(legacyFast.file),/unsupported field: fastModel/);withEnvs({CODEX_REVIEW_CONFIG_FILE:valid.file,GITLAB_API_TOKEN:'token',GITLAB_WEBHOOK_SIGNING_TOKEN:signingToken()},()=>{const c=loadConfig();assert.equal(c.codexModelSelectionStrategy,'preference');assert.deepEqual(c.codexModelCandidates,[{provider:'relay',model:'a'},{provider:'relay',model:'b'}]);assert.equal(c.codexScoutEnabled,true);assert.equal(c.codexAdjudicatorEnabled,true);assert.equal(c.codexShadowCandidate,'relay/shadow');});}finally{legacy.close();legacyFast.close();valid.close();}});\n"
          if 'hard-cuts legacy model fields' not in text: text+=extra
          cfg.write_text(text)
          st=Path('test/service.test.js'); text=st.read_text().replace("codexModel:'',codexFastModel:'',codexHome:''","codexModelSelectionStrategy:'auto',codexFixedModel:'',codexModelCandidates:[],codexModelCompatibilityPolicy:'strict',codexScoutEnabled:false,codexAdjudicatorEnabled:false,codexAdjudicatorMinSeverity:'high',codexShadowCandidate:'',codexModel:'',codexHome:''"); st.write_text(text)

          # Example configs: Schema 8 and new routing surface.
          for file in ['config.example.json','deploy/docker/config.example.json','deploy/systemd/config.example.json']:
              p=Path(file); d=json.loads(p.read_text()); d['schemaVersion']=8; c=d.setdefault('codex',{}); c.pop('model',None); c.pop('fastModel',None); ordered={'path':c.pop('path','codex'),'selectionStrategy':'auto','fixedModel':'','candidates':[],'compatibilityPolicy':'strict','scoutEnabled':False,'adjudicatorEnabled':False,'adjudicatorMinSeverity':'high','shadowCandidate':''}; ordered.update(c); d['codex']=ordered; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          # Package/Product identity and Core runtime module packaging.
          pkg=Path('package.json'); d=json.loads(pkg.read_text()); d['version']='7.5.0'; files=d['files'];
          pivot='src/codex-safe-core/efficiency-planner.js'
          additions=['src/codex-safe-core/model-registry-resolver.js','src/codex-safe-core/model-routing.js','src/codex-safe-core/model-economics.js','src/codex-safe-core/token-calibration-store.js']
          idx=files.index(pivot)+1
          for item in reversed(additions):
              if item not in files: files.insert(idx,item)
          pkg.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          lock=Path('package-lock.json'); ld=json.loads(lock.read_text()); ld['version']='7.5.0'; ld['packages']['']['version']='7.5.0'; lock.write_text(json.dumps(ld,ensure_ascii=False,indent=2)+'\n')
          pc=Path('product-contract.json'); pd=json.loads(pc.read_text()); pd['serviceVersion']='7.5.0'; pd['productVersion']='7.5.0'; pd['configSchemaVersion']=8; pd['modelRoutingContractVersion']=1; pc.write_text(json.dumps(pd,ensure_ascii=False,indent=2)+'\n')
          ch=Path('CHANGELOG.md'); text=ch.read_text(); heading='## 7.5.0 - 2026-09-04\n\n- Consume Core Model Routing Contract v1 in the production GitLab review loop with authoritative Reviewer routing, optional Scout, conditional fail-closed Adjudicator, and shadow evaluation that never affects production verdicts.\n- Hard-cut Config Schema 8: retire codex.model/fastModel in favor of Auto/Preference/Fixed routing, role controls, and an explicit same-provider shadow candidate.\n- Record Model Evidence, Shadow comparison, and Token Economics in review audit metadata; persist only privacy-safe numeric token calibration in a protected sidecar while Database Schema 8 and Review Receipt v5 remain unchanged.\n\n';
          if '## 7.5.0 - 2026-09-04' not in text: ch.write_text(text.replace('# Changelog\n','# Changelog\n\n'+heading,1) if '# Changelog\n' in text else heading+text)
          PY
          node scripts/generate-contract-docs.js
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A -- ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(service): adopt role-aware Model Routing v1'
            git push origin HEAD:feat/model-routing-v1-runtime
          fi

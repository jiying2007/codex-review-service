name: Hard-cut first release once

on:
  push:
    branches: [hardcut-first-release-4.1.0]

permissions:
  contents: write

jobs:
  hardcut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardcut-first-release-4.1.0
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22'
          cache: npm
      - name: Remove pre-release compatibility paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/db.js')
          s=p.read_text()
          s=s.replace("function hasColumn(db,table,column){return db.prepare(`PRAGMA table_info(${table})`).all().some(row=>row.name===column);}\n","")
          old="constructor(dbPath){fs.mkdirSync(path.dirname(dbPath),{recursive:true,mode:0o700});this.db=new DatabaseSync(dbPath);this.db.exec('PRAGMA journal_mode=WAL; PRAGMA synchronous=FULL; PRAGMA foreign_keys=ON; PRAGMA busy_timeout=5000;');this.migrate();}"
          new="constructor(dbPath){fs.mkdirSync(path.dirname(dbPath),{recursive:true,mode:0o700});this.db=new DatabaseSync(dbPath);this.db.exec('PRAGMA journal_mode=WAL; PRAGMA synchronous=FULL; PRAGMA foreign_keys=ON; PRAGMA busy_timeout=5000;');this.initializeSchema();}"
          if old not in s: raise SystemExit('db constructor pattern missing')
          s=s.replace(old,new)
          s=s.replace('  migrate(){\n    this.db.exec(`','  initializeSchema(){\n    const current=Number(this.db.prepare(\'PRAGMA user_version\').get().user_version||0);\n    const existing=this.db.prepare("SELECT name FROM sqlite_master WHERE type=\'table\' AND name NOT LIKE \'sqlite_%\' ORDER BY name").all().map(row=>row.name);\n    if(current===SCHEMA_VERSION)return;\n    if(current!==0||existing.length){const error=new Error(`Unsupported database schema ${current}; Codex Review Service first release requires a fresh Schema ${SCHEMA_VERSION} database`);error.code=\'EDBSCHEMA\';throw error;}\n    this.db.exec(`',1)
          s2=re.sub(r"\n    const additions=\{.*?\};\n    for\(const\[table,columns\]of Object\.entries\(additions\)\)for\(const\[column,type\]of columns\)if\(!hasColumn\(this\.db,table,column\)\)this\.db\.exec\(`ALTER TABLE \$\{table\} ADD COLUMN \$\{column\} \$\{type\}`\);", "", s, count=1, flags=re.S)
          if s2==s: raise SystemExit('legacy additions block not removed')
          s=s2
          s=s.replace("this.db.exec(`UPDATE review_jobs SET available_at=created_at WHERE available_at='';CREATE INDEX IF NOT EXISTS idx_review_jobs_status_available", "this.db.exec(`CREATE INDEX IF NOT EXISTS idx_review_jobs_status_available",1)
          p.write_text(s)

          p=Path('test/db.test.js')
          s=p.read_text()
          start=s.index("test('migrates legacy schema additively")
          end=s.index("test('serializes same MR jobs",start)
          replacement="""test('first-release schema initializes fresh and rejects pre-release databases',()=>{\n  withStore(store=>{assert.equal(store.schemaVersion(),SCHEMA_VERSION);assert.equal(store.synchronousMode(),2);assert.equal(store.db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='notification_outbox'\").get().name,'notification_outbox');});\n  const dir=fs.mkdtempSync(path.join(os.tmpdir(),'codex-review-hardcut-')),dbPath=path.join(dir,'test.sqlite'),legacy=new DatabaseSync(dbPath);legacy.exec(\"CREATE TABLE review_jobs(id INTEGER PRIMARY KEY); PRAGMA user_version=4;\");legacy.close();try{assert.throws(()=>new Store(dbPath),error=>error?.code==='EDBSCHEMA'&&/fresh Schema 5/.test(error.message));}finally{fs.rmSync(dir,{recursive:true,force:true});}\n  const dir2=fs.mkdtempSync(path.join(os.tmpdir(),'codex-review-hardcut-zero-')),dbPath2=path.join(dir2,'test.sqlite'),unknown=new DatabaseSync(dbPath2);unknown.exec(\"CREATE TABLE unexpected(id INTEGER PRIMARY KEY);\");unknown.close();try{assert.throws(()=>new Store(dbPath2),error=>error?.code==='EDBSCHEMA');}finally{fs.rmSync(dir2,{recursive:true,force:true});}\n});\n"""
          p.write_text(s[:start]+replacement+s[end:])

          p=Path('scripts/verify-family-v4.js')
          s=p.read_text()
          marker="const sourceFiles = fs.readdirSync(path.join(root, 'src')).filter(name => name.endsWith('.js'));"
          gate="""const dbSource = fs.readFileSync(path.join(root, 'src', 'db.js'), 'utf8');\nassert.doesNotMatch(dbSource, /ALTER TABLE|hasColumn\\(|migrate\\(/, 'first-release database must not retain migration compatibility');\nassert.match(dbSource, /EDBSCHEMA/, 'database schema mismatch must fail closed');\n"""
          if gate not in s:
            if marker not in s: raise SystemExit('verify marker missing')
            s=s.replace(marker,gate+marker,1)
          p.write_text(s)

          p=Path('OPERATIONS.md')
          s=p.read_text()
          note="""\n## First-release database contract\n\nThis product has not shipped a compatible predecessor. Schema 5 is the first supported production database. The service intentionally contains no legacy migration or backfill path: a non-empty database with a different `PRAGMA user_version` fails closed with `EDBSCHEMA`. Delete any pre-release development database and redeploy from a fresh state directory before first production rollout. Future released versions must introduce explicit, tested migrations when compatibility becomes a real product requirement.\n"""
          if '## First-release database contract' not in s:s+=note
          p.write_text(s)

          p=Path('CHANGELOG.md')
          s=p.read_text()
          needle='- Add dedicated GitLab setup and bilingual IM notification documentation.\n'
          add='- Hard-cut the first production database contract at Schema 5: no pre-release migration/backfill compatibility; incompatible development databases fail closed.\n'
          if add not in s:
            if needle not in s: raise SystemExit('changelog marker missing')
            s=s.replace(needle,needle+add,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/hardcut-first-release-once.yml
      - name: Verify
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm pack --dry-run --ignore-scripts
      - name: Commit validated hard cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: hard cut first-release database schema'
          git push origin HEAD:hardcut-first-release-4.1.0

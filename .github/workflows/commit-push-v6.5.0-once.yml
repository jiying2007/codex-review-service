          append('docs/FLOW_TRACKING.md',`## Ordinary Commit Push tracking\n\nService 6.5.0 adds optional \`flowTracking.commitPush\` for ordinary branch updates. It is disabled by default and remains Webhook-only: no diff, commit, or repository API is fetched just to render a notification, and Codex token cost remains zero. Filters include \`refs\`, \`excludeRefs\`, \`ignoreUsers\`, \`maxCommits\`, \`includeMergeCommits\`, and \`includeCommitMessage\`. The default refs are \`main\`, \`release/*\`, and \`hotfix/*\`. One Push Hook produces at most one \`gitlab.push.committed\` event with bounded commit details; branch create/delete remains owned by \`flowTracking.push\` and is never double-classified as a commit push.\n\nFor migration from a standalone GitLab notification bot, enable GitLab Push events, route \`gitlab.push.committed\` through \`notifications.routes[].events\`, validate the target channels, then disable the old bot webhook before stopping the old service.`);
          append('docs/FLOW_TRACKING.zh-CN.md',`## 普通 Commit Push 跟踪\n\nService 6.5.0 新增可选的 \`flowTracking.commitPush\`，用于普通分支更新通知。默认关闭，并继续坚持 Webhook-only：不会为了通知额外读取 diff、commit 或仓库 API，Codex Token 成本仍为 0。可配置 \`refs\`、\`excludeRefs\`、\`ignoreUsers\`、\`maxCommits\`、\`includeMergeCommits\`、\`includeCommitMessage\`；默认只关注 \`main\`、\`release/*\`、\`hotfix/*\`。一次 Push Hook 最多产生一条聚合的 \`gitlab.push.committed\` 事件，Commit 明细有界；Branch create/delete 继续由 \`flowTracking.push\` 负责，不会重复分类。\n\n从独立 GitLab 通知机器人迁移时，先开启 GitLab Push events，把 \`gitlab.push.committed\` 加入对应 \`notifications.routes[].events\`，验证目标群通知后再关闭旧 Bot Webhook 和旧服务。`);
          append('docs/NOTIFICATIONS.md',`## Commit Push notifications\n\n\`gitlab.push.committed\` is a deterministic, aggregated notification. It includes the branch, pusher, before/after range, total commit count, and at most the configured bounded commit summaries. It never fetches extra GitLab diff data and never invokes Codex.`);
          append('docs/NOTIFICATIONS.zh-CN.md',`## Commit Push 通知\n\n\`gitlab.push.committed\` 是确定性的聚合通知：包含 Branch、Pusher、before/after 范围、Commit 总数和配置上限内的 Commit 摘要。该路径不会额外获取 GitLab diff，也绝不调用 Codex。`);
          append('docs/GITLAB_SETUP.md',`## Ordinary Push Hook\n\nEnable GitLab Push events when either Branch create/delete tracking or \`flowTracking.commitPush\` is enabled. Ordinary push updates are filtered locally and never cause an extra GitLab API fetch.`);
          append('docs/GITLAB_SETUP.zh-CN.md',`## 普通 Push Hook\n\n当 Branch create/delete 跟踪或 \`flowTracking.commitPush\` 任一启用时，开启 GitLab Push events。普通 Push 更新只在本地做过滤，不会额外触发 GitLab API 读取。`);

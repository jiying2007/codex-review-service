name: Provider V2 Migrate Once

on:
  push:
    branches: [family/provider-contract-v2]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/provider-contract-v2
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply product migration
        env:
          CORE_SHA: 7878dae982088746c06e4fe747b2468e6af274a2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const readJson=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const writeJson=(f,v)=>fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n');
          const replaceOnce=(t,a,b,f)=>{if(!t.includes(a))throw new Error(`${f}: migration anchor missing: ${a}`);return t.replace(a,b);};

          const pkg=readJson('package.json');pkg.version='7.3.0';writeJson('package.json',pkg);
          const contract=readJson('product-contract.json');
          contract.serviceVersion='7.3.0';contract.productVersion='7.3.0';contract.configSchemaVersion=7;contract.safeCoreVersion='4.12.0';contract.safeCoreCommit=process.env.CORE_SHA;contract.codexRuntimeVersion=2;contract.providerContractVersion=2;writeJson('product-contract.json',contract);

          let config=fs.readFileSync('src/config.js','utf8');
          config=replaceOnce(config,
            "codex:new Set(['path','model','fastModel','home','versionPolicy','allowedVersionPattern','providerMode','providerBaseUrl','apiKeyEnv','connectTimeoutSeconds','requestTimeoutSeconds','streamIdleTimeoutSeconds'])",
            "codex:new Set(['path','model','fastModel','home','versionPolicy','allowedVersionPattern','providerMode','providerBaseUrl','apiKeyEnv','credentialSource','allowInsecureHttp','connectTimeoutSeconds','requestTimeoutSeconds','streamIdleTimeoutSeconds'])",
            'src/config.js');
          config=replaceOnce(config,
            "function normalizeProviderBaseUrl(value,label){let url;try{url=new URL(value);}catch{throw configError(`${label} must be a valid URL`);}if(url.protocol!=='https:'||url.username||url.password||url.search||url.hash)throw configError(`${label} must be an https URL without credentials, query, or fragment`);return url.toString().replace(/\\/$/,'');}",
            "function normalizeProviderBaseUrl(value,label,allowInsecureHttp=false){let url;try{url=new URL(value);}catch{throw configError(`${label} must be a valid URL`);}const loopback=new Set(['localhost','127.0.0.1','::1']).has(url.hostname),protocolOk=url.protocol==='https:'||(url.protocol==='http:'&&(loopback||allowInsecureHttp));if(!protocolOk||url.username||url.password||url.search||url.hash)throw configError(`${label} must use HTTPS unless trusted non-loopback HTTP is explicitly enabled, and must not contain credentials, query, or fragment`);return url.toString().replace(/\\/$/,'');}",
            'src/config.js');
          const oldProvider="codexProviderMode:enumValue(c.providerMode,'openai','codex.providerMode',['openai','openai-compatible']),codexProviderBaseUrl:c.providerMode==='openai-compatible'?normalizeProviderBaseUrl(stringValue(c.providerBaseUrl,'','codex.providerBaseUrl',2048),'codex.providerBaseUrl'):stringValue(c.providerBaseUrl,'','codex.providerBaseUrl',2048),codexProviderApiKeyEnv:stringValue(c.apiKeyEnv,c.providerMode==='openai-compatible'?'CODEX_PROVIDER_API_KEY':'OPENAI_API_KEY','codex.apiKeyEnv',128),";
          const newProvider="codexProviderMode:enumValue(c.providerMode,'openai','codex.providerMode',['openai','openai-compatible']),codexProviderBaseUrl:c.providerMode==='openai-compatible'?normalizeProviderBaseUrl(stringValue(c.providerBaseUrl,'','codex.providerBaseUrl',2048),'codex.providerBaseUrl',boolValue(c.allowInsecureHttp,false,'codex.allowInsecureHttp')):stringValue(c.providerBaseUrl,'','codex.providerBaseUrl',2048),codexProviderApiKeyEnv:stringValue(c.apiKeyEnv,c.providerMode==='openai-compatible'?'CODEX_PROVIDER_API_KEY':'OPENAI_API_KEY','codex.apiKeyEnv',128),codexProviderCredentialSource:enumValue(c.credentialSource,'auto','codex.credentialSource',['auto','env','auth-json']),codexProviderAllowInsecureHttp:boolValue(c.allowInsecureHttp,false,'codex.allowInsecureHttp'),";
          config=replaceOnce(config,oldProvider,newProvider,'src/config.js');
          fs.writeFileSync('src/config.js',config);

          let codex=fs.readFileSync('src/codex.js','utf8');
          codex=replaceOnce(codex,"const http = require('node:http');","const http = require('node:http');\nconst path = require('node:path');",'src/codex.js');
          codex=replaceOnce(codex,
            "{mode,baseUrl:config.codexProviderBaseUrl||'',apiKeyEnv:config.codexProviderApiKeyEnv||'CODEX_PROVIDER_API_KEY'}",
            "{mode,baseUrl:config.codexProviderBaseUrl||'',apiKeyEnv:config.codexProviderApiKeyEnv||'CODEX_PROVIDER_API_KEY',credentialSource:config.codexProviderCredentialSource||'auto',allowInsecureHttp:Boolean(config.codexProviderAllowInsecureHttp),authJsonPath:config.codexHome?path.join(config.codexHome,'auth.json'):''}",
            'src/codex.js');
          fs.writeFileSync('src/codex.js',codex);

          for(const file of ['config.example.json','deploy/docker/config.example.json','deploy/systemd/config.example.json']){
            const value=readJson(file);value.schemaVersion=7;value.codex=value.codex||{};value.codex.credentialSource='auto';value.codex.allowInsecureHttp=false;writeJson(file,value);
          }

          let configTest=fs.readFileSync('test/config.test.js','utf8');
          configTest=replaceOnce(configTest,
            "test('config schema is explicit and hard-cut at v6',()=>{const missing=tempConfig({schemaVersion:undefined,...baseConfig()}),future=tempConfig({schemaVersion:7,...baseConfig()}),old=tempConfig({schemaVersion:5,...baseConfig()});try{assert.equal(CONFIG_SCHEMA_VERSION,6);assert.throws(()=>loadStructuredConfig(missing.file),/Unsupported config schema <missing>/);assert.throws(()=>loadStructuredConfig(future.file),/Unsupported config schema 7/);assert.throws(()=>loadStructuredConfig(old.file),/Unsupported config schema 5/);}",
            "test('config schema is explicit and hard-cut at v7',()=>{const missing=tempConfig({schemaVersion:undefined,...baseConfig()}),future=tempConfig({schemaVersion:8,...baseConfig()}),old=tempConfig({schemaVersion:6,...baseConfig()});try{assert.equal(CONFIG_SCHEMA_VERSION,7);assert.throws(()=>loadStructuredConfig(missing.file),/Unsupported config schema <missing>/);assert.throws(()=>loadStructuredConfig(future.file),/Unsupported config schema 8/);assert.throws(()=>loadStructuredConfig(old.file),/Unsupported config schema 6/);}",
            'test/config.test.js');
          configTest=configTest.replace("test('Config Schema 5 rejects retired sarifFiles and incrementalReviewEnabled", "test('Config Schema 7 rejects retired sarifFiles and incrementalReviewEnabled");
          fs.writeFileSync('test/config.test.js',configTest);

          let codexTest=fs.readFileSync('test/codex.test.js','utf8');
          codexTest=replaceOnce(codexTest,"checkVersionPolicy,SAFE_CONFIG_OVERRIDES}=require('../src/codex');","checkVersionPolicy,SAFE_CONFIG_OVERRIDES,runtimeFromConfig}=require('../src/codex');",'test/codex.test.js');
          codexTest += "\ntest('Provider Contract v2 maps auth.json and private HTTP controls into Core runtime',()=>{const runtime=runtimeFromConfig({codexProviderMode:'openai-compatible',codexProviderBaseUrl:'http://192.168.2.109:3000/v1',codexProviderApiKeyEnv:'RELAY_API_KEY',codexProviderCredentialSource:'auth-json',codexProviderAllowInsecureHttp:true,codexHome:'/home/liujing/.codex'});assert.equal(runtime.provider.credentialSource,'auth-json');assert.equal(runtime.provider.allowInsecureHttp,true);assert.equal(runtime.provider.authJsonPath,'/home/liujing/.codex/auth.json');});\n";
          fs.writeFileSync('test/codex.test.js',codexTest);

          const noteEn=`\n## Provider Contract v2: auth.json and private HTTP\n\nReview Service 7.3.0 / Config Schema 7 adds \`codex.credentialSource\` (\`auto|env|auth-json\`) and \`codex.allowInsecureHttp\` (default \`false\`). \`auto\` prefers \`codex.apiKeyEnv\`, then Core reads \`<codex.home>/auth.json\` when \`codex.home\` is set, otherwise \`${CODEX_HOME}/auth.json\` or \`~/.codex/auth.json\`. The file must use \`auth_mode=apikey\` and \`OPENAI_API_KEY\`. Non-loopback HTTP is accepted only with explicit \`allowInsecureHttp: true\`; repository \`.codex-safe.json\` cannot enable it.\n`;
          const noteZh=`\n## Provider Contract v2：auth.json 与局域网 HTTP\n\nReview Service 7.3.0 / Config Schema 7 新增 \`codex.credentialSource\`（\`auto|env|auth-json\`）和 \`codex.allowInsecureHttp\`（默认 \`false\`）。\`auto\` 优先读取 \`codex.apiKeyEnv\`；若不存在，配置了 \`codex.home\` 时 Core 读取 \`<codex.home>/auth.json\`，否则读取 \`${CODEX_HOME}/auth.json\` 或 \`~/.codex/auth.json\`。文件必须使用 \`auth_mode=apikey\` 并包含 \`OPENAI_API_KEY\`。非 loopback HTTP 只有显式设置 \`allowInsecureHttp: true\` 才允许，仓库 \`.codex-safe.json\` 无权开启。\n`;
          for(const [f,n] of [['docs/CODEX_PROVIDER.md',noteEn],['docs/CODEX_PROVIDER.zh-CN.md',noteZh]]){let t=fs.readFileSync(f,'utf8');if(!t.includes('codex.credentialSource'))t+=n;fs.writeFileSync(f,t);}
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');if(!changelog.includes('## 7.3.0 - 2026-09-01'))changelog=changelog.replace(/^# Changelog\n/,`# Changelog\n\n## 7.3.0 - 2026-09-01\n\n### Provider Contract v2 / Config Schema 7\n\n- Preserve the 7.2.1 / DB Schema 8 product line while pinning Codex Safe Core 4.12.0.\n- Add auto/env/auth-json compatible-provider credential selection with direct codex.home/auth.json support.\n- Add explicit trusted private-network HTTP relay opt-in while retaining HTTPS by default.\n- Keep repository policy unable to supply credentials or weaken provider transport.\n`);fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          git -C src/codex-safe-core fetch origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run docs:generate
          rm .github/workflows/provider-v2-migrate-once.yml
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(service): support auth.json relay credentials"
          git push origin HEAD:family/provider-contract-v2

name: Family v4 Version Migration
on:
  push:
    branches: [family-terminal-hardening]
    paths: [.github/workflows/family-v4-version-migration.yml]
permissions: { contents: write }
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: family-terminal-hardening, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.13.0' }
      - shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['package.json','package-lock.json']){const x=JSON.parse(fs.readFileSync(file,'utf8'));x.version='4.0.0';if(file==='package-lock.json'&&x.packages?.[''])x.packages[''].version='4.0.0';fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');}
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.includes('## 4.0.0')) c=c.replace('# Changelog\n','# Changelog\n\n## 4.0.0 - 2026-08-23\n\n### Codex Safe Family v4 terminal baseline\n\n- Pin Safe Core 4.0.0 and hard-switch GitLab MR Review Receipt to v4 with complete protocol/prompt/model/Codex provenance.\n- Add project-fair queue scheduling, fail-closed isolated Runner capability negotiation, and deterministic new/persistent/resolved/regressed finding lifecycle ledger.\n- Preserve stale-snapshot cancellation, bounded retries, poison-job cutoff, durable SQLite Outbox and provider isolation.\n- Add Scorecard plus immutable TGZ/SPDX-SBOM/SHA256/provenance release assets.\n');
          fs.writeFileSync('CHANGELOG.md',c);
          NODE
          git rm .github/workflows/family-v4-version-migration.yml
          git diff --check
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m 'release: prepare Review Service 4.0.0'
          git push origin HEAD:family-terminal-hardening

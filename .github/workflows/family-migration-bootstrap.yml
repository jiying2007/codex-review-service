name: Family migration bootstrap
on:
  push:
    branches: [family/judgment-lifecycle-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/judgment-lifecycle-v1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Apply deterministic Service 7.0.0 hard cut
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const version='7.0.0',coreVersion='4.11.0',coreSha='8375907712db37492aff1ac0d0013e2753b1f6ab';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=version;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));lock.version=version;if(lock.packages?.[''])lock.packages[''].version=version;fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));Object.assign(pc,{serviceVersion:version,productVersion:version,configSchemaVersion:5,reviewReceiptVersion:5,safeCoreVersion:coreVersion,safeCoreCommit:coreSha,judgmentLifecycleVersion:1});fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          for(const file of ['config.example.json','deploy/systemd/config.example.json','deploy/docker/config.example.json']){const value=JSON.parse(fs.readFileSync(file,'utf8'));value.schemaVersion=5;if(value.review)delete value.review.incrementalReviewEnabled;fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');}
          if(fs.existsSync('.codex-safe.example.json')){const value=JSON.parse(fs.readFileSync('.codex-safe.example.json','utf8'));if(value.$schema)value.$schema=`https://raw.githubusercontent.com/jiying2007/codex-safe-core/${coreSha}/codex-safe.schema.json`;fs.writeFileSync('.codex-safe.example.json',JSON.stringify(value,null,2)+'\n');}
          let config=fs.readFileSync('src/config.js','utf8');
          config=config.replace("'adaptiveContextEnabled','incrementalReviewEnabled','maxContextBytes'","'adaptiveContextEnabled','maxContextBytes'");
          config=config.replace(/incrementalReviewEnabled:boolValue\(r\.incrementalReviewEnabled,true,'review\.incrementalReviewEnabled'\),/g,'');
          if(config.includes('incrementalReviewEnabled'))throw new Error('incrementalReviewEnabled runtime residue remains in src/config.js');
          fs.writeFileSync('src/config.js',config);
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.startsWith('## 7.0.0\n'))changelog=`## 7.0.0\n\n- Hard-cut persistent model-Finding carry-forward and incremental Judgment reuse; every accepted review event now produces a fresh judgment from current evidence.\n- Separate webhook-delivery idempotency from ReviewSubject identity so same-SHA analyzer/pipeline evidence can trigger a new review.\n- Adopt Safe Core 4.11.0 Judgment Lifecycle v1 and Review Receipt v5 with Evidence Manifest identity.\n- Remove the incrementalReviewEnabled configuration surface; historical findings remain post-fresh lifecycle evidence only.\n\n${changelog}`;
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          npm run docs:generate
          echo 'Remaining active legacy references (historical CHANGELOG excluded):'
          grep -R -n -E 'incrementalReviewEnabled|carryForwardFindings|mergeCarriedFindings' src test scripts config.example.json deploy docs README.md README.zh-CN.md OPERATIONS.md LONG_TERM_ASSET.md || true
          rm .github/workflows/family-migration-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(service): finalize 7.0.0 judgment hard cut'
          git push origin HEAD:family/judgment-lifecycle-v1

name: Finalize v6.0.1 CI hygiene

on:
  push:
    branches: [release-v6.0.1-ci-hygiene]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Prepare v6.0.1 hygiene patch
        shell: bash
        run: |
          set -euo pipefail
          npm run release:prepare -- 6.0.1
          python3 - <<'PY'
          from pathlib import Path

          p=Path('OPERATIONS.md')
          p.write_text(p.read_text().rstrip()+"\n")

          p=Path('deploy/docker/compose.yaml')
          t=p.read_text()
          if ':6.0.0}' not in t:
              raise SystemExit('compose version marker drifted')
          p.write_text(t.replace(':6.0.0}', ':6.0.1}', 1))

          for name in ['docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md']:
              p=Path(name); t=p.read_text()
              old='Codex Review Service 6.0.0'
              if old not in t:
                  raise SystemExit(f'{name}: current version marker drifted')
              p.write_text(t.replace(old,'Codex Review Service 6.0.1',1))

          p=Path('CHANGELOG.md'); t=p.read_text()
          old='## 6.0.1\n\n- Release prepared. Replace this line with final release notes before merge.'
          new='## 6.0.1 - 2026-08-28\n\n### CI hygiene patch\n\n- Remove the trailing blank line in `OPERATIONS.md` that caused the post-merge `git diff --check HEAD^ HEAD` gate to fail.\n- Preserve the complete v6.0.0 Reviewer-native trigger behavior, Config Schema 2, database schema, Safe Core pin, and GitLab provider contracts unchanged.'
          if old not in t:
              raise SystemExit('CHANGELOG v6.0.1 placeholder missing')
          p.write_text(t.replace(old,new,1))
          PY
          node scripts/generate-contract-docs.js
          git add -A
          git diff --cached --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts >/dev/null
      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v6.0.1.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore main CI diff hygiene for v6.0.1'
          git push origin HEAD:release-v6.0.1-ci-hygiene

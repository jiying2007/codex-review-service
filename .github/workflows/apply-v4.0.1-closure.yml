name: Apply v4.0.1 closure

on:
  push:
    branches: [v4.0.1-final-closure]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v4.0.1-final-closure
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
      - name: Integrate lifecycle and prepare 4.0.1
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const servicePath='src/service.js';
          let s=fs.readFileSync(servicePath,'utf8');
          const importNeedle="const{buildReviewContext}=require('./context');";
          if(!s.includes(importNeedle)) throw new Error('service import anchor missing');
          s=s.replace(importNeedle, importNeedle+"\nconst{classifyFindingLifecycle}=require('./finding-ledger');");
          const old="planPublication(job,snapshot,review,policy){const actions=[],prefix=`job:${job.id}`;actions.push({projectId:job.project_id,mrIid:job.mr_iid,type:'summary',dedupeKey:`${prefix}:summary`,payload:{headSha:snapshot.headSha,startSha:snapshot.startSha,body:formatSummary(review,snapshot,policy)}});const previous=this.store.priorFindings(job.project_id,job.mr_iid),previousByFingerprint=new Map();";
          const next="planPublication(job,snapshot,review,policy){const actions=[],prefix=`job:${job.id}`,previous=this.store.priorFindings(job.project_id,job.mr_iid),findingLifecycle=classifyFindingLifecycle(review.findings,previous),lifecycleCounts=findingLifecycle.counts,lifecycleText=policy.language==='zh-CN'?`Finding 生命周期：新增 ${lifecycleCounts.new} · 持续 ${lifecycleCounts.persistent} · 已解决 ${lifecycleCounts.resolved} · 回归 ${lifecycleCounts.regressed}`:`Finding lifecycle: new ${lifecycleCounts.new} · persistent ${lifecycleCounts.persistent} · resolved ${lifecycleCounts.resolved} · regressed ${lifecycleCounts.regressed}`;review.findingLifecycle=findingLifecycle;actions.push({projectId:job.project_id,mrIid:job.mr_iid,type:'summary',dedupeKey:`${prefix}:summary`,payload:{headSha:snapshot.headSha,startSha:snapshot.startSha,body:`${formatSummary(review,snapshot,policy)}\\n\\n${lifecycleText}`}});const previousByFingerprint=new Map();";
          if(!s.includes(old)) throw new Error('planPublication anchor missing');
          s=s.replace(old,next);
          fs.writeFileSync(servicePath,s);

          for(const file of ['package.json','package-lock.json']){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.version='4.0.1';
            if(file==='package-lock.json'&&data.packages?.['']) data.packages[''].version='4.0.1';
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.includes('## 4.0.1')) changelog=changelog.replace('# Changelog\n','# Changelog\n\n## 4.0.1 - 2026-08-23\n\n### Final Family v4 closure\n\n- Integrate the deterministic finding lifecycle ledger into the production ReviewService path and persisted run result.\n- Publish lifecycle counts (`new`, `persistent`, `resolved`, `regressed`) in the GitLab review summary.\n');
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          rm .github/workflows/apply-v4.0.1-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/service.js package.json package-lock.json CHANGELOG.md .github/workflows/apply-v4.0.1-closure.yml
          git diff --cached --check
          git commit -m "fix: integrate finding lifecycle into ReviewService"
          git push origin HEAD:v4.0.1-final-closure

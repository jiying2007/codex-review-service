name: Delete docs consistency branch once
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  delete:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs-consistency-v4.0.4'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/docs-consistency-v4.0.4"

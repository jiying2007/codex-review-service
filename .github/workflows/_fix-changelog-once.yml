name: Fix Service 6.5.2 Changelog Once
on:
  push:
    branches: [chore/core-4.10.2]
    paths: [.github/workflows/_fix-changelog-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/core-4.10.2
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '24.19.0'
      - name: Add 6.5.2 release heading
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='CHANGELOG.md';
          let text=fs.readFileSync(file,'utf8');
          if(!/^## 6\.5\.2\b/m.test(text)) {
            const entry='## 6.5.2\n\n- Repin to immutable Safe Core v4.10.2 (`cd9788f1280a217fbe6d0beb59682a85a8b82c4d`) so Review Service remains on the same Family trust root as the VS Code SCM UI Contract release.\n- Preserve Database Schema 7, Config Schema 4, Review Receipt v4, Safe Contract v2, GitLab compatibility boundaries, and service runtime behavior.\n\n';
            text=entry+text;
            fs.writeFileSync(file,text);
          }
          NODE
          git add CHANGELOG.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: add Review Service 6.5.2 release note'
          git push origin HEAD:chore/core-4.10.2

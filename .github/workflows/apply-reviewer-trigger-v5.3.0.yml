name: Apply reviewer-native trigger hard cut

on:
  push:
    branches: [reviewer-trigger-v5.3.0]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply patch
        run: python3 scripts/apply-reviewer-trigger-v5.3.0.py
      - name: Generate contract docs
        run: node scripts/generate-contract-docs.js
      - name: Verify no legacy trigger residue
        shell: bash
        run: |
          if grep -R -n --exclude-dir=.git --exclude='CHANGELOG.md' -E 'requiredAssigneeUserIds|manualReviewBypassAssignee|assigneeMatch' .; then
            echo 'Legacy Assignee-only trigger residue remains.' >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts >/dev/null
      - name: Commit final feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: trigger GitLab reviews from Reviewer assignments'
          git push origin HEAD:reviewer-trigger-v5.3.0

name: Apply reviewer-native trigger hard cut

on:
  push:
    branches: [reviewer-trigger-v5.3.0]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply patch
        run: |
          python3 scripts/apply-reviewer-trigger-v5.3.0.py
          python3 scripts/apply-reviewer-trigger-reconcile.py
          python3 scripts/finalize-reviewer-trigger-v6.0.0.py
      - name: Generate contract docs
        run: |
          node scripts/generate-contract-docs.js
          git add -A
      - name: Verify hard-cut runtime and current-state residue
        shell: bash
        run: |
          if grep -R -n -E 'requiredAssigneeUserIds|manualReviewBypassAssignee|assigneeMatch' src --exclude-dir=codex-safe-core; then
            echo 'Legacy Assignee-only trigger runtime residue remains.' >&2
            exit 1
          fi
          if grep -R -n -E '5\.2\.2|5\.3\.0|Config Schema 1|schemaVersion: 1|"schemaVersion": 1' README.md README.zh-CN.md OPERATIONS.md SECURITY.md LONG_TERM_ASSET.md SUPPORT.md VERIFY_RELEASE.md docs deploy/docker/README.md deploy/docker/compose.yaml --exclude-dir=codex-safe-core; then
            echo 'Stale current-state v5/config-schema-1 facts remain.' >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts >/dev/null
      - name: Commit final feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat!: trigger GitLab reviews from Reviewer assignments'
          git push origin HEAD:reviewer-trigger-v5.3.0

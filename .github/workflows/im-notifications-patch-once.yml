          test('secret refs and retry classification are closed',()=>{assert.equal(secretEnvName('service-alerts'),'CODEX_REVIEW_NOTIFY_SERVICE_ALERTS_WEBHOOK');assert.equal(retryableNotification({code:'ENOTIFYNETWORK'}),true);assert.equal(retryableNotification({code:'ENOTIFYREMOTE'}),false);});
          ''')
          write('test/docker-governance.test.js',r'''\

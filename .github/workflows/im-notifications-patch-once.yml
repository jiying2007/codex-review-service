name: IM Notifications Patch Once

on:
  push:
    branches: [feature/im-notifications-4.1.0]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[im-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22'
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('.')
          def read(p): return (root/p).read_text()
          def write(p,s):
              p=root/p; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(s)
          def rep(p,a,b):
              s=read(p)
              if a not in s: raise SystemExit(f'missing replacement in {p}: {a[:80]}')
              write(p,s.replace(a,b))

          notification_js=r'''\
          'use strict';

          const EVENTS=Object.freeze(['review.completed','review.blocked','review.failed','service.degraded','service.recovered']);
          function notifyError(message,code='ENOTIFY'){const error=new Error(message);error.code=code;return error;}
          function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
          function counts(findings=[]){const out={critical:0,high:0,medium:0,low:0,info:0};for(const f of findings)if(Object.hasOwn(out,f.severity))out[f.severity]++;return out;}
          function secretEnvName(ref){return `CODEX_REVIEW_NOTIFY_${String(ref).toUpperCase().replace(/[^A-Z0-9]+/g,'_')}_WEBHOOK`;}
          function webhookFor(route,env=process.env){const name=secretEnvName(route.secretRef),value=String(env[name]||'').trim();if(!value)throw notifyError(`${name} is required for notification route ${route.name}`,'ENOTIFYSECRET');let url;try{url=new URL(value);}catch{throw notifyError(`${name} must be a valid HTTPS URL`,'ENOTIFYSECRET');}if(url.protocol!=='https:'||url.username||url.password||url.hash)throw notifyError(`${name} must be a credential-free HTTPS URL`,'ENOTIFYSECRET');const host=url.hostname.toLowerCase();if(route.provider==='feishu'&&!['open.feishu.cn','open.larksuite.com'].includes(host))throw notifyError(`${name} must use an official Feishu/Lark bot host`,'ENOTIFYSECRET');if(route.provider==='wecom'&&host!=='qyapi.weixin.qq.com')throw notifyError(`${name} must use qyapi.weixin.qq.com`,'ENOTIFYSECRET');return value;}
          async function prepareNotificationRoutes(gitlab,config){if(!config.notificationEnabled)return Object.freeze({...config,notificationRoutesResolved:Object.freeze([])});const resolved=[];for(const route of config.notificationRoutes){const projectIds=new Set(route.projects);for(const groupId of route.groups){const page=await gitlab.paginated(`/groups/${encodeURIComponent(groupId)}/projects`,{include_subgroups:'true',archived:'false',with_merge_requests_enabled:'true',simple:'true'});if(!page?.complete)throw notifyError(`Notification route ${route.name} group ${groupId} discovery incomplete`,'ENOTIFYROUTE');for(const project of page.items||[]){const id=Number(project?.id||0);if(Number.isInteger(id)&&id>0)projectIds.add(id);}}if(!route.projects.length&&!route.groups.length)for(const id of config.gitlabProjectAllowlist||[])projectIds.add(Number(id));for(const id of projectIds)if(config.gitlabProjectAllowlist&&!config.gitlabProjectAllowlist.has(Number(id)))throw notifyError(`Notification route ${route.name} includes out-of-scope project ${id}`,'ENOTIFYROUTE');const finalRoute=Object.freeze({...route,projectIds:Object.freeze([...projectIds].sort((a,b)=>a-b))});webhookFor(finalRoute);resolved.push(finalRoute);}return Object.freeze({...config,notificationRoutesResolved:Object.freeze(resolved)});}
          function eventForReview({job,mr,snapshot,review,durationMs,topFindings=3}){const type=review.verdict==='block'||review.verdict==='incomplete'?'review.blocked':'review.completed';return Object.freeze({type,projectId:Number(job.project_id),mrIid:Number(job.mr_iid),title:String(mr?.title||snapshot?.title||''),url:String(mr?.web_url||''),author:String(mr?.author?.name||mr?.author?.username||''),sourceBranch:String(snapshot?.sourceBranch||job.source_branch||''),targetBranch:String(snapshot?.targetBranch||mr?.target_branch||''),headSha:String(snapshot?.headSha||job.head_sha||''),verdict:String(review.verdict||''),coverageComplete:review.coverageComplete!==false,findingCounts:counts(review.findings),findingCount:Number(review.findings?.length||0),topFindings:(review.findings||[]).slice(0,topFindings).map(f=>({severity:f.severity,title:f.title,file:f.file,line:f.line})),durationMs:Number(durationMs||0)});}
          function eventForFailure(job,code){return Object.freeze({type:'review.failed',projectId:Number(job.project_id),mrIid:Number(job.mr_iid),title:'',url:'',author:'',sourceBranch:String(job.source_branch||''),targetBranch:'',headSha:String(job.head_sha||''),verdict:'failed',coverageComplete:false,findingCounts:counts([]),findingCount:0,topFindings:[],durationMs:0,errorCode:String(code||'EUNKNOWN')});}
          function systemEvent(type,details={}){if(!EVENTS.includes(type)||!type.startsWith('service.'))throw notifyError(`Unsupported system notification event: ${type}`,'ENOTIFYEVENT');return Object.freeze({type,projectId:0,mrIid:0,title:'Codex Review Service',url:'',author:'',sourceBranch:'',targetBranch:'',headSha:'',verdict:type==='service.recovered'?'recovered':'degraded',coverageComplete:false,findingCounts:counts([]),findingCount:0,topFindings:[],durationMs:0,details});}
          function planNotificationActions(config,event,runKey){if(!config.notificationEnabled)return[];const actions=[];for(const route of config.notificationRoutesResolved||[]){const events=route.events.length?route.events:config.notificationEvents;if(!events.includes(event.type))continue;if(!event.type.startsWith('service.')&&!route.projectIds.includes(Number(event.projectId)))continue;actions.push({routeName:route.name,provider:route.provider,secretRef:route.secretRef,eventType:event.type,dedupeKey:`${runKey}:${route.name}:${event.type}`,payload:event});}return actions;}
          function titleFor(event){if(event.type==='review.blocked')return'🔴 Codex Review Blocked';if(event.type==='review.failed')return'⚠️ Codex Review Failed';if(event.type==='service.degraded')return'⚠️ Codex Review Service Degraded';if(event.type==='service.recovered')return'🟢 Codex Review Service Recovered';return'🟢 Codex Review Completed';}
          function summaryLines(event){const c=event.findingCounts||counts([]),lines=[];if(event.projectId)lines.push(`Project: ${event.projectId}`,`MR: !${event.mrIid}${event.title?` ${event.title}`:''}`);lines.push(`Verdict: ${event.verdict}`);if(event.headSha)lines.push(`HEAD: ${event.headSha.slice(0,12)}`);if(event.projectId)lines.push(`Findings: Critical ${c.critical} · High ${c.high} · Medium ${c.medium} · Low ${c.low}`);if(event.durationMs)lines.push(`Duration: ${(event.durationMs/1000).toFixed(1)}s`);if(event.errorCode)lines.push(`Error: ${event.errorCode}`);return lines;}
          function feishuPayload(event){const elements=[{tag:'markdown',content:summaryLines(event).join('\n')}];if(event.topFindings?.length)elements.push({tag:'markdown',content:`**Top findings**\n${event.topFindings.map((f,i)=>`${i+1}. ${f.severity.toUpperCase()} · ${f.title} (${f.file}:${f.line})`).join('\n')}`});if(event.url)elements.push({tag:'action',actions:[{tag:'button',text:{tag:'plain_text',content:'View Merge Request'},url:event.url,type:'primary'}]});return{msg_type:'interactive',card:{header:{title:{tag:'plain_text',content:titleFor(event)}},elements}};}
          function wecomPayload(event){const horizontal_content_list=summaryLines(event).slice(0,6).map(line=>{const idx=line.indexOf(':');return{keyname:idx>0?line.slice(0,idx):'Status',value:idx>0?line.slice(idx+1).trim():line};});const card={card_type:'text_notice',source:{desc:'Codex Review Service'},main_title:{title:titleFor(event),desc:event.title||''},horizontal_content_list};if(event.topFindings?.length)card.sub_title_text=event.topFindings.map((f,i)=>`${i+1}. [${f.severity}] ${f.title} ${f.file}:${f.line}`).join('\n').slice(0,512);if(event.url)card.jump_list=[{type:1,url:event.url,title:'View Merge Request'}];return{msgtype:'template_card',template_card:card};}
          function payloadFor(provider,event){if(provider==='feishu')return feishuPayload(event);if(provider==='wecom')return wecomPayload(event);throw notifyError(`Unsupported notification provider: ${provider}`,'ENOTIFYPROVIDER');}
          async function postWebhook(url,payload,timeoutMs){let response;try{response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(timeoutMs)});}catch(cause){const error=notifyError('Notification network request failed','ENOTIFYNETWORK');error.cause=cause;throw error;}let body={};try{body=await response.json();}catch{}if(!response.ok){const error=notifyError(`Notification HTTP ${response.status}`,'ENOTIFYHTTP');error.status=response.status;throw error;}if(Object.hasOwn(body,'errcode')&&Number(body.errcode)!==0)throw notifyError(`WeCom rejected notification: ${body.errcode}`,'ENOTIFYREMOTE');if((Object.hasOwn(body,'code')&&Number(body.code)!==0)||(Object.hasOwn(body,'StatusCode')&&Number(body.StatusCode)!==0))throw notifyError('Feishu rejected notification','ENOTIFYREMOTE');return body;}
          function retryableNotification(error){if(!error)return true;if(error.code==='ENOTIFYHTTP'){const s=Number(error.status);return[408,409,425,429].includes(s)||s>=500;}return['ENOTIFYNETWORK'].includes(error.code);}
          function notificationDelay(config,item){const base=Math.min(config.notificationRetryMaxDelayMs,config.notificationRetryBaseDelayMs*(2**Math.max(0,item.attempt-1)));return Math.round(base*(0.85+Math.random()*0.3));}
          class Notifier{constructor({config,store,logger=console,env=process.env}){this.config=config;this.store=store;this.logger=logger;this.env=env;this.stopping=false;this.workers=[];this.routes=new Map((config.notificationRoutesResolved||[]).map(r=>[r.name,r]));}async execute(item){const route=this.routes.get(item.route_name);if(!route)throw notifyError(`Notification route disappeared: ${item.route_name}`,'ENOTIFYROUTE');const url=webhookFor(route,this.env),payload=payloadFor(route.provider,item.payload);await postWebhook(url,payload,this.config.notificationRequestTimeoutMs);return{remoteId:`${route.provider}:${route.name}`};}async process(item){try{const result=await this.execute(item);this.store.finishNotification(item.id,result.remoteId);this.logger.info?.({event:'notification_delivered',outboxId:item.id,route:item.route_name,provider:item.provider,eventType:item.event_type,attempt:item.attempt});}catch(error){const retry=item.attempt<this.config.maxNotificationAttempts&&retryableNotification(error)&&!this.stopping;this.logger.warn?.({event:retry?'notification_retry':'notification_failed',outboxId:item.id,route:item.route_name,provider:item.provider,eventType:item.event_type,attempt:item.attempt,code:error.code||'ENOTIFY',status:error.status||null});if(retry)this.store.retryNotification(item.id,error.code||'ENOTIFY',notificationDelay(this.config,item));else this.store.failNotification(item.id,error.code||'ENOTIFY');}}async workerLoop(id){while(!this.stopping){const item=this.store.claimNotification();if(!item){await sleep(this.config.notificationPollIntervalMs);continue;}await this.process(item);}}start(){if(!this.config.notificationEnabled||this.workers.length)return this.workers;this.workers=Array.from({length:this.config.notificationConcurrency},(_,i)=>this.workerLoop(i+1).catch(error=>{this.logger.error?.({event:'notifier_crashed',workerId:i+1,code:error.code||'ENOTIFIER'});throw error;}));return this.workers;}async stop(){this.stopping=true;await Promise.allSettled(this.workers);}}
          module.exports={EVENTS,Notifier,prepareNotificationRoutes,eventForReview,eventForFailure,systemEvent,planNotificationActions,payloadFor,feishuPayload,wecomPayload,secretEnvName,webhookFor,retryableNotification,notificationDelay,postWebhook};
          '''
          write('src/notification.js',notification_js)

          # Config schema + parser.
          rep('src/config.js',"const TOP_KEYS=new Set(['server','gitlab','webhook','review','codex','runner','publication','lifecycle','observability']);","const TOP_KEYS=new Set(['server','gitlab','webhook','review','codex','runner','publication','notifications','lifecycle','observability']);")
          rep('src/config.js',"  publication:new Set(['concurrency','pollIntervalMs','maxAttempts']),","  publication:new Set(['concurrency','pollIntervalMs','maxAttempts']),\n  notifications:new Set(['enabled','concurrency','pollIntervalMs','maxAttempts','retryBaseDelayMs','retryMaxDelayMs','requestTimeoutMs','topFindings','events','routes']),")
          marker="function validateSigningToken(value)"
          insert=r'''const NOTIFICATION_EVENTS=Object.freeze(['review.completed','review.blocked','review.failed','service.degraded','service.recovered']);
          function parseNotificationEvents(value,label='notifications.events'){if(value===undefined)return['review.blocked','review.failed','service.degraded'];if(!Array.isArray(value)||value.length>NOTIFICATION_EVENTS.length)throw configError(`${label} must be an array`);const out=[];for(const raw of value){const item=stringValue(raw,'',label,64);if(!NOTIFICATION_EVENTS.includes(item))throw configError(`${label} contains unsupported event: ${item}`);if(!out.includes(item))out.push(item);}return out;}
          function parseNotificationRoutes(value){if(value===undefined)return[];if(!Array.isArray(value)||value.length>100)throw configError('notifications.routes must be an array');const names=new Set(),routes=[];for(const raw of value){const item=assertObject(raw,'notifications.routes[]');assertKeys(item,new Set(['name','provider','secretRef','projects','groups','events']),'notifications.routes[]');const name=stringValue(item.name,'','notifications.routes[].name',64);if(!/^[a-zA-Z0-9._-]+$/.test(name)||names.has(name))throw configError('notifications.routes[].name must be unique and use [a-zA-Z0-9._-]');names.add(name);const provider=enumValue(item.provider,'','notifications.routes[].provider',['feishu','wecom']),secretRef=stringValue(item.secretRef,'','notifications.routes[].secretRef',64);if(!/^[a-zA-Z0-9._-]+$/.test(secretRef))throw configError('notifications.routes[].secretRef is invalid');routes.push(Object.freeze({name,provider,secretRef,projects:Object.freeze(positiveIds(item.projects,'notifications.routes[].projects')),groups:Object.freeze(positiveIds(item.groups,'notifications.routes[].groups')),events:Object.freeze(parseNotificationEvents(item.events,'notifications.routes[].events'))}));}return routes;}
          '''
          s=read('src/config.js'); s=s.replace(marker,insert+marker); write('src/config.js',s)
          rep('src/config.js',"c=structured.value.codex,runner=structured.value.runner,pub=structured.value.publication,life=structured.value.lifecycle,obs=structured.value.observability;","c=structured.value.codex,runner=structured.value.runner,pub=structured.value.publication,n=structured.value.notifications,life=structured.value.lifecycle,obs=structured.value.observability;")
          rep('src/config.js',"    publisherConcurrency:intValue(pub.concurrency,2,'publication.concurrency',1,8),publisherPollIntervalMs:intValue(pub.pollIntervalMs,500,'publication.pollIntervalMs',50,60000),maxPublishAttempts:intValue(pub.maxAttempts,8,'publication.maxAttempts',1,50),","    publisherConcurrency:intValue(pub.concurrency,2,'publication.concurrency',1,8),publisherPollIntervalMs:intValue(pub.pollIntervalMs,500,'publication.pollIntervalMs',50,60000),maxPublishAttempts:intValue(pub.maxAttempts,8,'publication.maxAttempts',1,50),\n    notificationEnabled:boolValue(n.enabled,false,'notifications.enabled'),notificationConcurrency:intValue(n.concurrency,2,'notifications.concurrency',1,8),notificationPollIntervalMs:intValue(n.pollIntervalMs,500,'notifications.pollIntervalMs',50,60000),maxNotificationAttempts:intValue(n.maxAttempts,8,'notifications.maxAttempts',1,50),notificationRetryBaseDelayMs:intValue(n.retryBaseDelayMs,5000,'notifications.retryBaseDelayMs',100,600000),notificationRetryMaxDelayMs:intValue(n.retryMaxDelayMs,1800000,'notifications.retryMaxDelayMs',1000,86400000),notificationRequestTimeoutMs:intValue(n.requestTimeoutMs,10000,'notifications.requestTimeoutMs',1000,120000),notificationTopFindings:intValue(n.topFindings,3,'notifications.topFindings',0,10),notificationEvents:Object.freeze(parseNotificationEvents(n.events)),notificationRoutes:Object.freeze(parseNotificationRoutes(n.routes)),")
          rep('src/config.js',"  });\n}\nmodule.exports={loadConfig,loadStructuredConfig,validateSigningToken,normalizeBaseUrl,defaultConfigPath,defaultStateDir,defaultRunnerSocket,resolveXdgHome,SEVERITIES,parseGroups,positiveIds,configError};","  });\n}\nmodule.exports={loadConfig,loadStructuredConfig,validateSigningToken,normalizeBaseUrl,defaultConfigPath,defaultStateDir,defaultRunnerSocket,resolveXdgHome,SEVERITIES,parseGroups,positiveIds,configError,parseNotificationEvents,parseNotificationRoutes,NOTIFICATION_EVENTS};")
          # Fail closed if enabled without route after config is built.
          rep('src/config.js',"  const runnerMode=enumValue(runner.mode,'inline','runner.mode',['inline','isolated']),runnerSocket=stringValue(runner.socket,defaultRunnerSocket(),'runner.socket',2048);","  const notificationEnabled=boolValue(n.enabled,false,'notifications.enabled'),notificationRoutes=parseNotificationRoutes(n.routes);if(notificationEnabled&&!notificationRoutes.length)throw configError('notifications.enabled requires at least one notifications.routes entry');\n  const runnerMode=enumValue(runner.mode,'inline','runner.mode',['inline','isolated']),runnerSocket=stringValue(runner.socket,defaultRunnerSocket(),'runner.socket',2048);")
          rep('src/config.js',"notificationEnabled:boolValue(n.enabled,false,'notifications.enabled')","notificationEnabled")
          rep('src/config.js',"notificationRoutes:Object.freeze(parseNotificationRoutes(n.routes))","notificationRoutes:Object.freeze(notificationRoutes)")

          # DB schema 5 and durable notification outbox.
          rep('src/db.js','const SCHEMA_VERSION = 4;','const SCHEMA_VERSION = 5;')
          rep('src/db.js',"      CREATE TABLE IF NOT EXISTS publication_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL,mr_iid INTEGER NOT NULL,action_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);","      CREATE TABLE IF NOT EXISTS publication_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL,mr_iid INTEGER NOT NULL,action_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);\n      CREATE TABLE IF NOT EXISTS notification_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL DEFAULT 0,mr_iid INTEGER NOT NULL DEFAULT 0,route_name TEXT NOT NULL,provider TEXT NOT NULL,secret_ref TEXT NOT NULL,event_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);")
          rep('src/db.js',"CREATE INDEX IF NOT EXISTS idx_outbox_run ON publication_outbox(run_id,id);PRAGMA user_version=${SCHEMA_VERSION};","CREATE INDEX IF NOT EXISTS idx_outbox_run ON publication_outbox(run_id,id);CREATE INDEX IF NOT EXISTS idx_notification_status_available ON notification_outbox(status,available_at,id);CREATE INDEX IF NOT EXISTS idx_notification_run ON notification_outbox(run_id,id);PRAGMA user_version=${SCHEMA_VERSION};")
          rep('src/db.js',"  publicationDepth(){return Number(this.db.prepare(\"SELECT COUNT(*) count FROM publication_outbox WHERE status='pending'\").get().count);}","  publicationDepth(){return Number(this.db.prepare(\"SELECT COUNT(*) count FROM publication_outbox WHERE status='pending'\").get().count);}\n  notificationDepth(){return Number(this.db.prepare(\"SELECT COUNT(*) count FROM notification_outbox WHERE status='pending'\").get().count);}")
          rep('src/db.js',"  recoverPublications(){return this.db.prepare(\"UPDATE publication_outbox SET status='pending',started_at=NULL,error_code='ESERVICERESTART',available_at=? WHERE status='publishing'\").run(new Date().toISOString()).changes;}","  recoverPublications(){return this.db.prepare(\"UPDATE publication_outbox SET status='pending',started_at=NULL,error_code='ESERVICERESTART',available_at=? WHERE status='publishing'\").run(new Date().toISOString()).changes;}\n  recoverNotifications(){return this.db.prepare(\"UPDATE notification_outbox SET status='pending',started_at=NULL,error_code='ESERVICERESTART',available_at=? WHERE status='delivering'\").run(new Date().toISOString()).changes;}")
          rep('src/db.js',"  getJob(id){return this.db.prepare('SELECT * FROM review_jobs WHERE id=?').get(id)||null;}","  claimNotification(){return this.withTransaction(()=>{const now=new Date().toISOString(),row=this.db.prepare(`SELECT * FROM notification_outbox WHERE status='pending' AND available_at<=? ORDER BY id LIMIT 1`).get(now);if(!row)return null;const result=this.db.prepare(\"UPDATE notification_outbox SET status='delivering',started_at=?,attempt=attempt+1 WHERE id=? AND status='pending'\").run(now,row.id);if(result.changes!==1)return null;const value=this.db.prepare('SELECT * FROM notification_outbox WHERE id=?').get(row.id);value.payload=parseJson(value.payload_json);return value;});}\n  getJob(id){return this.db.prepare('SELECT * FROM review_jobs WHERE id=?').get(id)||null;}")
          rep('src/db.js',"  saveRunWithOutbox(jobId,review,durationMs,policy,actions,receiptProjection=null){","  saveRunWithOutbox(jobId,review,durationMs,policy,actions,receiptProjection=null,notificationActions=[]){")
          rep('src/db.js',"for(const action of actions||[])insertAction.run(runId,action.projectId,action.mrIid,action.type,action.dedupeKey,json(action.payload),now,now);return runId;});}","for(const action of actions||[])insertAction.run(runId,action.projectId,action.mrIid,action.type,action.dedupeKey,json(action.payload),now,now);const insertNotify=this.db.prepare(`INSERT OR IGNORE INTO notification_outbox(run_id,project_id,mr_iid,route_name,provider,secret_ref,event_type,dedupe_key,payload_json,status,available_at,created_at) VALUES(?,?,?,?,?,?,?,?,?,'pending',?,?)`);for(const action of notificationActions||[])insertNotify.run(runId,action.payload?.projectId||0,action.payload?.mrIid||0,action.routeName,action.provider,action.secretRef,action.eventType,action.dedupeKey,json(action.payload),now,now);return runId;});}")
          rep('src/db.js',"  finishPublication(id,remoteId=null){","  enqueueNotification({runId=null,routeName,provider,secretRef,eventType,dedupeKey,payload,delayMs=0}){const now=new Date().toISOString();try{const result=this.db.prepare(`INSERT INTO notification_outbox(run_id,project_id,mr_iid,route_name,provider,secret_ref,event_type,dedupe_key,payload_json,status,available_at,created_at) VALUES(?,?,?,?,?,?,?,?,?,'pending',?,?)`).run(runId,payload?.projectId||0,payload?.mrIid||0,routeName,provider,secretRef,eventType,dedupeKey,json(payload),isoAfter(delayMs),now);return Number(result.lastInsertRowid);}catch(error){if(String(error.message).includes('UNIQUE constraint failed'))return null;throw error;}}\n  finishNotification(id,remoteId=null){this.db.prepare(\"UPDATE notification_outbox SET status='delivered',remote_id=?,error_code=NULL,finished_at=? WHERE id=?\").run(remoteId,new Date().toISOString(),id);}\n  retryNotification(id,errorCode,delayMs){this.db.prepare(\"UPDATE notification_outbox SET status='pending',error_code=?,started_at=NULL,available_at=? WHERE id=? AND status='delivering'\").run(errorCode,isoAfter(delayMs),id);}\n  failNotification(id,errorCode){this.db.prepare(\"UPDATE notification_outbox SET status='failed',error_code=?,finished_at=? WHERE id=?\").run(errorCode,new Date().toISOString(),id);}\n  finishPublication(id,remoteId=null){")
          rep('src/db.js',"stats(){const jobs=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM review_jobs GROUP BY status').all().map(r=>[r.status,Number(r.count)])),publications=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM publication_outbox GROUP BY status').all().map(r=>[r.status,Number(r.count)])),usage=","stats(){const jobs=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM review_jobs GROUP BY status').all().map(r=>[r.status,Number(r.count)])),publications=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM publication_outbox GROUP BY status').all().map(r=>[r.status,Number(r.count)])),notifications=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM notification_outbox GROUP BY status').all().map(r=>[r.status,Number(r.count)])),usage=")
          rep('src/db.js',"return{jobs,publications,webhookCount:","return{jobs,publications,notifications,webhookCount:")


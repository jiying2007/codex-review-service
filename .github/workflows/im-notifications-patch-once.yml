          # Documentation.
          write('docs/NOTIFICATIONS.md',r'''# IM Notifications

          Codex Review Service can deliver deterministic review cards to Feishu/Lark and WeCom group robots. Notifications are an attention channel only: SQLite remains the durable service source of truth and GitLab remains the review system of record.

          ## Reliability model

          A completed review is persisted with GitLab publication actions and notification actions in the same SQLite transaction. `notification_outbox` has independent retries, idempotency keys and terminal failed state. Notification failure never changes a review verdict and never reruns Codex.

          ## Configuration

          Enable `notifications.enabled` and define routes. Routes may target explicit `projects`, GitLab `groups`, or all resolved service projects when both are empty. Each route chooses `feishu` or `wecom`, a `secretRef`, and optional event filtering.

          `secretRef: "embedded"` resolves only from `CODEX_REVIEW_NOTIFY_EMBEDDED_WEBHOOK`. Webhook URLs are never stored in JSON or SQLite. Feishu routes require official `open.feishu.cn`/`open.larksuite.com` bot URLs; WeCom routes require `qyapi.weixin.qq.com`.

          Default events are intentionally noisy-event safe: `review.blocked`, `review.failed`, and `service.degraded`. Add `review.completed` explicitly for audit channels.

          ## Cards

          Cards are deterministic local renderings of validated review data. They include verdict, MR identity, short HEAD SHA, severity counts, duration, up to `topFindings`, and an MR link. They never include raw diff, prompts, secrets, full receipts, or unvalidated model claims.

          ## Retry and dead letter

          Retry applies only to network errors, HTTP 408/409/425/429 and 5xx. Permanent provider/configuration errors fail closed into `notification_outbox.status=failed`. Prometheus metrics expose queue and delivery state.
          ''')
          write('docs/NOTIFICATIONS.zh-CN.md',r'''# IM 通知

          Codex Review Service 支持把确定性 Review 卡片推送到飞书/Lark与企业微信群机器人。IM 只负责吸引注意力：SQLite 仍是 Service durable source of truth，GitLab 仍是 Review system of record。

          ## 可靠性模型

          Review 完成后，GitLab publication actions 与 notification actions 在同一个 SQLite transaction 中持久化。`notification_outbox` 独立重试、独立幂等、独立进入 failed 终态；通知失败不会改变 Review Verdict，也绝不会重新运行 Codex。

          ## 配置

          开启 `notifications.enabled` 并配置 routes。Route 可按明确 `projects`、GitLab `groups` 路由；两者都为空时表示当前 Service 已解析的全部 Project。每个 Route 指定 `feishu` 或 `wecom`、`secretRef` 与可选事件过滤。

          `secretRef: "embedded"` 只从 `CODEX_REVIEW_NOTIFY_EMBEDDED_WEBHOOK` 读取。Webhook URL 不进入 JSON 或 SQLite。飞书只允许官方 `open.feishu.cn`/`open.larksuite.com` Bot URL；企业微信只允许 `qyapi.weixin.qq.com`。

          默认事件保持克制：`review.blocked`、`review.failed`、`service.degraded`。需要审计群时显式增加 `review.completed`。

          ## 卡片

          卡片完全由本地确定性 formatter 生成，只使用已验证 Review Data，包括 Verdict、MR、短 HEAD、Severity 数量、耗时、最多 `topFindings` 条 Finding 和 MR 链接。不会推送 raw diff、Prompt、Secret、完整 Receipt，也不会让 AI 自由生成卡片文案。

          ## 重试与 Dead Letter

          仅网络错误、HTTP 408/409/425/429 与 5xx 自动重试。Provider/配置永久错误进入 `notification_outbox.status=failed`，Prometheus Metrics 暴露通知 Queue 与终态。
          ''')
          write('docs/GITLAB_SETUP.md',"# GitLab setup\n\n1. Create a Group or Project Access Token with only required API scope.\n2. Configure Project IDs and/or Group IDs in `config.json`.\n3. Configure GitLab 19.1+ Standard Webhooks Signing Token and set the same `GITLAB_WEBHOOK_SIGNING_TOKEN`.\n4. Add webhook URL `https://<host>/webhooks/gitlab` with Merge request events and Note events.\n5. Run `npm run doctor`, then verify `/health/ready`.\n6. Create or update a test MR and confirm GitLab status/summary/discussions.\n7. If IM notifications are enabled, confirm the configured Feishu/WeCom route receives the deterministic card.\n")
          write('docs/GITLAB_SETUP.zh-CN.md',"# GitLab 接入\n\n1. 创建只包含必要 API 权限的 Group/Project Access Token。\n2. 在 `config.json` 配置 Project ID 和/或 Group ID。\n3. 配置 GitLab 19.1+ Standard Webhooks Signing Token，并使用同一个 `GITLAB_WEBHOOK_SIGNING_TOKEN`。\n4. 添加 Webhook `https://<host>/webhooks/gitlab`，开启 Merge request events 与 Note events。\n5. 运行 `npm run doctor`，再确认 `/health/ready`。\n6. 创建或更新测试 MR，验证 GitLab Status/Summary/Discussion。\n7. 如已启用 IM 通知，确认飞书/企业微信 Route 收到确定性卡片。\n")


name: Prepare v6.2.1 once

on:
  push:
    branches: [codeql-v4.37.9-paired]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Prepare governance patch release and self-delete
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.js prepare 6.2.1
          while IFS= read -r file; do
            sed -i 's/6\.2\.0/6.2.1/g' "$file"
          done < <(git grep -Il '6\.2\.0' -- ':!CHANGELOG.md' || true)
          node scripts/generate-contract-docs.js
          node - <<'NODE'
          const fs=require('node:fs');
          const p='CHANGELOG.md';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('## 6.2.1\n\n- Release prepared. Replace this line with final release notes before merge.',`## 6.2.1 - 2026-08-29\n\n- Maintenance-only supply-chain refresh; product behavior and schemas are unchanged.\n- Update actions/setup-node to the verified 94196ee commit.\n- Update actions/dependency-review-action to v5.0.0 at verified a1d282b commit.\n- Update CodeQL init/analyze together to v4.37.9 at verified cdf488f commit and synchronize the governance pin.\n- Preserve exact Codex Safe Core v4.8.0 pin e75d27d5f157cacc5e8f6b711355dd5cf4ddfe34.`);
          fs.writeFileSync(p,s);
          NODE
          rm .github/workflows/prepare-v6.2.1-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): prepare Service v6.2.1'
          git push origin HEAD:codeql-v4.37.9-paired

name: Temporary Service Shadow Audit Repair

on:
  push:
    branches: ["feat/model-routing-v1-runtime"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/model-routing-v1-runtime
          fetch-depth: 0
      - name: Isolate shadow from production identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:100]}')
              p.write_text(text.replace(old,new,1))
          rep('src/model-routing-runtime.js',
              "const calls=[],totalUsage=usageShape(),productionModels=new Set();let scoutValidated=null,reviewerValidated=null,finalValidated=null,shadowComparison=null,shadowError='',productionLatencyMs=0,shadowLatencyMs=0;",
              "const calls=[],totalUsage=usageShape(),productionModels=new Set(),optionalErrors=[];let scoutValidated=null,reviewerValidated=null,finalValidated=null,shadowComparison=null,shadowError='',productionLatencyMs=0,shadowLatencyMs=0;")
          rep('src/model-routing-runtime.js',
              "}catch(error){if(optional)return{error};throw error;}",
              "}catch(error){if(optional){optionalErrors.push(freeze({role,shadow,code:String(error?.code||'EOPTIONAL_ROLE')}));return{error};}throw error;}")
          rep('src/model-routing-runtime.js',
              "return freeze({finalValidated,reviewerValidated,scoutValidated,calls,usage:totalUsage,productionUsage,productionModels:[...productionModels],modelEvidence:productionCalls.map(item=>item.modelEvidence).filter(Boolean),shadowComparison,shadowError,economics,productionLatencyMs,shadowLatencyMs,registrySource:router.registrySource,registryRevision:router.registryRevision});",
              "return freeze({finalValidated,reviewerValidated,scoutValidated,calls,usage:totalUsage,productionUsage,productionModels:[...productionModels],modelEvidence:productionCalls.map(item=>item.modelEvidence).filter(Boolean),shadowComparison,shadowError,optionalErrors,economics,productionLatencyMs,shadowLatencyMs,registrySource:router.registrySource,registryRevision:router.registryRevision});")
          rep('src/service.js',
              "models=new Set(),modelEvidence=[],shadowComparisons=[],economicsRecords=[],roleCalls=[];",
              "models=new Set(),modelEvidence=[],shadowModelEvidence=[],shadowComparisons=[],shadowErrors=[],optionalRoleErrors=[],economicsRecords=[],roleCalls=[];")
          rep('src/service.js',
              "modelEvidence.push(...routed.modelEvidence);roleCalls.push(...routed.calls);if(routed.shadowComparison)shadowComparisons.push({chunkIndex:chunk.index,...routed.shadowComparison});economicsRecords.push",
              "modelEvidence.push(...routed.modelEvidence);roleCalls.push(...routed.calls);shadowModelEvidence.push(...routed.calls.filter(x=>x.shadow&&x.modelEvidence).map(x=>x.modelEvidence));if(routed.shadowComparison)shadowComparisons.push({chunkIndex:chunk.index,...routed.shadowComparison});if(routed.shadowError)shadowErrors.push({chunkIndex:chunk.index,code:routed.shadowError});optionalRoleErrors.push(...(routed.optionalErrors||[]).map(item=>({chunkIndex:chunk.index,...item})));economicsRecords.push")
          rep('src/service.js',
              "modelEvidence:routed.modelEvidence,shadowComparison:routed.shadowComparison||null});",
              "modelEvidence:routed.modelEvidence});")
          rep('src/service.js',
              "review.modelEvidence=Object.freeze(modelEvidence);review.shadowComparisons=Object.freeze(shadowComparisons);review.modelEconomics=buildModelEconomicsScorecard(economicsRecords);",
              "review.modelEvidence=Object.freeze(modelEvidence);review.shadowModelEvidence=Object.freeze(shadowModelEvidence);review.shadowComparisons=Object.freeze(shadowComparisons);review.shadowErrors=Object.freeze(shadowErrors);review.optionalRoleErrors=Object.freeze(optionalRoleErrors);review.modelEconomics=buildModelEconomicsScorecard(economicsRecords);")
          rep('src/service.js',
              "shadowCalls:review.shadowInferenceCount,scoutCalls:roleCalls.filter(x=>!x.shadow&&x.role==='scout').length,adjudicatorCalls:roleCalls.filter(x=>!x.shadow&&x.role==='adjudicator').length,usage:review.usage,economics:review.modelEconomics",
              "shadowCalls:review.shadowInferenceCount,scoutCalls:roleCalls.filter(x=>!x.shadow&&x.role==='scout').length,adjudicatorCalls:roleCalls.filter(x=>!x.shadow&&x.role==='adjudicator').length,shadowErrors:review.shadowErrors.length,optionalRoleErrors:review.optionalRoleErrors.length,usage:review.usage,economics:review.modelEconomics")
          PY
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add src/model-routing-runtime.js src/service.js
          git commit -m 'fix(service): isolate shadow from production review identity'
          git push origin HEAD:feat/model-routing-v1-runtime

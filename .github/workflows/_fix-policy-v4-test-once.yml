name: Fix Service Policy v4 Once
on:
  push:
    branches: [repin-safe-core-v4.10.1]
    paths: [.github/workflows/_fix-policy-v4-test-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-safe-core-v4.10.1
      - name: Align Service Policy wrapper and fixtures with v4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/policy.js'); s=p.read_text(); assert 'Policy Schema v3' in s; p.write_text(s.replace('Policy Schema v3','Policy Schema v4'))
          p=Path('test/policy.test.js'); s=p.read_text(); assert s.count('schemaVersion: 3') >= 3; s=s.replace('Policy v3','Policy v4').replace('schemaVersion: 3','schemaVersion: 4').replace('Policy Schema v3','Policy Schema v4'); p.write_text(s)
          PY
          git add src/policy.js test/policy.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: align Service policy boundary with Schema v4'
          git push origin HEAD:repin-safe-core-v4.10.1

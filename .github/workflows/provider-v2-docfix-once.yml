name: Provider V2 Doc Fix Once

on:
  push:
    branches: [family/provider-contract-v2]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/provider-contract-v2
          fetch-depth: 0
          submodules: recursive
      - name: Restore full history and pin schema
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:CHANGELOG.md > /tmp/changelog-main.md
          cat > /tmp/changelog-new.md <<'EOF'
          ## 7.3.0 - 2026-09-01

          - Pin Codex Safe Core 4.12.0 and consume Codex Runtime / Provider Contract v2.
          - Hard-cut Config Schema 6 to Config Schema 7 while preserving Database Schema 8 and the full 7.2.1 notification/product line.
          - Add `codex.credentialSource` with `auto`, `env`, and `auth-json`; `auto` prefers the configured environment variable and otherwise resolves the API key from the configured Codex home, `CODEX_HOME`, or the OS user Codex home.
          - Accept `auth.json` only for `auth_mode=apikey` with a non-empty `OPENAI_API_KEY`; resolved secrets remain child-process-only and are excluded from argv, receipts, settings, and diagnostics.
          - Add explicit `codex.allowInsecureHttp` for trusted private-network OpenAI-compatible relays; HTTPS remains the default and repository policy cannot enable insecure transport.

          EOF
          cat /tmp/changelog-main.md >> /tmp/changelog-new.md
          mv /tmp/changelog-new.md CHANGELOG.md
          node <<'NODE'
          const fs=require('fs');
          const file='.codex-safe.example.json';
          const v=JSON.parse(fs.readFileSync(file,'utf8'));
          v.$schema='https://raw.githubusercontent.com/jiying2007/codex-safe-core/7878dae982088746c06e4fe747b2468e6af274a2/codex-safe.schema.json';
          fs.writeFileSync(file,JSON.stringify(v,null,2)+'\n');
          NODE
          rm .github/workflows/provider-v2-docfix-once.yml
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(service): preserve history and Core provenance"
          git push origin HEAD:family/provider-contract-v2

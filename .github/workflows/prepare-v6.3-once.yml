name: Prepare Service v6.3.0 Quality Cutover
on:
  push:
    branches: [quality-v6.3.0]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Prepare v6.3.0
        env:
          CORE_SHA: 10393a0035ce5168b3d0e88822af0d74fe85ec6c
        shell: bash
        run: |
          set -euo pipefail
          git -C src/codex-safe-core fetch --quiet origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --quiet --detach "$CORE_SHA"
          git add src/codex-safe-core
          node <<'NODE'
          const fs=require('fs');
          function edit(file,fn){const before=fs.readFileSync(file,'utf8'),after=fn(before);if(after===before)throw new Error(`expected edit did not change ${file}`);fs.writeFileSync(file,after);}
          edit('src/cost-planner.js',s=>s
            .replace('function estimateChunkTokens(prompt,maxFindings=1){const estimatedOutputTokens=Math.max(96,96+Math.max(1,Number(maxFindings)||1)*180),estimate=core.estimateRequestTokens(prompt,{estimatedOutputTokens});return Object.freeze({input:estimate.inputTokens,output:estimate.outputTokens,total:estimate.totalTokens});}', 'function estimateChunkTokens(prompt,maxFindings=1,bytesPerToken=2){const estimatedOutputTokens=Math.max(96,96+Math.max(1,Number(maxFindings)||1)*180),estimate=core.estimateRequestTokens(prompt,{estimatedOutputTokens,bytesPerToken});return Object.freeze({input:estimate.inputTokens,output:estimate.outputTokens,total:estimate.totalTokens});}')
            .replace('TokenBudgetLedger:core.TokenBudgetLedger,normalizePath};','TokenBudgetLedger:core.TokenBudgetLedger,TokenEstimatorCalibration:core.TokenEstimatorCalibration,normalizePath};'));
          edit('src/service.js',s=>s
            .replace('mergeCarriedFindings,TokenBudgetLedger}=require(\'./cost-planner\');','mergeCarriedFindings,TokenBudgetLedger,TokenEstimatorCalibration}=require(\'./cost-planner\');')
            .replace('this.workers=[];this.tokenLedger=new TokenBudgetLedger();}', 'this.workers=[];this.tokenLedger=new TokenBudgetLedger();this.tokenCalibration=new TokenEstimatorCalibration();}')
            .replace('const prompt=buildPrompt(reviewSnapshot,chunk,policy,context),estimate=estimateChunkTokens(prompt,perChunkFindings);const effectiveMrTokenBudget=', "const prompt=buildPrompt(reviewSnapshot,chunk,policy,context),model=selectModel(this.config,contextConfig.riskScore),provider=this.config.codexProviderMode||'openai',bytesPerToken=this.tokenCalibration.bytesPerToken(provider,model||'default'),estimate=estimateChunkTokens(prompt,perChunkFindings,bytesPerToken);const effectiveMrTokenBudget=")
            .replace("const model=selectModel(this.config,contextConfig.riskScore),executionConfig={...this.config,codexModel:model,reviewTimeoutSeconds:policy.timeoutSeconds},result=await this.runCodexFn", "const executionConfig={...this.config,codexModel:model,reviewTimeoutSeconds:policy.timeoutSeconds},result=await this.runCodexFn")
            .replace("version=result.version;models.add(result.model||model||'default');usageAdd(usage,result.usage);this.recordUsage(result.usage,estimate.total,contextConfig.riskScore);results.push", "version=result.version;const effectiveModel=result.model||model||'default';models.add(effectiveModel);usageAdd(usage,result.usage);const calibration=this.tokenCalibration.observe(provider,effectiveModel,{bytes:Buffer.byteLength(prompt,'utf8'),usage:result.usage});this.telemetry?.metrics.observe('codex_review_input_bytes_per_token',calibration.ratio,[1,1.5,2,2.5,3,4,6]);this.telemetry?.recordGenAiClient({operation:'review',provider,model:effectiveModel,durationSeconds:Number(result.durationMs||0)/1000,usage:result.usage});this.recordUsage(result.usage,estimate.total,contextConfig.riskScore);results.push"));
          edit('src/telemetry.js',s=>{
            const marker="function genAiUsageAttributes(usage={},extra={}){return Object.freeze({'gen_ai.usage.input_tokens':Number(usage.inputTokens||0),'gen_ai.usage.cache_read.input_tokens':Number(usage.cachedInputTokens||0),'gen_ai.usage.cache_creation.input_tokens':Number(usage.cacheWriteInputTokens||0),'gen_ai.usage.output_tokens':Number(usage.outputTokens||0),'gen_ai.usage.reasoning.output_tokens':Number(usage.reasoningOutputTokens||0),...extra});}";
            const helpers=marker+"\nfunction genAiClientAttributes({operation='review',provider='',model=''}={}){return Object.freeze({'gen_ai.operation.name':String(operation||'review').slice(0,64),'gen_ai.provider.name':String(provider||'').slice(0,128),'gen_ai.request.model':String(model||'').slice(0,256)});}\nfunction otlpAttrs(attrs={}){return Object.entries(attrs).filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([key,value])=>({key,value:otlpValue(safeAttr(value))}));}\nfunction histogramPoint(value,attrs,start,time){return{attributes:otlpAttrs(attrs),startTimeUnixNano:String(start),timeUnixNano:String(time),count:'1',sum:Number(value)||0,bucketCounts:['1'],explicitBounds:[]};}";
            s=s.replace(marker,helpers);
            s=s.replace('  exportSpan(span){', "  recordGenAiClient({operation='review',provider='',model='',durationSeconds=0,usage={}}={}){const attrs=genAiClientAttributes({operation,provider,model}),duration=Math.max(0,Number(durationSeconds)||0),input=Math.max(0,Number(usage.inputTokens||0)),output=Math.max(0,Number(usage.outputTokens||0));this.metrics.observe('gen_ai_client_operation_duration_seconds',duration);this.metrics.observe('gen_ai_client_input_token_usage',input,[100,500,1000,5000,10000,50000,100000,250000]);this.metrics.observe('gen_ai_client_output_token_usage',output,[10,50,100,500,1000,5000,10000]);if(this.endpoint)this.exportGenAiMetrics({attrs,duration,input,output});}\n  exportGenAiMetrics(record){const task=(async()=>{try{const url=this.endpoint.endsWith('/v1/metrics')?this.endpoint:`${this.endpoint}/v1/metrics`,time=BigInt(Date.now())*1000000n,start=time-1000000n,metrics=[{name:'gen_ai.client.operation.duration',unit:'s',histogram:{aggregationTemporality:1,dataPoints:[histogramPoint(record.duration,record.attrs,start,time)]}},{name:'gen_ai.client.token.usage',unit:'{token}',histogram:{aggregationTemporality:1,dataPoints:[histogramPoint(record.input,{...record.attrs,'gen_ai.token.type':'input'},start,time),histogramPoint(record.output,{...record.attrs,'gen_ai.token.type':'output'},start,time)]}}],body={resourceMetrics:[{resource:{attributes:[{key:'service.name',value:{stringValue:this.serviceName}}]},scopeMetrics:[{scope:{name:'codex-review-service'},metrics}]}]};await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(this.timeoutMs)});}catch(error){this.logger.warn?.({event:'otel_metrics_export_failed',code:error?.code||'EOTELMETRICS'});}})();this.pending.add(task);task.finally(()=>this.pending.delete(task));}\n  exportSpan(span){");
            s=s.replace('module.exports={Telemetry,Metrics,genAiUsageAttributes};','module.exports={Telemetry,Metrics,genAiUsageAttributes,genAiClientAttributes};');
            return s;
          });
          NODE
          cat > test/telemetry-genai.test.js <<'EOF'
          'use strict';
          const test=require('node:test');const assert=require('node:assert/strict');const{Telemetry,genAiClientAttributes}=require('../src/telemetry');
          test('GenAI semantic attributes remain low-cardinality and body-free',()=>{const attrs=genAiClientAttributes({operation:'review',provider:'openai',model:'gpt-test'});assert.deepEqual(Object.keys(attrs),['gen_ai.operation.name','gen_ai.provider.name','gen_ai.request.model']);assert.doesNotMatch(JSON.stringify(attrs),/prompt|source|finding|log/i);});
          test('OTLP exporter emits current GenAI client metric names and input/output token type',async()=>{const old=global.fetch,calls=[];global.fetch=async(url,init)=>{calls.push({url:String(url),body:JSON.parse(init.body)});return{ok:true};};try{const t=new Telemetry({endpoint:'https://otel.example',timeoutMs:100});t.recordGenAiClient({operation:'review',provider:'openai',model:'gpt-test',durationSeconds:1.25,usage:{inputTokens:1200,outputTokens:80}});await t.flush();assert.equal(calls.length,1);assert.equal(calls[0].url,'https://otel.example/v1/metrics');const metrics=calls[0].body.resourceMetrics[0].scopeMetrics[0].metrics;assert.deepEqual(metrics.map(x=>x.name),['gen_ai.client.operation.duration','gen_ai.client.token.usage']);const tokenPoints=metrics[1].histogram.dataPoints;assert.equal(tokenPoints.length,2);assert.match(JSON.stringify(tokenPoints),/gen_ai.token.type/);assert.doesNotMatch(JSON.stringify(calls[0].body),/prompt|source code|finding text|failure log/i);}finally{global.fetch=old;}});
          EOF
          npm run release:prepare -- 6.3.0
          node <<'NODE'
          const fs=require('fs');const core=require('./src/codex-safe-core/core-contract.json');const coreSha=process.env.CORE_SHA;const c=require('./product-contract.json');
          Object.assign(c,{productContractVersion:core.productContractVersion,productId:'codex-review-service',productVersion:'6.3.0',serviceVersion:'6.3.0',safeCoreVersion:core.coreVersion,safeCoreCommit:coreSha,safeCoreMajorVersion:core.safeCoreMajorVersion,safeContractVersion:core.safeContractVersion,policySchemaVersion:core.policySchemaVersion,minimumNodeVersion:core.minimumNodeVersion,canonicalNodeVersion:core.canonicalNodeVersion,supportedNodeMajors:core.supportedNodeMajors,qualityPlatformVersion:core.qualityPlatformVersion,reviewProfileVersion:core.reviewProfileVersion,profilePackVersion:core.profilePackVersion,impactEvidenceVersion:core.impactEvidenceVersion,testImpactVersion:core.testImpactVersion,analyzerFindingVersion:core.analyzerFindingVersion});fs.writeFileSync('product-contract.json',JSON.stringify(c,null,2)+'\n');
          let v=fs.readFileSync('scripts/verify-product-contract.js','utf8');v=v.replace("assert.equal(pkg.version,contract.serviceVersion,'package version must come from product contract');", "require('../src/codex-safe-core/scripts/verify-consumer-product-contract').verify(root,contract.safeCoreCommit,'codex-review-service');\nassert.equal(contract.productVersion,contract.serviceVersion,'Product Contract v1 productVersion must match serviceVersion');\nassert.equal(pkg.version,contract.serviceVersion,'package version must come from product contract');");fs.writeFileSync('scripts/verify-product-contract.js',v);
          const current=['README.md','README.zh-CN.md','OPERATIONS.md','SECURITY.md','SUPPORT.md','VERIFY_RELEASE.md',...fs.readdirSync('docs').filter(x=>x.endsWith('.md')).map(x=>'docs/'+x),'.codex-safe.example.json'];for(const file of current){if(!fs.existsSync(file))continue;let s=fs.readFileSync(file,'utf8');s=s.replaceAll('d06383ecf58b8153ddbd9d0b26a4f83b6e0515c2',coreSha);fs.writeFileSync(file,s);}
          let ch=fs.readFileSync('CHANGELOG.md','utf8');ch=ch.replace('- Release prepared. Replace this line with final release notes before merge.','- Adopt immutable Safe Core v4.9.0 and Product Contract v1 with Atomic Family/Manifest v3 compatibility.\n- Add bounded provider/model token-estimator calibration using actual input-token telemetry without persisting prompt/source text.\n- Export current OpenTelemetry GenAI client operation-duration and token-usage metrics while preserving existing Prometheus counters.\n- Add deterministic seeded fuzz/property coverage for all supported analyzer artifact adapters.\n- Document SLSA v1.2 Build provenance alignment; no SCM authority or review semantics are expanded.');fs.writeFileSync('CHANGELOG.md',ch);
          let eff=fs.readFileSync('docs/TOKEN_EFFICIENCY.md','utf8');if(!eff.includes('Online token calibration'))eff+='\n## Online token calibration\n\nCore v4.9 starts from the conservative 2 UTF-8 bytes/token estimate and activates a bounded provider+model EWMA only after enough real samples. The calibration state is ephemeral numeric data only; it never stores prompts or source text and never bypasses configured token budgets.\n';fs.writeFileSync('docs/TOKEN_EFFICIENCY.md',eff);
          let effzh=fs.readFileSync('docs/TOKEN_EFFICIENCY.zh-CN.md','utf8');if(!effzh.includes('在线 Token 校准'))effzh+='\n## 在线 Token 校准\n\nCore v4.9 从保守的 2 UTF-8 bytes/token 开始，只有积累足够真实样本后才启用有界 provider+model EWMA。校准状态只保存临时数值，不保存 prompt 或源码，也不能绕过既有 Token Budget。\n';fs.writeFileSync('docs/TOKEN_EFFICIENCY.zh-CN.md',effzh);
          let verify=fs.readFileSync('VERIFY_RELEASE.md','utf8');if(!verify.includes('SLSA v1.2'))verify+='\n## SLSA v1.2 Build alignment\n\nRelease artifacts are built by hosted GitHub Actions from an exact reviewed commit, checksummed, SBOM-bound and covered by GitHub build-provenance attestations. This documents the Build provenance controls in SLSA v1.2 terms; it does not claim Source L4/two-party governance.\n';fs.writeFileSync('VERIFY_RELEASE.md',verify);
          NODE
          npm run docs:generate
          npm run ci
          git add package.json package-lock.json product-contract.json CHANGELOG.md README.md README.zh-CN.md OPERATIONS.md SECURITY.md SUPPORT.md VERIFY_RELEASE.md docs .codex-safe.example.json src/cost-planner.js src/service.js src/telemetry.js test/telemetry-genai.test.js test/analyzer-adapters-fuzz.test.js scripts/verify-product-contract.js src/codex-safe-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(quality): prepare Review Service v6.3.0 on Core v4.9.0'
          git push origin HEAD:quality-v6.3.0

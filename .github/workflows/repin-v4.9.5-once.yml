name: Repin Service Core v4.9.5 once
on:
  push:
permissions:
  contents: write
jobs:
  repin:
    if: github.ref == 'refs/heads/repin-core-v4.9.5'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-core-v4.9.5
          persist-credentials: true
          submodules: false
      - name: Repin exact Core trust root and generated docs
        env:
          OLD_SHA: bc367cf3fbc57d7060bce343fcf4a6d5312f7ab8
          NEW_SHA: 25ef338202fb9c6262b86e4af2e9ba3444fdc9df
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),old=process.env.OLD_SHA,neu=process.env.NEW_SHA;
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));pc.safeCoreVersion='4.9.5';pc.safeCoreCommit=neu;fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          let ex=fs.readFileSync('.codex-safe.example.json','utf8').replaceAll(old,neu);fs.writeFileSync('.codex-safe.example.json',ex);
          NODE
          git update-index --cacheinfo 160000,$NEW_SHA,src/codex-safe-core
          git submodule update --init src/codex-safe-core
          node scripts/generate-contract-docs.js
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add product-contract.json .codex-safe.example.json README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          git add -u src/codex-safe-core
          git commit -m 'chore(family): pin Review Service to Core v4.9.5'
          git push origin HEAD:repin-core-v4.9.5

name: One-shot Core 4.10 contract docs
on:
  push:
    branches: [repin-safe-core-v4.10.0]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.head_commit.message == 'chore: regenerate product contract docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Regenerate canonical contract docs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-contract-docs.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          git commit -m 'docs: regenerate Safe Core 4.10 contract facts'
          git rm .github/workflows/_repin-contract-docs.yml
          git commit -m 'chore: remove contract-doc bootstrap'
          git push origin HEAD:repin-safe-core-v4.10.0

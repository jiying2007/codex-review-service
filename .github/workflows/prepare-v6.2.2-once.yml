name: Prepare Service v6.2.2 once
on:
  push:
    branches: [release-v6.2.2-core-v4.8.1]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Synchronize current release documentation
        shell: bash
        run: |
          set -euo pipefail
          old='b71e11ef3eafba5aa4359376c79a792a05ee85eb'
          new='d06383ecf58b8153ddbd9d0b26a4f83b6e0515c2'
          core_docs=(.codex-safe.example.json README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md product-contract.json)
          version_docs=(LONG_TERM_ASSET.md OPERATIONS.md README.md README.zh-CN.md SECURITY.md deploy/docker/compose.yaml docs/ARCHITECTURE.md docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md docs/PRODUCT_CONTRACT.md)
          for f in "${core_docs[@]}"; do sed -i "s/${old}/${new}/g" "$f"; done
          for f in "${version_docs[@]}"; do sed -i 's/6\.2\.1/6.2.2/g' "$f"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${core_docs[@]}" "${version_docs[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: synchronize Service v6.2.2 and Core v4.8.1 identity'
          git push origin HEAD:release-v6.2.2-core-v4.8.1

name: Temporary Current Docs Repair

on:
  push:
    branches: [chore/core-4.15]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/core-4.15
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Repair current security identity only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='SECURITY.md';
          let s=fs.readFileSync(file,'utf8');
          s=s.replace('Codex Review Service **7.3.0** owns production operations', 'Codex Review Service **7.4.3** owns production operations')
             .replace('Runtime/Provider Contract v2, Node 22.22.2+/24.19.0+ LTS support', 'Runtime/Provider Contract v3, Node 22.22.2+/24.19.0+ LTS support')
             .replace('Config Schema 7 adds Provider Contract v2 controls:', 'Config Schema 7 consumes Provider Contract v3 controls:');
          fs.writeFileSync(file,s);
          NODE
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add SECURITY.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs(service): align security baseline with 7.4.3 Runtime v3'
          git push origin HEAD:chore/core-4.15

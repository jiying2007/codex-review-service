name: Finalize Review Service Quality Platform once

on:
  push:
    branches: [family-platform-v4.4.0]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'feat: complete Review Service Quality Platform 5.2' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: family-platform-v4.4.0
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply DB6 and Quality Platform 5.2
        shell: bash
        run: |
          set -euo pipefail
          core_sha='c59a036cdb0b5839fe0e794031d38fd274bc116b'
          git -C src/codex-safe-core fetch --quiet origin "$core_sha"
          git -C src/codex-safe-core checkout --quiet "$core_sha"
          git add src/codex-safe-core
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/finalize-family-platform.py')
          s=p.read_text().replace('async listOpenMergeRequests(projectId)', 'listOpenMergeRequests(projectId)')
          s=s.replace("SQLite schema [45]\\\\b|SQLite Schema [45]\\\\b|Schema [45] database|schema [45]\\\\b", "SQLite schema 4|SQLite Schema 4|Schema 4 database|schema 4\\\\b")
          p.write_text(s)
          PY
          python3 scripts/finalize-family-platform.py
          python3 scripts/finalize-quality-refinements.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/verify-family.js')
          s=p.read_text()
          old="'src/codex-safe-core/scripts/verify-release-artifact.js'];"
          new="'src/codex-safe-core/scripts/verify-release-artifact.js','docs/PRODUCT_CONTRACT.md','docs/QUALITY_PLATFORM.md','docs/QUALITY_PLATFORM.zh-CN.md','docs/STORAGE_AND_MIGRATIONS.md','src/codex-safe-core/quality-platform.js'];"
          if old not in s:
              raise SystemExit('verify-family package allowlist marker missing')
          p.write_text(s.replace(old,new,1))
          pkg=json.loads(Path('package.json').read_text())
          pkg['scripts']['docs:verify']='node scripts/generate-contract-docs.js && git diff --exit-code -- README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md'
          Path('package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          ch=Path('CHANGELOG.md').read_text()
          if '## 5.2.0 - 2026-08-27' not in ch:
              notes='''\n## 5.2.0 - 2026-08-27\n\n### Quality Platform and durable database evolution\n\n- Add explicit SQLite Schema 5 -> 6 migration with pre/post integrity checks, mode-0600 backup and fault-tested transactional rollback.\n- Add append-only human finding-resolution history and Admin CLI metrics without automatic prompt/model learning.\n- Adopt Safe Core 4.4 operator review profiles, exact-head Impact Evidence, pre-generated SARIF evidence and GenAI semantic token telemetry.\n- Add a real storage replacement boundary and governed HA thresholds while intentionally keeping SQLite as the only shipped backend.\n- Generate current product-contract facts in Architecture and both READMEs from machine contracts to eliminate version/Core/DB documentation drift.\n'''
              ch=ch.replace('# Changelog\n','# Changelog\n'+notes,1)
              Path('CHANGELOG.md').write_text(ch)
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/generate-contract-docs.js
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          rm scripts/finalize-family-platform.py scripts/finalize-quality-refinements.py
      - name: Run full Service CI
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
      - name: Push validated non-workflow state
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .github/workflows/family-platform-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete Review Service Quality Platform 5.2'
          git push origin HEAD:family-platform-v4.4.0

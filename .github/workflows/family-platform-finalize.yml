name: Finalize Review Service Quality Platform once

on:
  push:
    branches: [family-platform-v4.4.0]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'feat: complete Review Service Quality Platform 5.2' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: family-platform-v4.4.0
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply DB6 and Quality Platform 5.2
        shell: bash
        run: |
          set -euo pipefail
          core_sha='c59a036cdb0b5839fe0e794031d38fd274bc116b'
          git -C src/codex-safe-core fetch --quiet origin "$core_sha"
          git -C src/codex-safe-core checkout --quiet "$core_sha"
          git add src/codex-safe-core
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/finalize-family-platform.py')
          s=p.read_text().replace('async listOpenMergeRequests(projectId)', 'listOpenMergeRequests(projectId)')
          s=s.replace("SQLite schema [45]\\\\b|SQLite Schema [45]\\\\b|Schema [45] database|schema [45]\\\\b", "SQLite schema 4|SQLite Schema 4|Schema 4 database|schema 4\\\\b")
          p.write_text(s)
          PY
          python3 scripts/finalize-family-platform.py
          python3 scripts/finalize-quality-refinements.py
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Exact release-package allowlist for the new permanent assets.
          p=Path('scripts/verify-family.js')
          s=p.read_text()
          old="'src/codex-safe-core/scripts/verify-release-artifact.js'];"
          new="'src/codex-safe-core/scripts/verify-release-artifact.js','docs/PRODUCT_CONTRACT.md','docs/QUALITY_PLATFORM.md','docs/QUALITY_PLATFORM.zh-CN.md','docs/STORAGE_AND_MIGRATIONS.md','src/codex-safe-core/quality-platform.js'];"
          if old not in s:
              raise SystemExit('verify-family package allowlist marker missing')
          p.write_text(s.replace(old,new,1))

          # Impact/SARIF are optional enrichment. Provider enrichment failures must
          # never turn an otherwise reviewable MR into a retry loop.
          p=Path('src/quality.js')
          s=p.read_text()
          old="  const tree = await gitlab.listRepositoryTree(sourceProjectId, headSha);"
          new="  let tree; try { tree = await gitlab.listRepositoryTree(sourceProjectId, headSha); } catch { return Object.freeze({ nodes: [], edges: [], text: '', bytes: 0, complete: false, truncated: true }); }\n  if (!tree || !Array.isArray(tree.items)) return Object.freeze({ nodes: [], edges: [], text: '', bytes: 0, complete: false, truncated: true });"
          if old not in s: raise SystemExit('quality impact tree marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('src/service.js')
          s=p.read_text()
          old="async reviewSnapshot(job,mr,fullDiffs,policy,controller,incremental=null){const qualityEvidence=await collectServiceQualityEvidence(this.gitlab,mr,fullDiffs,this.config),profile=qualityEvidence.profile||resolveReviewProfile(this.config.reviewProfile||'standard');"
          new="async reviewSnapshot(job,mr,fullDiffs,policy,controller,incremental=null){let qualityEvidence;try{qualityEvidence=await collectServiceQualityEvidence(this.gitlab,mr,fullDiffs,this.config);}catch(error){this.logger.warn?.({event:'quality_evidence_degraded',jobId:job.id,projectId:job.project_id,mrIid:job.mr_iid,code:error?.code||'EQUALITYEVIDENCE'});qualityEvidence={profile:resolveReviewProfile(this.config.reviewProfile||'standard'),impact:{nodes:[],edges:[],text:'',bytes:0,complete:false,truncated:true},analyzerFindings:[],analyzerEvidence:{text:'',included:0,total:0,bytes:0,truncated:false}};}const profile=qualityEvidence.profile||resolveReviewProfile(this.config.reviewProfile||'standard');"
          if old not in s: raise SystemExit('service quality fail-soft marker missing')
          p.write_text(s.replace(old,new,1))

          # Current DB6 tests: Schema 5 migration behavior is covered separately in
          # db-migration.test.js; old first-release/current-schema assertions must
          # now validate Schema 6 without weakening the migration gate.
          p=Path('test/db.test.js'); s=p.read_text()
          s=s.replace("test('first-release schema initializes fresh and rejects pre-release databases'", "test('schema 6 initializes fresh and rejects unsupported pre-migration databases'")
          s=s.replace("error?.code==='EDBSCHEMA'&&/fresh Schema 5/.test(error.message)", "error?.code==='EDBSCHEMA'&&/expected fresh database, Schema 5 migration source, or Schema 6/.test(error.message)")
          s=s.replace("test('schema 5 persists notification actions atomically with review publication'", "test('schema 6 persists notification actions atomically with review publication'")
          s=s.replace("assert.equal(store.schemaVersion(),5);const jobId=", "assert.equal(store.schemaVersion(),SCHEMA_VERSION);const jobId=",1)
          p.write_text(s)

          p=Path('test/receipt-v4.test.js'); s=p.read_text()
          s=s.replace("test('schema 5 contains canonical Review Receipt v4 projection columns'", "test('schema 6 contains canonical Review Receipt v4 projection columns'")
          s=s.replace("assert.equal(SCHEMA_VERSION, 5);\n  assert.equal(store.schemaVersion(), 5);", "assert.equal(SCHEMA_VERSION, 6);\n  assert.equal(store.schemaVersion(), SCHEMA_VERSION);")
          p.write_text(s)

          # Current product docs/tests derive DB identity from product-contract.
          p=Path('test/docs-governance.test.js'); s=p.read_text()
          old="assert.match(text,/Database Schema[^\\n]{0,20}5|Schema 5/i);"
          new="assert.match(text,new RegExp(`(?:Database Schema|Schema)[^\\n]{0,20}${contract.databaseSchemaVersion}`,'i'));"
          if old not in s: raise SystemExit('docs DB assertion marker missing')
          p.write_text(s.replace(old,new,1))

          # Deployable examples/current deployment guides must match 5.2 / DB6.
          p=Path('deploy/docker/compose.yaml'); s=p.read_text().replace('codex-review-service:5.1.1','codex-review-service:5.2.0'); p.write_text(s)
          for name in ['docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md']:
              p=Path(name); s=p.read_text().replace('Codex Review Service 5.1.1','Codex Review Service 5.2.0').replace('Database Schema 5','Database Schema 6').replace('SQLite Schema 5','SQLite Schema 6')
              if name.endswith('DEPLOYMENT.md'):
                  marker='From v5.0.0 onward, released DB/Config compatibility is an explicit product contract. Any future schema transition must be documented and tested.'
                  extra=' This release supports the explicit Schema 5 -> 6 startup migration: pre-migration integrity check, mode-0600 verified backup, one transactional migration, and post-migration integrity/foreign-key verification.'
              else:
                  marker='从 v5.0.0 起，已发布 DB/Config 兼容性是正式产品契约。任何后续 Schema 转换都必须有显式 migration 与测试。'
                  extra=' 本版本支持显式 Schema 5 -> 6 启动迁移：迁移前完整性检查、mode-0600 已验证备份、单事务迁移，以及迁移后 integrity/foreign-key 校验。'
              if marker in s and extra.strip() not in s: s=s.replace(marker,marker+extra,1)
              p.write_text(s)

          pkg=json.loads(Path('package.json').read_text())
          pkg['scripts']['docs:verify']='node scripts/generate-contract-docs.js && git diff --exit-code -- README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md'
          Path('package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')

          ch=Path('CHANGELOG.md').read_text()
          if '## 5.2.0 - 2026-08-27' not in ch:
              notes='''\n## 5.2.0 - 2026-08-27\n\n### Quality Platform and durable database evolution\n\n- Add explicit SQLite Schema 5 -> 6 migration with pre/post integrity checks, mode-0600 backup and fault-tested transactional rollback.\n- Add append-only human finding-resolution history and Admin CLI metrics without automatic prompt/model learning.\n- Adopt Safe Core 4.4 operator review profiles, exact-head Impact Evidence, pre-generated SARIF evidence and GenAI semantic token telemetry.\n- Add a real storage replacement boundary and governed HA thresholds while intentionally keeping SQLite as the only shipped backend.\n- Generate current product-contract facts in Architecture and both READMEs from machine contracts to eliminate version/Core/DB documentation drift.\n'''
              ch=ch.replace('# Changelog\n','# Changelog\n'+notes,1)
              Path('CHANGELOG.md').write_text(ch)
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/generate-contract-docs.js
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          rm scripts/finalize-family-platform.py scripts/finalize-quality-refinements.py
      - name: Run full Service CI
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
      - name: Push validated non-workflow state
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .github/workflows/family-platform-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete Review Service Quality Platform 5.2'
          git push origin HEAD:family-platform-v4.4.0

name: Bootstrap Release Docs
on:
  push:
    branches: [codex/release-7.5.3]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/release-7.5.3
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate current release documentation
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:generate
          rm .github/workflows/bootstrap-release-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md OPERATIONS.md SECURITY.md LONG_TERM_ASSET.md deploy/docker/compose.yaml .github/workflows/bootstrap-release-docs.yml
          git diff --cached --check
          git commit -m 'docs(release): regenerate 7.5.3 current docs'
          git push origin HEAD:codex/release-7.5.3

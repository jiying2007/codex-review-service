name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24.19.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --check HEAD^ HEAD
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts

  migration-portability:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.22.2, 24.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify migration and Provider Contract portability
        run: node --test test/db-migrations.test.js test/codex.test.js

  docker-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build production image
        run: |
          set -euo pipefail
          version="$(node -p "require('./product-contract.json').serviceVersion")"
          docker build --build-arg SERVICE_VERSION="$version" --build-arg VCS_REF="$GITHUB_SHA" -t codex-review-service:ci -f deploy/docker/Dockerfile .
      - name: Verify immutable runtime image shape
        run: |
          set -euo pipefail
          version="$(node -p "require('./product-contract.json').serviceVersion")"
          database_schema="$(node -p "require('./product-contract.json').databaseSchemaVersion")"
          config_schema="$(node -p "require('./product-contract.json').configSchemaVersion")"
          canonical_node="$(node -p "require('./product-contract.json').canonicalNodeVersion")"
          test "$(docker inspect -f '{{.Config.User}}' codex-review-service:ci)" = "codex-review"
          docker run --rm --entrypoint node codex-review-service:ci -e "const c=require('./product-contract.json');if(String(c.serviceVersion)!==process.argv[1]||String(c.databaseSchemaVersion)!==process.argv[2]||String(c.configSchemaVersion)!==process.argv[3]||process.versions.node!==process.argv[4])process.exit(1)" "$version" "$database_schema" "$config_schema" "$canonical_node"
          docker run --rm --entrypoint sh codex-review-service:ci -ec 'command -v node >/dev/null; command -v codex >/dev/null; ! command -v npm; ! command -v npx; ! command -v yarn; ! command -v yarnpkg; ! command -v corepack'
      - name: Compose syntax and security boundary
        run: |
          mkdir -p deploy/docker/secrets
          printf 'x' > deploy/docker/secrets/gitlab_api_token
          printf 'x' > deploy/docker/secrets/gitlab_webhook_signing_token
          CODEX_REVIEW_IMAGE=codex-review-service:ci docker compose -f deploy/docker/compose.yaml config >/tmp/compose.yaml
          grep -q 'read_only: true' /tmp/compose.yaml
          grep -q '/run/secrets/gitlab_api_token' /tmp/compose.yaml

  recovery-gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/admin.test.js test/health.test.js test/db.test.js test/notification.test.js test/http.test.js

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  fault-injection:
    if: github.event_name != 'push'
    uses: ./.github/workflows/fault-injection.yml

  gitlab-system:
    if: github.event_name != 'push'
    uses: ./.github/workflows/gitlab-system.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22.22.2
      - id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
      - if: steps.graph.outputs.enabled != 'true'
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high --omit=dev
          node src/codex-safe-core/scripts/verify-package-licenses.js .

  family-release-guard:
    if: github.event_name == 'pull_request'
    uses: jiying2007/codex-safe-core/.github/workflows/family-release-guard.yml@00403dd14877e978698c63d06f6dbdfe2ba9b8cc
    with:
      product: codex-review-service
      expected_core_sha: 00403dd14877e978698c63d06f6dbdfe2ba9b8cc

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [test, migration-portability, docker-smoke, recovery-gate, security, fault-injection, gitlab-system, dependency-review, family-release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable CI dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const skippableOnPush=new Set(['fault-injection','gitlab-system','dependency-review','family-release-guard']);
          const failed=Object.entries(needs).filter(([name,value]) => {
            if (value.result === 'success') return false;
            return !(process.env.EVENT_NAME === 'push' && skippableOnPush.has(name) && value.result === 'skipped');
          });
          if(failed.length){
            console.error('CI Gate blocked:',failed.map(([k,v])=>k+'='+v.result).join(', '));
            process.exit(1);
          }
          NODE

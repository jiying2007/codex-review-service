name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    name: Development / Node 24.19.0
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - if: github.event_name != 'pull_request'
        run: git diff --check HEAD^ HEAD
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts

  compatibility-node22:
    name: Main qualification / Node 22.22.2
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'port/') }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci

  migration-portability:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'port/') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.22.2, 24.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify migration, path and Provider Contract portability
        run: node --test test/db-migrations.test.js test/model-call-store.test.js test/controller-ownership.test.js test/webhook-atomic.test.js test/runner-capacity.test.js test/gitlab-path-identity.test.js test/control-file.test.js test/release-integrity-admission.test.js test/codex.test.js

  docker-smoke:
    name: docker-smoke (${{ matrix.arch }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build production image
        run: |
          set -euo pipefail
          version="$(node -p "require('./product-contract.json').serviceVersion")"
          docker build --build-arg SERVICE_VERSION="$version" --build-arg VCS_REF="$GITHUB_SHA" -t codex-review-service:ci -f deploy/docker/Dockerfile .
      - name: Verify immutable runtime image shape
        run: |
          set -euo pipefail
          version="$(node -p "require('./product-contract.json').serviceVersion")"
          database_schema="$(node -p "require('./product-contract.json').databaseSchemaVersion")"
          config_schema="$(node -p "require('./product-contract.json').configSchemaVersion")"
          canonical_node="$(node -p "require('./product-contract.json').canonicalNodeVersion")"
          test "$(docker inspect -f '{{.Config.User}}' codex-review-service:ci)" = "codex-review"
          docker run --rm --entrypoint node codex-review-service:ci -e "const c=require('./product-contract.json');if(String(c.serviceVersion)!==process.argv[1]||String(c.databaseSchemaVersion)!==process.argv[2]||String(c.configSchemaVersion)!==process.argv[3]||process.versions.node!==process.argv[4])process.exit(1)" "$version" "$database_schema" "$config_schema" "$canonical_node"
          docker run --rm --entrypoint sh codex-review-service:ci -ec 'command -v node >/dev/null; command -v codex >/dev/null; ! command -v npm; ! command -v npx; ! command -v yarn; ! command -v yarnpkg; ! command -v corepack'
      - id: scan
        name: Scan complete native image inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_IGNORE_UNFIXED: 'false'
        with:
          version: v0.70.0
          image-ref: codex-review-service:ci
          scanners: vuln
          format: json
          output: TRIVY-linux-${{ matrix.arch }}.json
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - name: Preserve SARIF from the original JSON scan
        if: ${{ always() && steps.scan.outcome == 'success' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: trivy convert --format sarif --output "TRIVY-linux-${ARCH}.sarif" "TRIVY-linux-${ARCH}.json"
      - name: Require patched inventory and zero blocking vulnerabilities
        if: ${{ always() && steps.scan.outcome == 'success' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/trivy-findings-gate.js --report "TRIVY-linux-${ARCH}.json" --image codex-review-service:ci --image-id "$(docker image inspect --format '{{.Id}}' codex-review-service:ci)" --platform "linux/${ARCH}" --revision "$GITHUB_SHA"
      - name: Preserve original container security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: |
            TRIVY-linux-${{ matrix.arch }}.json
            TRIVY-linux-${{ matrix.arch }}.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Compose syntax and security boundary
        run: |
          mkdir -p deploy/docker/secrets
          printf 'x' > deploy/docker/secrets/gitlab_api_token
          printf 'x' > deploy/docker/secrets/gitlab_webhook_signing_token
          CODEX_REVIEW_IMAGE=codex-review-service:ci docker compose -f deploy/docker/compose.yaml config >/tmp/compose.yaml
          grep -q 'read_only: true' /tmp/compose.yaml
          grep -q '/run/secrets/gitlab_api_token' /tmp/compose.yaml

  recovery-gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/admin.test.js test/health.test.js test/db.test.js test/notification.test.js test/http.test.js

  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  fault-injection:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'port/') }}
    uses: ./.github/workflows/fault-injection.yml

  gitlab-system:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'port/') }}
    uses: ./.github/workflows/gitlab-system.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
      - if: steps.graph.outputs.enabled != 'true'
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high --omit=dev
          node src/codex-safe-core/scripts/verify-package-licenses.js .

  family-release-guard:
    if: github.event_name != 'pull_request'
    uses: jiying2007/codex-safe-core/.github/workflows/family-release-guard.yml@779afbd6982d6271942301e6f59656b50ff7e3cb
    secrets:
      CODEX_SAFE_FAMILY_READ_TOKEN: ${{ secrets.CODEX_SAFE_FAMILY_READ_TOKEN }}
    with:
      product: codex-review-service
      expected_core_sha: 779afbd6982d6271942301e6f59656b50ff7e3cb

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [development, compatibility-node22, migration-portability, docker-smoke, recovery-gate, security, fault-injection, gitlab-system, dependency-review, family-release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require applicable development or main-qualification dependencies
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const releaseOnly=new Set(['compatibility-node22','migration-portability','fault-injection','gitlab-system','family-release-guard']);
          const pullRequestOnly=new Set(['dependency-review']);
          const failed=Object.entries(needs).filter(([name,value]) => {
            if(value.result==='success')return false;
            if(process.env.EVENT_NAME==='pull_request'&&releaseOnly.has(name)&&value.result==='skipped')return false;
            if(process.env.EVENT_NAME!=='pull_request'&&pullRequestOnly.has(name)&&value.result==='skipped')return false;
            return true;
          });
          if(failed.length){
            console.error('CI Gate blocked:',failed.map(([k,v])=>k+'='+v.result).join(', '));
            process.exit(1);
          }
          NODE

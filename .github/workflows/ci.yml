name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24.19.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --check HEAD^ HEAD
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts

  migration-portability:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.22.2, 24.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify SQLite migration portability
        run: node --test test/db-migrations.test.js

  docker-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build production image
        run: |
          set -euo pipefail
          version="$(node -p "require('./product-contract.json').serviceVersion")"
          docker build --build-arg SERVICE_VERSION="$version" --build-arg VCS_REF="$GITHUB_SHA" -t codex-review-service:ci -f deploy/docker/Dockerfile .
      - name: Verify immutable runtime image shape
        run: |
          set -euo pipefail
          version="$(node -p "require('./product-contract.json').serviceVersion")"
          database_schema="$(node -p "require('./product-contract.json').databaseSchemaVersion")"
          config_schema="$(node -p "require('./product-contract.json').configSchemaVersion")"
          canonical_node="$(node -p "require('./product-contract.json').canonicalNodeVersion")"
          test "$(docker inspect -f '{{.Config.User}}' codex-review-service:ci)" = "codex-review"
          docker run --rm --entrypoint node codex-review-service:ci -e "const c=require('./product-contract.json');if(String(c.serviceVersion)!==process.argv[1]||String(c.databaseSchemaVersion)!==process.argv[2]||String(c.configSchemaVersion)!==process.argv[3]||process.versions.node!==process.argv[4])process.exit(1)" "$version" "$database_schema" "$config_schema" "$canonical_node"
          docker run --rm --entrypoint sh codex-review-service:ci -ec 'command -v node >/dev/null; command -v codex >/dev/null; ! command -v npm; ! command -v npx; ! command -v yarn; ! command -v yarnpkg; ! command -v corepack'
      - name: Compose syntax and security boundary
        run: |
          mkdir -p deploy/docker/secrets
          printf 'x' > deploy/docker/secrets/gitlab_api_token
          printf 'x' > deploy/docker/secrets/gitlab_webhook_signing_token
          CODEX_REVIEW_IMAGE=codex-review-service:ci docker compose -f deploy/docker/compose.yaml config >/tmp/compose.yaml
          grep -q 'read_only: true' /tmp/compose.yaml
          grep -q '/run/secrets/gitlab_api_token' /tmp/compose.yaml

  recovery-gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/admin.test.js test/health.test.js test/db.test.js test/notification.test.js test/http.test.js

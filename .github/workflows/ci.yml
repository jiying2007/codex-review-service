name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5, pinned to the digest resolved by GitHub Actions on 2026-08-22.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      # actions/setup-node v5, pinned to the digest resolved by GitHub Actions on 2026-08-22.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --check HEAD^ HEAD
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts

name: Finalize 7.3.1 Current Identity

on:
  push:
    branches: [fix/windows-provider-auth-path]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '24.19.0'
      - name: Align only current release identity
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const replacements=[
            ['deploy/docker/compose.yaml','ghcr.io/jiying2007/codex-review-service:7.3.0}','ghcr.io/jiying2007/codex-review-service:7.3.1}'],
            ['docs/DEPLOYMENT.md','**Codex Review Service 7.3.0** supports','**Codex Review Service 7.3.1** supports'],
            ['docs/DEPLOYMENT.zh-CN.md','**Codex Review Service 7.3.0** 支持','**Codex Review Service 7.3.1** 支持'],
            ['OPERATIONS.md','Codex Review Service **7.3.0** is the current production-operations baseline.','Codex Review Service **7.3.1** is the current production-operations baseline.']
          ];
          for(const [file,from,to] of replacements){
            let text=fs.readFileSync(file,'utf8');
            if(!text.includes(from))throw new Error(`${file}: expected current-version anchor missing`);
            text=text.replace(from,to);
            if(!text.includes(to))throw new Error(`${file}: replacement failed`);
            fs.writeFileSync(file,text);
          }
          NODE
          rm .github/workflows/finalize-731-current-version.yml
          git diff --check
      - name: Verify affected product gates
        run: |
          set -euo pipefail
          node --test test/docker-governance.test.js test/docs-governance.test.js test/codex.test.js
          node scripts/verify-product-contract.js
          node scripts/release.js verify
      - name: Commit finalized current identity
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/docker/compose.yaml docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md OPERATIONS.md .github/workflows/finalize-731-current-version.yml
          git diff --cached --check
          git commit -m "docs(service): align 7.3.1 current release identity"
          git push origin HEAD:fix/windows-provider-auth-path

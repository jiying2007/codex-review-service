name: Patch CodeQL expectation once

on:
  push:
    branches: [codeql-v4.37.9-paired]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Synchronize governance expectation and self-delete
        shell: bash
        run: |
          set -euo pipefail
          old='99df26d4f13ea111d4ec1a7dddef6063f76b97e9'
          new='cdf488f595d80d6e07e03d4674febd5ab45fa938'
          grep -F "$old" scripts/verify-family.js
          sed -i "s/$old/$new/g" scripts/verify-family.js
          rm .github/workflows/patch-codeql-expectation-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-family.js .github/workflows/patch-codeql-expectation-once.yml
          git commit -m 'chore: synchronize CodeQL governance pin'
          git push origin HEAD:codeql-v4.37.9-paired

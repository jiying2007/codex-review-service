name: Family v3 GitLab diff adapter

on:
  push:
    branches: [feat/family-v3-service]
    paths: [.github/workflows/v3-unified-diff-adapter.yml]

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Add canonical GitLab provider adapter
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='src/review.js';
          let s=fs.readFileSync(p,'utf8');
          const marker="function buildSnapshot(mr, diffResult, policy) {";
          if(!s.includes(marker))throw new Error('buildSnapshot marker missing');
          if(!s.includes('function toUnifiedReviewBlock(file)')){
            const helper=`function toUnifiedReviewBlock(file){\n  const raw=String(file.diff||'');\n  if(/^diff --git /m.test(raw))return raw;\n  const oldPath=String(file.old_path||file.path||'').replace(/\\\\/g,'/');\n  const newPath=String(file.new_path||file.path||'').replace(/\\\\/g,'/');\n  const oldHeader=file.new_file===true?'/dev/null':\`a/\${oldPath}\`;\n  const newHeader=file.deleted_file===true?'/dev/null':\`b/\${newPath}\`;\n  return [\`diff --git a/\${oldPath} b/\${newPath}\`,\`--- \${oldHeader}\`,\`+++ \${newHeader}\`,raw].filter(Boolean).join('\\n');\n}\n`;
            s=s.replace(marker,helper+marker);
          }
          const old="diff:reviewable.map(file=>file.diff).join('\\n')";
          if(!s.includes(old))throw new Error('reviewDiff expression missing');
          s=s.replace(old,"diff:reviewable.map(toUnifiedReviewBlock).join('\\n')");
          s=s.replace('metadataOnlyDiff,providerDiffFingerprint,buildSnapshot,','metadataOnlyDiff,providerDiffFingerprint,toUnifiedReviewBlock,buildSnapshot,');
          fs.writeFileSync(p,s);
          NODE
          node --check src/review.js
          git rm .github/workflows/v3-unified-diff-adapter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/review.js
          git diff --cached --check
          git commit -m 'fix: canonicalize GitLab diff blocks before Core chunking'
          git push origin HEAD:feat/family-v3-service

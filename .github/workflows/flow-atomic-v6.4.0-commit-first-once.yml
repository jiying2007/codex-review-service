name: Validate committed v6.4.0 atomic candidate once
on:
  push:
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feat-flow-tracking-v6.4.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24.19.0
      - name: Build candidate commit, validate zero-diff contracts, then push
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "actionFactory=null" src/db.js; then
            npm run check
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/flow-atomic-v6.4.0-once.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if line.strip()=='run: |')
          body=[]
          for line in source[start+1:]:
              if line.startswith('          '): body.append(line[10:])
              elif not line.strip(): body.append('')
              else: break
          script='\n'.join(body)+'\n'
          marker='npm run check'
          precommit=r'''python3 - <<'PYCANDIDATE'
          from pathlib import Path
          vf=Path('scripts/verify-family.js'); s=vf.read_text()
          old="'docs/ARCHITECTURE.md','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','docs/NOTIFICATIONS.md','docs/NOTIFICATIONS.zh-CN.md','docs/GITLAB_SETUP.md'"
          new="'docs/ARCHITECTURE.md','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','docs/NOTIFICATIONS.md','docs/NOTIFICATIONS.zh-CN.md','docs/FLOW_TRACKING.md','docs/FLOW_TRACKING.zh-CN.md','docs/GITLAB_SETUP.md'"
          if old not in s: raise SystemExit('package whitelist marker missing')
          vf.write_text(s.replace(old,new,1))
          vp=Path('scripts/verify-product-contract.js'); s=vp.read_text()
          old="/SQLite schema 4|SQLite Schema 4|Schema 4 database|schema 4\\b/i"
          new="/SQLite schema 4|SQLite Schema 4|Database Schema 4|Schema 4 database/i"
          if old not in s: raise SystemExit('stale DB schema regex marker missing')
          vp.write_text(s.replace(old,new,1))
          for name in ['README.md','README.zh-CN.md','OPERATIONS.md','SECURITY.md','docs/ARCHITECTURE.md','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md']:
              p=Path(name); text=p.read_text()
              text=text.replace('schemaVersion: 3','schemaVersion: 4').replace('Config Schema 3','Config Schema 4').replace('配置 Schema 3','配置 Schema 4')
              p.write_text(text)
          PYCANDIDATE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.js src/flow-tracking.js test/flow-tracking.test.js test/flow-db.test.js scripts/verify-family.js scripts/verify-product-contract.js README.md README.zh-CN.md OPERATIONS.md SECURITY.md docs/ARCHITECTURE.md docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md
          git commit -m "fix(service): make flow notifications crash-consistent"
          '''
          if marker not in script: raise SystemExit('check marker missing')
          script=script.replace(marker,precommit+'\n'+marker,1)
          Path('/tmp/committed-v640.sh').write_text(script)
          PY
          bash /tmp/committed-v640.sh

name: Fix Review Service Runtime v3 Family Gate Once
on:
  push:
    branches: [feat/runtime-auto-7.4.0]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: true, fetch-depth: 0 }
      - name: Correct fail-closed runtime secret assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-family.js'); s=p.read_text()
          old="assert.match(runtimeSource,/GITLAB_API_TOKEN/,{inverse:true});"
          new="assert.doesNotMatch(runtimeSource,/GITLAB_API_TOKEN/);"
          if old not in s and new not in s: raise SystemExit('runtime secret assertion anchor missing')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-family.js
          if ! git diff --cached --quiet; then
            git commit -m 'test(runtime): forbid GitLab secret coupling in Runtime adapter'
            git push origin HEAD:feat/runtime-auto-7.4.0
          fi

name: Sync Review Service 7.4 Current Docs Once
on:
  push:
    branches: [feat/runtime-auto-7.4.0]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - name: Align deployment and operations current facts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          files=['docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','OPERATIONS.md']
          for name in files:
              p=Path(name); s=p.read_text()
              s=s.replace('Codex Review Service 7.3.2','Codex Review Service 7.4.0').replace('Codex Review Service **7.3.2**','Codex Review Service **7.4.0**')
              s=s.replace('Service 7.3.0 hard-cuts Config Schema 6 -> 7 for Core Provider Contract v2. Runtime does not translate Config Schema 6. Before rollout, set `schemaVersion: 7`; `codex.credentialSource` is `auto|env|auth-json` and `codex.allowInsecureHttp` defaults to `false`. Non-loopback HTTP is accepted only when explicitly enabled for a trusted relay.','Service 7.4.0 keeps Config Schema 7 and adopts Core Runtime/Provider Contract v3. `codex.providerMode` defaults to `auto`, reusing the Service/Runner account Family or Codex runtime; explicit provider fields remain advanced overrides. Runtime does not translate older Config Schema versions.')
              s=s.replace('Config Schema 7 is the Provider Contract v2 hard boundary. It adds `codex.credentialSource=auto|env|auth-json` and explicit `codex.allowInsecureHttp`, while preserving the Config Schema 6 responsibility-notification contract and the prior removal of `review.incrementalReviewEnabled`. Unknown fields and unsupported versions still fail closed.','Config Schema 7 remains the current boundary. Service 7.4.0 consumes Runtime/Provider Contract v3 and defaults provider selection to `auto` without a schema bump; explicit credential/HTTP fields remain advanced overrides. Unknown fields and unsupported versions still fail closed.')
              s=s.replace('Create Config Schema 7 and review the Provider Contract v2 credential/transport fields.','Create Config Schema 7 and verify Runtime/Provider Contract v3 auto resolution or the explicitly selected advanced override.')
              s=s.replace('Service 7.3.0 uses Config Schema 7 and Database Schema 8; Config Schema 7 adds Provider Contract v2 controls only and does not alter Schema 8.','Service 7.4.0 keeps Config Schema 7 and Database Schema 8 while consuming Runtime/Provider Contract v3; no DB/config schema migration is introduced by 7.4.0.')
              s=s.replace('Service 7.3.0 introduces the current **Config Schema 6 -> 7** hard cut for Provider Contract v2 credentials/transport controls.','Service 7.4.0 keeps the current Config Schema 7 and adopts Runtime/Provider Contract v3 with Auto runtime inheritance; the historical 7.3.0 Config Schema 6 -> 7 hard cut remains an upgrade boundary.')
              s=s.replace('"providerMode": "openai-compatible",\n    "providerBaseUrl": "http://192.168.2.109:3000/v1",\n    "apiKeyEnv": "CODEX_PROVIDER_API_KEY",\n    "credentialSource": "auth-json",\n    "allowInsecureHttp": true','"providerMode": "auto"')
              p.write_text(s)
          for name in ['docs/CODEX_PROVIDER.md','docs/CODEX_PROVIDER.zh-CN.md']:
              p=Path(name); s=p.read_text()
              if '## Runtime Contract v3' not in s:
                  s=s.replace('## Zero-config resolution','## Runtime Contract v3 — zero-config\n\n## Zero-config resolution',1) if name.endswith('.md') and not name.endswith('zh-CN.md') else s.replace('## 零配置解析','## Runtime Contract v3 — 零配置\n\n## 零配置解析',1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md OPERATIONS.md docs/CODEX_PROVIDER.md docs/CODEX_PROVIDER.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(runtime): align Review Service 7.4 operations contract'
            git push origin HEAD:feat/runtime-auto-7.4.0
          fi

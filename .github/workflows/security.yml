name: Security

on:
  workflow_call:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Reject copyleft runtime dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const denied=new Set(['GPL-3.0','AGPL-3.0','GPL-3.0-only','AGPL-3.0-only']);
          for(const [name,pkg] of Object.entries(lock.packages||{})) {
            if(!name || pkg.dev) continue;
            const licenses=String(pkg.license||'').split(/\s+OR\s+|\s+AND\s+/).map(v=>v.replace(/[()]/g,'').trim());
            if(licenses.some(v=>denied.has(v))) throw new Error(`Denied runtime license in ${name}: ${pkg.license}`);
          }
          NODE

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript
          output: codeql-results
          upload: never
          upload-database: false
      - name: Block high and critical findings in CI Gate
        if: ${{ always() }}
        run: node src/codex-safe-core/scripts/codeql-findings-gate.js codeql-results
      - name: Preserve actual CodeQL SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-results/*.sarif
          if-no-files-found: error
      - id: detect
        if: ${{ always() }}
        name: Detect repository Code Scanning capability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Code Scanning upload is unavailable to this workflow token. Local CodeQL analysis, the SARIF findings gate, and the SARIF artifact remain required.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ always() && steps.detect.outputs.enabled == 'true' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript
          sarif_file: codeql-results

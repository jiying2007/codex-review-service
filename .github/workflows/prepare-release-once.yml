name: Prepare release v5.1.1
on:
  push:
    branches: [release-v5.1.1]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Bump release identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          npm version 5.1.1 --no-git-tag-version
          node <<'NODE'
          const fs=require('fs');
          const file='product-contract.json';
          const v=JSON.parse(fs.readFileSync(file,'utf8'));
          v.serviceVersion='5.1.1';
          fs.writeFileSync(file,JSON.stringify(v,null,2)+'\n');
          NODE
          git add package.json package-lock.json product-contract.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: release v5.1.1'
          git push origin HEAD:release-v5.1.1

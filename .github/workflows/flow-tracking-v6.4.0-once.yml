name: Stage v6.4.0 flow tracking once
on:
  push:
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/feat-flow-tracking-v6.4.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24.19.0
      - name: Apply deterministic v6.4.0 changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          R=pathlib.Path('.')
          def read(p): return (R/p).read_text()
          def write(p,s): (R/p).write_text(s)
          def repl(p,old,new,count=1):
              s=read(p)
              if old not in s: raise SystemExit(f'missing replacement in {p}: {old[:120]}')
              write(p,s.replace(old,new,count))

          # Product identity: real feature minor, Config 4, DB 7; Core/protocol identities stay frozen.
          pc=json.loads(read('product-contract.json'))
          pc['serviceVersion']=pc['productVersion']='6.4.0'
          pc['databaseSchemaVersion']=7
          pc['configSchemaVersion']=4
          write('product-contract.json',json.dumps(pc,ensure_ascii=False,indent=2)+'\n')
          pkg=json.loads(read('package.json')); pkg['version']='6.4.0'
          files=pkg['files']
          for item in ['docs/FLOW_TRACKING.md','docs/FLOW_TRACKING.zh-CN.md']:
              if item not in files: files.insert(files.index('docs/GITLAB_SETUP.md'),item)
          write('package.json',json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          lock=json.loads(read('package-lock.json')); lock['version']='6.4.0'; lock.setdefault('packages',{}).setdefault('',{})['version']='6.4.0'; write('package-lock.json',json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          # Config Schema 4: flowTracking is orthogonal to review and defaults fully off.
          p='src/config.js'
          repl(p,"const{FORMATS:ANALYZER_FORMATS}=require('./analyzer-adapters');", "const{FORMATS:ANALYZER_FORMATS}=require('./analyzer-adapters');\nconst{FLOW_EVENTS}=require('./flow-tracking');")
          repl(p,"const NOTIFICATION_EVENTS=Object.freeze(['review.completed','review.blocked','review.failed','service.degraded','service.recovered']);", "const NOTIFICATION_EVENTS=Object.freeze(['review.completed','review.blocked','review.failed','service.degraded','service.recovered',...FLOW_EVENTS]);")
          repl(p,"const TOP_KEYS=new Set(['schemaVersion','server','gitlab','webhook','review','codex','runner','publication','notifications','lifecycle','observability']);", "const TOP_KEYS=new Set(['schemaVersion','server','gitlab','webhook','review','flowTracking','codex','runner','publication','notifications','lifecycle','observability']);")
          repl(p,"  review:new Set(['language','timeoutSeconds','jobTimeoutSeconds','maxJobAttempts','retryBaseDelayMs','retryMaxDelayMs','maxDiffBytes','maxTotalDiffBytes','maxReviewChunks','maxFindings','maxPublishedFindings','minConfidence','blockingSeverity','contextEnabled','adaptiveContextEnabled','incrementalReviewEnabled','maxContextBytes','maxContextFiles','contextLines','blockUnreviewableFiles','skipGeneratedFiles','reviewDraftMergeRequests','debounceMs','mrMaxTokenBudget','projectDailyTokenBudget','concurrency','pollIntervalMs','maxQueueDepth','projectPolicyEnabled','projectPolicyMaxBytes','autoResolveObsolete','triggerOnOpen','triggerOnPush','triggerOnReopen','triggerAssignment','profile','analyzerReports','testImpactEnabled','testPathPrefixes','maxTestCandidates','maxRecommendedTests']),", "  review:new Set(['language','timeoutSeconds','jobTimeoutSeconds','maxJobAttempts','retryBaseDelayMs','retryMaxDelayMs','maxDiffBytes','maxTotalDiffBytes','maxReviewChunks','maxFindings','maxPublishedFindings','minConfidence','blockingSeverity','contextEnabled','adaptiveContextEnabled','incrementalReviewEnabled','maxContextBytes','maxContextFiles','contextLines','blockUnreviewableFiles','skipGeneratedFiles','reviewDraftMergeRequests','debounceMs','mrMaxTokenBudget','projectDailyTokenBudget','concurrency','pollIntervalMs','maxQueueDepth','projectPolicyEnabled','projectPolicyMaxBytes','autoResolveObsolete','triggerOnOpen','triggerOnPush','triggerOnReopen','triggerAssignment','profile','analyzerReports','testImpactEnabled','testPathPrefixes','maxTestCandidates','maxRecommendedTests']),\n  flowTracking:new Set(['enabled','pipeline','mergeRequest','push','tag']),")
          marker="function parseNotificationEvents(value,label='notifications.events')"
          flow_helpers="""function stringList(value,fallback,label,{allowed=null,maxItems=64,maxLength=255}={}){const source=value===undefined?fallback:value;if(!Array.isArray(source)||source.length>maxItems)throw configError(`${label} must be an array with at most ${maxItems} entries`);const out=[];for(const raw of source){const item=stringValue(raw,'',label,maxLength);if(!item)throw configError(`${label} contains an empty value`);if(allowed&&!allowed.includes(item))throw configError(`${label} contains unsupported value: ${item}`);if(!out.includes(item))out.push(item);}return out;}\nfunction parseFlowTracking(value){const root=assertObject(value,'flowTracking');assertKeys(root,new Set(['enabled','pipeline','mergeRequest','push','tag']),'flowTracking');const pipeline=assertObject(root.pipeline,'flowTracking.pipeline'),mr=assertObject(root.mergeRequest,'flowTracking.mergeRequest'),push=assertObject(root.push,'flowTracking.push'),tag=assertObject(root.tag,'flowTracking.tag');assertKeys(pipeline,new Set(['enabled','statuses','refs','sources','jobs']),'flowTracking.pipeline');assertKeys(mr,new Set(['enabled','actions']),'flowTracking.mergeRequest');assertKeys(push,new Set(['enabled','actions','patterns']),'flowTracking.push');assertKeys(tag,new Set(['enabled','actions','patterns']),'flowTracking.tag');const jobs=assertObject(pipeline.jobs,'flowTracking.pipeline.jobs');assertKeys(jobs,new Set(['mode','patterns','maxItems']),'flowTracking.pipeline.jobs');return Object.freeze({flowTrackingEnabled:boolValue(root.enabled,false,'flowTracking.enabled'),flowPipeline:Object.freeze({enabled:boolValue(pipeline.enabled,true,'flowTracking.pipeline.enabled'),statuses:Object.freeze(stringList(pipeline.statuses,['failed'],'flowTracking.pipeline.statuses',{allowed:['success','failed','canceled','skipped'],maxItems:4,maxLength:32})),refs:Object.freeze(stringList(pipeline.refs,['*'],'flowTracking.pipeline.refs',{maxItems:64})),sources:Object.freeze(stringList(pipeline.sources,['push','merge_request_event','web'],'flowTracking.pipeline.sources',{maxItems:16,maxLength:80})),jobs:Object.freeze({mode:enumValue(jobs.mode,'failed-only','flowTracking.pipeline.jobs.mode',['none','failed-only','all']),patterns:Object.freeze(stringList(jobs.patterns,['*'],'flowTracking.pipeline.jobs.patterns',{maxItems:64})),maxItems:intValue(jobs.maxItems,10,'flowTracking.pipeline.jobs.maxItems',0,50)})}),flowMergeRequest:Object.freeze({enabled:boolValue(mr.enabled,true,'flowTracking.mergeRequest.enabled'),actions:Object.freeze(stringList(mr.actions,['merge'],'flowTracking.mergeRequest.actions',{allowed:['open','reopen','merge','close'],maxItems:4,maxLength:32}))}),flowPush:Object.freeze({enabled:boolValue(push.enabled,false,'flowTracking.push.enabled'),actions:Object.freeze(stringList(push.actions,['delete'],'flowTracking.push.actions',{allowed:['create','delete'],maxItems:2,maxLength:32})),patterns:Object.freeze(stringList(push.patterns,['*'],'flowTracking.push.patterns',{maxItems:64}))}),flowTag:Object.freeze({enabled:boolValue(tag.enabled,true,'flowTracking.tag.enabled'),actions:Object.freeze(stringList(tag.actions,['create'],'flowTracking.tag.actions',{allowed:['create','delete'],maxItems:2,maxLength:32})),patterns:Object.freeze(stringList(tag.patterns,['v*'],'flowTracking.tag.patterns',{maxItems:64}))})});}\n"""
          s=read(p)
          if marker not in s: raise SystemExit('config marker missing')
          write(p,s.replace(marker,flow_helpers+marker,1))
          repl(p,"const structured=loadStructuredConfig(),s=structured.value.server,g=structured.value.gitlab,w=structured.value.webhook,r=structured.value.review,c=structured.value.codex,runner=structured.value.runner,pub=structured.value.publication,n=structured.value.notifications,life=structured.value.lifecycle,obs=structured.value.observability;", "const structured=loadStructuredConfig(),s=structured.value.server,g=structured.value.gitlab,w=structured.value.webhook,r=structured.value.review,f=structured.value.flowTracking,c=structured.value.codex,runner=structured.value.runner,pub=structured.value.publication,n=structured.value.notifications,life=structured.value.lifecycle,obs=structured.value.observability;")
          repl(p,"const notificationEnabled=boolValue(n.enabled,false,'notifications.enabled'),notificationRoutes=parseNotificationRoutes(n.routes);", "const notificationEnabled=boolValue(n.enabled,false,'notifications.enabled'),notificationRoutes=parseNotificationRoutes(n.routes),flowTracking=parseFlowTracking(f);")
          repl(p,"triggerOnReopen:boolValue(r.triggerOnReopen,true,'review.triggerOnReopen'),publisherConcurrency", "triggerOnReopen:boolValue(r.triggerOnReopen,true,'review.triggerOnReopen'),...flowTracking,publisherConcurrency")
          repl(p,"parseNotificationRoutes,NOTIFICATION_EVENTS,CONFIG_SCHEMA_VERSION};", "parseNotificationRoutes,parseFlowTracking,stringList,NOTIFICATION_EVENTS,FLOW_EVENTS,CONFIG_SCHEMA_VERSION};")

          # Durable DB schema 7 and schema 6 -> 7 migration with verified backup.
          p='src/db-migrations.js'
          repl(p,'const CURRENT_SCHEMA_VERSION = 6;','const CURRENT_SCHEMA_VERSION = 7;')
          marker='const MIGRATIONS = Object.freeze(new Map([[5, migrate5To6]]));'
          migrate="""function migrate6To7(db, dbPath, hooks = {}) {\n  integrityCheck(db, 'pre-migration');\n  const backupPath = createBackup(db, dbPath, 6);\n  hooks.afterBackup?.({ backupPath, from: 6, to: 7 });\n  db.exec('BEGIN IMMEDIATE');\n  try {\n    db.exec(`\n      CREATE TABLE IF NOT EXISTS flow_state(\n        project_id INTEGER NOT NULL,\n        flow_type TEXT NOT NULL,\n        external_id TEXT NOT NULL,\n        ref TEXT NOT NULL DEFAULT '',\n        previous_status TEXT NOT NULL DEFAULT '',\n        current_status TEXT NOT NULL,\n        revision INTEGER NOT NULL DEFAULT 1,\n        delivery_identity TEXT NOT NULL DEFAULT '',\n        updated_at TEXT NOT NULL,\n        PRIMARY KEY(project_id,flow_type,external_id)\n      );\n      CREATE INDEX IF NOT EXISTS idx_flow_state_updated ON flow_state(updated_at,project_id,flow_type);\n    `);\n    hooks.afterDdl?.({ backupPath, from: 6, to: 7 });\n    db.prepare('INSERT OR REPLACE INTO schema_migrations(version,applied_at,backup_path) VALUES(?,?,?)').run(7, new Date().toISOString(), backupPath);\n    db.exec('PRAGMA user_version=7');\n    hooks.beforeCommit?.({ backupPath, from: 6, to: 7 });\n    db.exec('COMMIT');\n  } catch (cause) {\n    try { db.exec('ROLLBACK'); } catch {}\n    const error = new Error(`SQLite schema migration 6 -> 7 failed; original database remains authoritative and backup is ${backupPath}`);\n    error.code = 'EDBMIGRATION'; error.backupPath = backupPath; error.cause = cause; throw error;\n  }\n  integrityCheck(db, 'post-migration');\n  return Object.freeze({ from: 6, to: 7, backupPath });\n}\n\nconst MIGRATIONS = Object.freeze(new Map([[5, migrate5To6],[6, migrate6To7]]));"""
          repl(p,marker,migrate)
          repl(p,'  migrate5To6\n});','  migrate5To6,\n  migrate6To7\n});')

          p='src/db.js'
          repl(p,"if(current===5){this.lastMigration=migrateDatabase(this.db,this.dbPath,current,this.migrationHooks);return;}", "if(current===5||current===6){this.lastMigration=migrateDatabase(this.db,this.dbPath,current,this.migrationHooks);return;}")
          repl(p,'expected fresh database, Schema 5 migration source, or Schema ${SCHEMA_VERSION}', 'expected fresh database, Schema 5/6 migration source, or Schema ${SCHEMA_VERSION}')
          repl(p,"      CREATE TABLE IF NOT EXISTS notification_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL DEFAULT 0,mr_iid INTEGER NOT NULL DEFAULT 0,route_name TEXT NOT NULL,provider TEXT NOT NULL,secret_ref TEXT NOT NULL,event_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);", "      CREATE TABLE IF NOT EXISTS notification_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL DEFAULT 0,mr_iid INTEGER NOT NULL DEFAULT 0,route_name TEXT NOT NULL,provider TEXT NOT NULL,secret_ref TEXT NOT NULL,event_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);\n      CREATE TABLE IF NOT EXISTS flow_state(project_id INTEGER NOT NULL,flow_type TEXT NOT NULL,external_id TEXT NOT NULL,ref TEXT NOT NULL DEFAULT '',previous_status TEXT NOT NULL DEFAULT '',current_status TEXT NOT NULL,revision INTEGER NOT NULL DEFAULT 1,delivery_identity TEXT NOT NULL DEFAULT '',updated_at TEXT NOT NULL,PRIMARY KEY(project_id,flow_type,external_id));")
          repl(p,"CREATE INDEX IF NOT EXISTS idx_notification_run ON notification_outbox(run_id,id);PRAGMA user_version=${SCHEMA_VERSION};", "CREATE INDEX IF NOT EXISTS idx_notification_run ON notification_outbox(run_id,id);CREATE INDEX IF NOT EXISTS idx_flow_state_updated ON flow_state(updated_at,project_id,flow_type);PRAGMA user_version=${SCHEMA_VERSION};")
          marker='  stats(){'
          method="""  transitionFlowState({projectId,flowType,externalId,ref='',status,deliveryIdentity=''}){const pid=Number(projectId),type=String(flowType||''),external=String(externalId||''),next=String(status||''),now=new Date().toISOString();if(!Number.isInteger(pid)||pid<=0||!type||!external||!next){const error=new Error('Flow state identity is invalid');error.code='EFLOWSTATE';throw error;}return this.withTransaction(()=>{const row=this.db.prepare('SELECT * FROM flow_state WHERE project_id=? AND flow_type=? AND external_id=?').get(pid,type,external);if(!row){this.db.prepare('INSERT INTO flow_state(project_id,flow_type,external_id,ref,previous_status,current_status,revision,delivery_identity,updated_at) VALUES(?,?,?,?,?,?,?,?,?)').run(pid,type,external,String(ref||''),'',next,1,String(deliveryIdentity||''),now);return{changed:true,previousStatus:'',revision:1};}if(row.current_status===next){this.db.prepare('UPDATE flow_state SET ref=?,delivery_identity=?,updated_at=? WHERE project_id=? AND flow_type=? AND external_id=?').run(String(ref||''),String(deliveryIdentity||''),now,pid,type,external);return{changed:false,previousStatus:next,revision:Number(row.revision)};}const revision=Number(row.revision)+1;this.db.prepare('UPDATE flow_state SET ref=?,previous_status=current_status,current_status=?,revision=?,delivery_identity=?,updated_at=? WHERE project_id=? AND flow_type=? AND external_id=?').run(String(ref||''),next,revision,String(deliveryIdentity||''),now,pid,type,external);return{changed:true,previousStatus:String(row.current_status||''),revision};});}\n"""
          s=read(p)
          if marker not in s: raise SystemExit('db stats marker missing')
          write(p,s.replace(marker,method+marker,1))
          repl(p,"return{jobs,publications,notifications,webhookCount:Number(this.db.prepare('SELECT COUNT(*) count FROM webhook_events').get().count),findings:", "return{jobs,publications,notifications,flowStates:Number(this.db.prepare('SELECT COUNT(*) count FROM flow_state').get().count),webhookCount:Number(this.db.prepare('SELECT COUNT(*) count FROM webhook_events').get().count),findings:")
          old="const webhooks=this.db.prepare('DELETE FROM webhook_events WHERE processed_at IS NOT NULL AND received_at<?').run(webhookCutoff).changes,placeholders=TERMINAL_JOB_STATUSES.map(()=>'?').join(','),jobs=this.db.prepare(`DELETE FROM review_jobs WHERE status IN (${placeholders}) AND finished_at IS NOT NULL AND finished_at<?`).run(...TERMINAL_JOB_STATUSES,jobCutoff).changes;return{webhooks,jobs};"
          new="const webhooks=this.db.prepare('DELETE FROM webhook_events WHERE processed_at IS NOT NULL AND received_at<?').run(webhookCutoff).changes,flowStates=this.db.prepare('DELETE FROM flow_state WHERE updated_at<?').run(jobCutoff).changes,placeholders=TERMINAL_JOB_STATUSES.map(()=>'?').join(','),jobs=this.db.prepare(`DELETE FROM review_jobs WHERE status IN (${placeholders}) AND finished_at IS NOT NULL AND finished_at<?`).run(...TERMINAL_JOB_STATUSES,jobCutoff).changes;return{webhooks,flowStates,jobs};"
          repl(p,old,new)

          # Extend deterministic notification catalog/formatters; no free-form templates.
          p='src/notification.js'
          repl(p,"const crypto=require('node:crypto');", "const crypto=require('node:crypto');\nconst{FLOW_EVENTS}=require('./flow-tracking');")
          repl(p,"const EVENTS=Object.freeze(['review.completed','review.blocked','review.failed','service.degraded','service.recovered']);", "const EVENTS=Object.freeze(['review.completed','review.blocked','review.failed','service.degraded','service.recovered',...FLOW_EVENTS]);")
          old="function titleFor(event){if(event.type==='review.blocked')return'🔴 Codex Review Blocked';if(event.type==='review.failed')return'⚠️ Codex Review Failed';if(event.type==='service.degraded')return'⚠️ Codex Review Service Degraded';if(event.type==='service.recovered')return'🟢 Codex Review Service Recovered';return'🟢 Codex Review Completed';}"
          new="function titleFor(event){if(event.type==='review.blocked')return'🔴 Codex Review Blocked';if(event.type==='review.failed')return'⚠️ Codex Review Failed';if(event.type==='service.degraded')return'⚠️ Codex Review Service Degraded';if(event.type==='service.recovered')return'🟢 Codex Review Service Recovered';if(event.type==='gitlab.pipeline.failed')return'🔴 GitLab Pipeline Failed';if(event.type==='gitlab.pipeline.succeeded')return'🟢 GitLab Pipeline Succeeded';if(event.type==='gitlab.pipeline.canceled'||event.type==='gitlab.pipeline.skipped')return'⚪ GitLab Pipeline Terminal';if(event.type==='gitlab.mr.merged')return'🟢 GitLab MR Merged';if(event.type.startsWith('gitlab.mr.'))return'GitLab MR Lifecycle';if(event.type.startsWith('gitlab.tag.'))return'GitLab Tag Lifecycle';if(event.type.startsWith('gitlab.branch.'))return'GitLab Branch Lifecycle';return'🟢 Codex Review Completed';}"
          repl(p,old,new)
          old="function summaryLines(event){const c=event.findingCounts||counts([]),lines=[];if(event.projectId)lines.push(`Project: ${event.projectId}`,`MR: !${event.mrIid}${event.title?` ${event.title}`:''}`);if(event.occurredAt)lines.push(`Time (UTC): ${event.occurredAt}`);lines.push(`Verdict: ${event.verdict}`);if(event.errorCode)lines.push(`Error: ${event.errorCode}`);if(event.headSha)lines.push(`HEAD: ${event.headSha.slice(0,12)}`);if(event.projectId)lines.push(`Findings: Critical ${c.critical} · High ${c.high} · Medium ${c.medium} · Low ${c.low}`);if(event.durationMs)lines.push(`Duration: ${(event.durationMs/1000).toFixed(1)}s`);return lines;}"
          new="function summaryLines(event){const lines=[];if(String(event.type||'').startsWith('gitlab.')){if(event.projectId)lines.push(`Project: ${event.projectId}`);if(event.occurredAt)lines.push(`Time (UTC): ${event.occurredAt}`);if(event.flowKind==='pipeline'){lines.push(`Pipeline: #${event.externalId}`,`Ref: ${event.ref||'-'}`,`Status: ${event.status}`);if(event.source)lines.push(`Source: ${event.source}`);}else if(event.flowKind==='merge_request'){lines.push(`MR: !${event.mrIid} ${event.title||''}`.trim(),`Status: ${event.status}`);if(event.sourceBranch||event.targetBranch)lines.push(`Branches: ${event.sourceBranch||'-'} → ${event.targetBranch||'-'}`);}else{lines.push(`${event.flowKind==='tag'?'Tag':'Branch'}: ${event.ref||event.externalId}`,`Status: ${event.status}`);}if(event.actor)lines.push(`Actor: ${event.actor}`);if(event.durationMs)lines.push(`Duration: ${(event.durationMs/1000).toFixed(1)}s`);return lines;}const c=event.findingCounts||counts([]);if(event.projectId)lines.push(`Project: ${event.projectId}`,`MR: !${event.mrIid}${event.title?` ${event.title}`:''}`);if(event.occurredAt)lines.push(`Time (UTC): ${event.occurredAt}`);lines.push(`Verdict: ${event.verdict}`);if(event.errorCode)lines.push(`Error: ${event.errorCode}`);if(event.headSha)lines.push(`HEAD: ${event.headSha.slice(0,12)}`);if(event.projectId)lines.push(`Findings: Critical ${c.critical} · High ${c.high} · Medium ${c.medium} · Low ${c.low}`);if(event.durationMs)lines.push(`Duration: ${(event.durationMs/1000).toFixed(1)}s`);return lines;}"
          repl(p,old,new)
          repl(p,"function feishuPayload(event,signature=null){const elements=[{tag:'div',text:{tag:'lark_md',content:summaryLines(event).join('\\n')}}];if(event.topFindings?.length)", "function feishuPayload(event,signature=null){const elements=[{tag:'div',text:{tag:'lark_md',content:summaryLines(event).join('\\n')}}];if(event.jobs?.length)elements.push({tag:'div',text:{tag:'lark_md',content:`Failed jobs\\n${event.jobs.map((job,i)=>`${i+1}. ${job.stage||'-'} · ${job.name} · ${job.failureReason||job.status}`).join('\\n')}`}});if(event.topFindings?.length)")
          repl(p,"if(event.topFindings?.length)card.sub_title_text=cardText(event.topFindings.map((f,i)=>`${i+1}. [${f.severity}] ${f.title} ${f.file}:${f.line}`).join(' · '),112);", "if(event.jobs?.length)card.sub_title_text=cardText(event.jobs.map((job,i)=>`${i+1}. ${job.stage||'-'}/${job.name}: ${job.failureReason||job.status}`).join(' · '),112);else if(event.topFindings?.length)card.sub_title_text=cardText(event.topFindings.map((f,i)=>`${i+1}. [${f.severity}] ${f.title} ${f.file}:${f.line}`).join(' · '),112);")

          # Wire flow tracker into authenticated webhook transaction path; review and flow are orthogonal.
          p='src/http.js'
          repl(p,"function createHttpServer({config,store,service,publisher,notifier,gitlab,telemetry,logger=console,startedAt=Date.now()})", "function createHttpServer({config,store,service,flowTracker,publisher,notifier,gitlab,telemetry,logger=console,startedAt=Date.now()})")
          old="const result=service.handleEvent(event,verification.webhookId);store.markWebhookProcessed(verification.webhookId);telemetry?.metrics?.inc('codex_review_webhook_accepted_total');return json(res,202,{status:result.status});"
          new="const reviewResult=service.handleEvent(event,verification.webhookId),flowResult=flowTracker?.handle(payload,req.headers,verification.webhookId)||{status:'ignored'};store.markWebhookProcessed(verification.webhookId);telemetry?.metrics?.inc('codex_review_webhook_accepted_total');const status=reviewResult.status!=='ignored'?reviewResult.status:flowResult.status;return json(res,202,{status});"
          repl(p,old,new)
          repl(p,"'# TYPE codex_review_webhook_events gauge',`codex_review_webhook_events ${stats.webhookCount}`", "'# TYPE codex_review_flow_states gauge',`codex_review_flow_states ${stats.flowStates||0}`,'# TYPE codex_review_webhook_events gauge',`codex_review_webhook_events ${stats.webhookCount}`")

          p='src/index.js'
          repl(p,"const { Notifier,prepareNotificationRoutes,systemEvent,planNotificationActions }=require('./notification');", "const { Notifier,prepareNotificationRoutes,systemEvent,planNotificationActions }=require('./notification');\nconst { FlowTracker }=require('./flow-tracking');")
          repl(p,"const service=new ReviewService({config,store,gitlab,logger,telemetry}),publisher=new Publisher({config,store,gitlab,logger}),notifier=new Notifier({config,store,logger});", "const service=new ReviewService({config,store,gitlab,logger,telemetry}),flowTracker=new FlowTracker({config,store,planNotificationActions,logger}),publisher=new Publisher({config,store,gitlab,logger}),notifier=new Notifier({config,store,logger});")
          repl(p,"createHttpServer({config,store,service,publisher,notifier,gitlab,telemetry,logger,startedAt})", "createHttpServer({config,store,service,flowTracker,publisher,notifier,gitlab,telemetry,logger,startedAt})")
          repl(p,"service.config=config;publisher.config=config;notifier.refreshConfig(config);", "service.config=config;flowTracker.refreshConfig(config);publisher.config=config;notifier.refreshConfig(config);")
          repl(p,"notifiers:config.notificationEnabled?config.notificationConcurrency:0,synchronous", "notifiers:config.notificationEnabled?config.notificationConcurrency:0,flowTracking:config.flowTrackingEnabled,synchronous")

          # Example configs: Schema 4 and explicit, disabled-by-default Flow Tracking policy.
          flow={"enabled":False,"pipeline":{"enabled":True,"statuses":["failed"],"refs":["*"],"sources":["push","merge_request_event","web"],"jobs":{"mode":"failed-only","patterns":["*"],"maxItems":10}},"mergeRequest":{"enabled":True,"actions":["merge"]},"push":{"enabled":False,"actions":["delete"],"patterns":["*"]},"tag":{"enabled":True,"actions":["create"],"patterns":["v*"]}}
          for fp in ['config.example.json','deploy/docker/config.example.json','deploy/systemd/config.example.json']:
              data=json.loads(read(fp)); data['schemaVersion']=4
              out={}
              for k,v in data.items():
                  out[k]=v
                  if k=='review': out['flowTracking']=flow
              if 'flowTracking' not in out: out['flowTracking']=flow
              write(fp,json.dumps(out,ensure_ascii=False,indent=2)+'\n')

          # Current deployment/release identity.
          for fp in ['deploy/docker/compose.yaml','deploy/docker/README.md','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','VERIFY_RELEASE.md']:
              if (R/fp).exists():
                  s=read(fp).replace('6.3.1','6.4.0')
                  write(fp,s)

          # Docs: keep Flow Tracking deterministic, zero-token, scoped and opt-in.
          flow_en="""# GitLab Flow Tracking\n\nGitLab Flow Tracking is an opt-in, deterministic event domain inside Codex Review Service. It observes selected GitLab CI/CD lifecycle transitions and routes them through the existing durable notification outbox. **It never invokes Codex and consumes zero model tokens.**\n\n## Boundary\n\nFlow Tracking is not a general GitLab administration bot. Supported event families are Pipeline terminal transitions, Merge Request lifecycle, Tag create/delete, and Branch create/delete. Generic issues, wiki events, user/group administration and arbitrary System Hooks remain out of scope.\n\n## Configuration\n\nConfig Schema 4 adds `flowTracking`. `enabled` defaults to `false`, so upgrading does not start new notifications. When enabled with omitted sub-options, the conservative defaults are Pipeline `failed`, MR `merge`, `v*` Tag `create`, and Branch tracking disabled. Pipeline refs, sources and job name patterns accept anchored `*`/`?` globs. Job detail mode is `none`, `failed-only`, or `all`.\n\n`flowTracking` decides which GitLab flows are observed. `notifications.routes[].events` independently decides which normalized terminal events reach each Feishu/WeCom route. This keeps event acquisition and delivery routing orthogonal.\n\nSupported notification events:\n\n- `gitlab.pipeline.succeeded` / `failed` / `canceled` / `skipped`\n- `gitlab.mr.opened` / `merged` / `closed`\n- `gitlab.tag.created` / `deleted`\n- `gitlab.branch.created` / `deleted`\n\n## Transition semantics\n\nEvery accepted flow update is projected into SQLite `flow_state` using `(project_id, flow_type, external_id)` as the identity. Repeating the same status does not notify. A real transition increments a revision, which becomes part of the notification dedupe key. A retry such as `failed -> running -> failed` therefore produces a second, legitimate terminal event, while duplicate webhooks remain idempotent.\n\nPipeline non-terminal states can update the projection without notifying. Terminal cards contain the pipeline/ref/status/source/duration and optionally filtered job summaries. No raw logs, job artifacts, diff, prompt, secret or receipt are sent to IM.\n\n## GitLab integration\n\nKeep Merge Request and Note hooks for Review. Enable Pipeline events when Pipeline Tracking is used, Tag Push events for Tag Tracking, and Push events for Branch create/delete Tracking. All events use the same Classic Token (<19.1) or Standard HMAC (>=19.1) authenticated webhook ingress and existing project/group allowlist.\n"""
          flow_zh="""# GitLab 流程跟踪\n\nGitLab Flow Tracking 是 Codex Review Service 内一个默认关闭的确定性事件域，用于观察选定的 GitLab CI/CD 生命周期转换，并复用现有 durable notification outbox 投递通知。**该路径绝不调用 Codex，模型 Token 消耗为 0。**\n\n## 产品边界\n\nFlow Tracking 不是通用 GitLab 运维机器人。正式支持 Pipeline 终态、Merge Request 生命周期、Tag 创建/删除、Branch 创建/删除；Issue、Wiki、用户/Group 管理和任意 System Hook 继续明确不属于 Review Service。\n\n## 配置\n\nConfig Schema 4 新增 `flowTracking`。`enabled` 默认 `false`，升级后不会自动产生新通知。开启但省略子项时采用克制默认值：Pipeline 仅 `failed`、MR 仅 `merge`、Tag 仅 `v*` 的 `create`，Branch Tracking 默认关闭。Pipeline ref/source/job name 可通过锚定的 `*`/`?` glob 过滤；Job 明细支持 `none`、`failed-only`、`all`。\n\n`flowTracking` 决定跟踪哪些 GitLab 流程；`notifications.routes[].events` 独立决定哪些标准化终态事件进入哪个飞书/企业微信 Route，两层正交。\n\n可路由事件：\n\n- `gitlab.pipeline.succeeded` / `failed` / `canceled` / `skipped`\n- `gitlab.mr.opened` / `merged` / `closed`\n- `gitlab.tag.created` / `deleted`\n- `gitlab.branch.created` / `deleted`\n\n## 状态转换语义\n\n每个已认证的 Flow 更新都会按 `(project_id, flow_type, external_id)` 投影到 SQLite `flow_state`。相同状态重复到达不会通知；真实状态转换才递增 revision，并把 revision 纳入 notification dedupe key。因此 `failed -> running -> failed` 的第二次失败会产生新的合法事件，而重复 Webhook 保持幂等。\n\nPipeline 的非终态可以更新状态投影但不通知。终态卡片只包含 Pipeline/ref/status/source/duration 与经过配置过滤的 Job 摘要；不会发送 raw log、artifact、diff、Prompt、Secret 或完整 Receipt。\n\n## GitLab Hook\n\nReview 继续开启 Merge Request + Note events。使用 Pipeline Tracking 时额外开启 Pipeline events；Tag Tracking 开启 Tag Push events；Branch 创建/删除跟踪开启 Push events。所有事件继续复用同一 Classic Token（<19.1）或 Standard HMAC（>=19.1）认证入口以及 Project/Group allowlist。\n"""
          write('docs/FLOW_TRACKING.md',flow_en); write('docs/FLOW_TRACKING.zh-CN.md',flow_zh)
          for fp,extra in [
            ('docs/GITLAB_SETUP.md','\n## Flow Tracking hooks\n\nWhen `flowTracking.enabled=true`, enable only the GitLab hooks required by the configured families: Pipeline events for Pipeline Tracking, Tag Push events for Tag Tracking, and Push events for Branch create/delete Tracking. Flow events reuse the same authenticated webhook endpoint, allowlist and durable dedupe path. They never invoke Codex.\n'),
            ('docs/GITLAB_SETUP.zh-CN.md','\n## Flow Tracking Hook\n\n当 `flowTracking.enabled=true` 时，只额外开启配置实际需要的 Hook：Pipeline Tracking 开启 Pipeline events，Tag Tracking 开启 Tag Push events，Branch 创建/删除跟踪开启 Push events。Flow 事件继续复用同一个认证 Webhook、allowlist 与 durable dedupe 路径，并且绝不调用 Codex。\n'),
            ('docs/NOTIFICATIONS.md','\n## GitLab Flow events\n\nConfig Schema 4 can route deterministic `gitlab.pipeline.*`, `gitlab.mr.*`, `gitlab.tag.*` and `gitlab.branch.*` events through the same durable outbox. Acquisition is controlled by `flowTracking`; delivery remains controlled by `notifications.routes[].events`. Flow cards are local deterministic formatters and consume zero Codex tokens. See `FLOW_TRACKING.md`.\n'),
            ('docs/NOTIFICATIONS.zh-CN.md','\n## GitLab Flow 事件\n\nConfig Schema 4 可以通过同一 durable outbox 路由确定性的 `gitlab.pipeline.*`、`gitlab.mr.*`、`gitlab.tag.*`、`gitlab.branch.*` 事件。事件采集由 `flowTracking` 控制，投递仍由 `notifications.routes[].events` 控制；Flow 卡片完全由本地 formatter 生成，Codex Token 消耗为 0。详见 `FLOW_TRACKING.zh-CN.md`。\n'),
            ('docs/STORAGE_AND_MIGRATIONS.md','\n## Schema 7\n\nSchema 7 adds `flow_state`, a compact transition projection keyed by project/type/external ID. Migration 6 -> 7 follows the existing integrity-check + verified `VACUUM INTO` backup + transactional DDL process. Old flow state is pruned with normal data retention.\n'),
            ('docs/TOKEN_EFFICIENCY.md','\n## Flow Tracking\n\nFlow Tracking is deterministic webhook/state/notification processing and never invokes Codex. Its model-token cost is exactly zero.\n'),
            ('docs/TOKEN_EFFICIENCY.zh-CN.md','\n## Flow Tracking\n\nFlow Tracking 只进行确定性的 Webhook、状态投影和通知处理，绝不调用 Codex，因此模型 Token 成本严格为 0。\n')]:
              s=read(fp)
              if extra.strip().splitlines()[0] not in s: write(fp,s.rstrip()+extra+'\n')

          # Changelog before generated contract docs.
          ch=read('CHANGELOG.md')
          entry="""## 6.4.0\n\n- Add opt-in GitLab Flow Tracking for Pipeline terminal states, MR lifecycle, Tag and Branch create/delete events.\n- Add Config Schema 4 with independent flow acquisition filters and existing notification-route delivery filters.\n- Add durable SQLite `flow_state` transition projection and safe Schema 6 -> 7 migration with verified backup.\n- Pipeline job summaries support deterministic failed-only/all/none filtering without sending raw logs or artifacts.\n- Flow Tracking never invokes Codex; model Token cost remains zero.\n- Preserve GitLab 14.6.1 Classic, >=15.7 Modern and >=19.1 Standard HMAC capability boundaries.\n\n"""
          if '## 6.4.0' not in ch: write('CHANGELOG.md',entry+ch)

          # Generate contract-owned current identity blocks, then append architecture/readme feature notes if absent.
          PY
          node scripts/generate-contract-docs.js
          python3 - <<'PY'
          import pathlib
          def append_once(path,marker,text):
              p=pathlib.Path(path); s=p.read_text()
              if marker not in s: p.write_text(s.rstrip()+'\n\n'+text.strip()+'\n')
          append_once('README.md','## GitLab Flow Tracking','## GitLab Flow Tracking\n\nOptional Config Schema 4 Flow Tracking observes Pipeline terminal transitions, MR lifecycle, Tags and Branch create/delete events and routes them through the existing durable notification outbox. It is deterministic, disabled by default, and never invokes Codex. See `docs/FLOW_TRACKING.md`.')
          append_once('README.zh-CN.md','## GitLab 流程跟踪','## GitLab 流程跟踪\n\nConfig Schema 4 提供默认关闭的 GitLab Flow Tracking，可跟踪 Pipeline 终态、MR 生命周期、Tag 与 Branch 创建/删除，并复用现有 durable notification outbox。整个路径确定性执行且绝不调用 Codex。详见 `docs/FLOW_TRACKING.zh-CN.md`。')
          append_once('docs/ARCHITECTURE.md','## GitLab Flow Tracking Domain','## GitLab Flow Tracking Domain\n\nAuthenticated GitLab webhooks are split into two orthogonal consumers: the Review Domain may enqueue Codex review work, while the Flow Tracking Domain only updates `flow_state` and creates deterministic notification actions. The Flow path cannot call Codex, mutate code, retry pipelines, or create MRs. Both paths share webhook authentication/dedupe, project scope and the durable notification outbox.')
          PY


name: Prepare Patch Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next patch version with reviewed release notes'
        required: true
        type: string
      source_sha:
        description: 'Exact current main SHA after successful full main CI'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: prepare-patch-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, '/prepare-release ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Prepare a new source-bound metadata branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release-branch.js
      - name: Preserve preparation receipt (not a release or production receipt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: RELEASE_PREPARATION.json
          if-no-files-found: error
          retention-days: 14

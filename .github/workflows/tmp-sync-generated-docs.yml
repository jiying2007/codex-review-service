name: Temporary Service generated docs
on:
  push:
    branches: [fix/core-4.13.1-runner-bounds]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true, fetch-depth: 0, submodules: recursive}
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: {node-version: '22.22.2'}
      - name: Generate canonical Product Contract docs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-contract-docs.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(contract): sync Service 7.4.1 generated identity'
          git push origin HEAD:fix/core-4.13.1-runner-bounds

name: Repin Review Service Core v4.9.6 once
on:
  push:
permissions:
  contents: write
jobs:
  repin:
    if: github.ref == 'refs/heads/repin-core-v4.9.6'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-core-v4.9.6
          persist-credentials: true
          submodules: recursive
      - name: Repin exact Core trust root
        env:
          NEW_SHA: 43e818dc9ae91051f55374a9f9a47b9df6420cd6
        shell: bash
        run: |
          set -euo pipefail
          node src/codex-safe-core/scripts/repin-consumer.js . "$NEW_SHA"
          git checkout -- .github/workflows/family-release-guard.yml
          node <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('product-contract.json','utf8'));p.safeCoreVersion='4.9.6';fs.writeFileSync('product-contract.json',JSON.stringify(p,null,2)+'\n');
          NODE
          node scripts/generate-contract-docs.js
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add .codex-safe.example.json product-contract.json README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md src/codex-safe-core
          git commit -m 'chore(family): pin Review Service to Core v4.9.6'
          git push origin HEAD:repin-core-v4.9.6

name: Retry atomic v6.4.0 flow finalization once
on:
  push:
permissions:
  contents: write
jobs:
  retry:
    if: github.ref == 'refs/heads/feat-flow-tracking-v6.4.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24.19.0
      - name: Reuse atomic patch and sync exact package whitelist
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "actionFactory=null" src/db.js; then
            echo 'Atomic flow finalization already committed; nothing to do.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/flow-atomic-v6.4.0-once.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if line.strip()=='run: |')
          body=[]
          for line in source[start+1:]:
              if line.startswith('          '): body.append(line[10:])
              elif not line.strip(): body.append('')
              else: break
          script='\n'.join(body)+'\n'
          marker='npm run check'
          patch=r'''python3 - <<'PYPACKAGE'
          from pathlib import Path
          p=Path('scripts/verify-family.js'); s=p.read_text()
          old="'docs/ARCHITECTURE.md','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','docs/NOTIFICATIONS.md','docs/NOTIFICATIONS.zh-CN.md','docs/GITLAB_SETUP.md'"
          new="'docs/ARCHITECTURE.md','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','docs/NOTIFICATIONS.md','docs/NOTIFICATIONS.zh-CN.md','docs/FLOW_TRACKING.md','docs/FLOW_TRACKING.zh-CN.md','docs/GITLAB_SETUP.md'"
          if old not in s: raise SystemExit('package whitelist marker missing')
          p.write_text(s.replace(old,new,1))
          PYPACKAGE
          '''
          if marker not in script: raise SystemExit('check marker missing')
          script=script.replace(marker,patch+'\n'+marker,1)
          old='git add src/db.js src/flow-tracking.js test/flow-tracking.test.js test/flow-db.test.js'
          new=old+' scripts/verify-family.js'
          if old not in script: raise SystemExit('git add marker missing')
          script=script.replace(old,new,1)
          Path('/tmp/atomic-v640.sh').write_text(script)
          PY
          bash /tmp/atomic-v640.sh

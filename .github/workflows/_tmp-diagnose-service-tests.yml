name: Temporary Service Test Diagnostics

on:
  push:
    branches: ["feat/model-routing-v1-runtime"]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/model-routing-v1-runtime
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run service tests with ephemeral error logger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/service.test.js')
          t=p.read_text()
          old="logger:{info(){},warn(){},error(){}}"
          new="logger:{info(){},warn(){},error(value){process.stderr.write('SERVICE_TEST_ERROR '+JSON.stringify(value)+'\\n')}}"
          if old not in t:
              raise SystemExit('service logger anchor missing')
          p.write_text(t.replace(old,new))
          PY
          node --test test/service.test.js

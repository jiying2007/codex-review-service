name: Notification Terminal Refactor Once

on:
  push:
    branches: [feature/im-notifications-4.1.0]

permissions:
  contents: write

jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[notification-terminal]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22'
          cache: npm
      - name: Refactor notification boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path
          def read(f): return p(f).read_text()
          def write(f,s): p(f).write_text(s)
          def rep(f,a,b):
              s=read(f)
              if a not in s: raise SystemExit(f'missing pattern in {f}: {a[:100]!r}')
              write(f,s.replace(a,b))

          # db.js owns the complete durable schema and notification outbox directly.
          rep('src/db.js','const SCHEMA_VERSION = 4;','const SCHEMA_VERSION = 5;')
          rep('src/db.js',"      CREATE TABLE IF NOT EXISTS publication_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL,mr_iid INTEGER NOT NULL,action_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);","      CREATE TABLE IF NOT EXISTS publication_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL,mr_iid INTEGER NOT NULL,action_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);\n      CREATE TABLE IF NOT EXISTS notification_outbox(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id INTEGER REFERENCES review_runs(id) ON DELETE CASCADE,project_id INTEGER NOT NULL DEFAULT 0,mr_iid INTEGER NOT NULL DEFAULT 0,route_name TEXT NOT NULL,provider TEXT NOT NULL,secret_ref TEXT NOT NULL,event_type TEXT NOT NULL,dedupe_key TEXT NOT NULL UNIQUE,payload_json TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',attempt INTEGER NOT NULL DEFAULT 0,available_at TEXT NOT NULL,remote_id TEXT,error_code TEXT,created_at TEXT NOT NULL,started_at TEXT,finished_at TEXT);")
          rep('src/db.js',"CREATE INDEX IF NOT EXISTS idx_outbox_run ON publication_outbox(run_id,id);PRAGMA user_version=${SCHEMA_VERSION};","CREATE INDEX IF NOT EXISTS idx_outbox_run ON publication_outbox(run_id,id);CREATE INDEX IF NOT EXISTS idx_notification_status_available ON notification_outbox(status,available_at,id);CREATE INDEX IF NOT EXISTS idx_notification_run ON notification_outbox(run_id,id);PRAGMA user_version=${SCHEMA_VERSION};")
          rep('src/db.js',"  publicationDepth(){return Number(this.db.prepare(\"SELECT COUNT(*) count FROM publication_outbox WHERE status='pending'\").get().count);}","  publicationDepth(){return Number(this.db.prepare(\"SELECT COUNT(*) count FROM publication_outbox WHERE status='pending'\").get().count);}\n  notificationDepth(){return Number(this.db.prepare(\"SELECT COUNT(*) count FROM notification_outbox WHERE status='pending'\").get().count);}")
          rep('src/db.js',"  recoverPublications(){return this.db.prepare(\"UPDATE publication_outbox SET status='pending',started_at=NULL,error_code='ESERVICERESTART',available_at=? WHERE status='publishing'\").run(new Date().toISOString()).changes;}","  recoverPublications(){return this.db.prepare(\"UPDATE publication_outbox SET status='pending',started_at=NULL,error_code='ESERVICERESTART',available_at=? WHERE status='publishing'\").run(new Date().toISOString()).changes;}\n  recoverNotifications(){return this.db.prepare(\"UPDATE notification_outbox SET status='pending',started_at=NULL,error_code='ESERVICERESTART',available_at=? WHERE status='delivering'\").run(new Date().toISOString()).changes;}")
          rep('src/db.js',"  getJob(id){return this.db.prepare('SELECT * FROM review_jobs WHERE id=?').get(id)||null;}","  claimNotification(){return this.withTransaction(()=>{const now=new Date().toISOString(),row=this.db.prepare(\"SELECT * FROM notification_outbox WHERE status='pending' AND available_at<=? ORDER BY id LIMIT 1\").get(now);if(!row)return null;const result=this.db.prepare(\"UPDATE notification_outbox SET status='delivering',started_at=?,attempt=attempt+1 WHERE id=? AND status='pending'\").run(now,row.id);if(result.changes!==1)return null;const value=this.db.prepare('SELECT * FROM notification_outbox WHERE id=?').get(row.id);value.payload=parseJson(value.payload_json);return value;});}\n  getJob(id){return this.db.prepare('SELECT * FROM review_jobs WHERE id=?').get(id)||null;}")
          rep('src/db.js',"  saveRunWithOutbox(jobId,review,durationMs,policy,actions,receiptProjection=null){","  saveRunWithOutbox(jobId,review,durationMs,policy,actions,receiptProjection=null,notificationActions=[]){")
          rep('src/db.js',"for(const action of actions||[])insertAction.run(runId,action.projectId,action.mrIid,action.type,action.dedupeKey,json(action.payload),now,now);return runId;});}","for(const action of actions||[])insertAction.run(runId,action.projectId,action.mrIid,action.type,action.dedupeKey,json(action.payload),now,now);const insertNotification=this.db.prepare(\"INSERT OR IGNORE INTO notification_outbox(run_id,project_id,mr_iid,route_name,provider,secret_ref,event_type,dedupe_key,payload_json,status,available_at,created_at) VALUES(?,?,?,?,?,?,?,?,?,'pending',?,?)\");for(const action of notificationActions||[])insertNotification.run(runId,action.payload?.projectId||0,action.payload?.mrIid||0,action.routeName,action.provider,action.secretRef,action.eventType,action.dedupeKey,json(action.payload),now,now);return runId;});}")
          rep('src/db.js',"  finishPublication(id,remoteId=null){","  enqueueNotification({runId=null,routeName,provider,secretRef,eventType,dedupeKey,payload,delayMs=0}){const now=new Date().toISOString();try{const result=this.db.prepare(\"INSERT INTO notification_outbox(run_id,project_id,mr_iid,route_name,provider,secret_ref,event_type,dedupe_key,payload_json,status,available_at,created_at) VALUES(?,?,?,?,?,?,?,?,?,'pending',?,?)\").run(runId,payload?.projectId||0,payload?.mrIid||0,routeName,provider,secretRef,eventType,dedupeKey,json(payload),isoAfter(delayMs),now);return Number(result.lastInsertRowid);}catch(error){if(String(error.message).includes('UNIQUE constraint failed'))return null;throw error;}}\n  finishNotification(id,remoteId=null){this.db.prepare(\"UPDATE notification_outbox SET status='delivered',remote_id=?,error_code=NULL,finished_at=? WHERE id=?\").run(remoteId,new Date().toISOString(),id);}\n  retryNotification(id,errorCode,delayMs){this.db.prepare(\"UPDATE notification_outbox SET status='pending',error_code=?,started_at=NULL,available_at=? WHERE id=? AND status='delivering'\").run(errorCode,isoAfter(delayMs),id);}\n  failNotification(id,errorCode){this.db.prepare(\"UPDATE notification_outbox SET status='failed',error_code=?,finished_at=? WHERE id=?\").run(errorCode,new Date().toISOString(),id);}\n  finishPublication(id,remoteId=null){")
          rep('src/db.js',"  stats(){const jobs=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM review_jobs GROUP BY status').all().map(r=>[r.status,Number(r.count)])),publications=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM publication_outbox GROUP BY status').all().map(r=>[r.status,Number(r.count)])),usage=","  stats(){const jobs=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM review_jobs GROUP BY status').all().map(r=>[r.status,Number(r.count)])),publications=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM publication_outbox GROUP BY status').all().map(r=>[r.status,Number(r.count)])),notifications=Object.fromEntries(this.db.prepare('SELECT status,COUNT(*) count FROM notification_outbox GROUP BY status').all().map(r=>[r.status,Number(r.count)])),usage=")
          rep('src/db.js',"return{jobs,publications,webhookCount:","return{jobs,publications,notifications,webhookCount:")

          # Service explicitly creates complete notification events from MR/snapshot context.
          rep('src/service.js',"const{classifyFindingLifecycle}=require('./finding-ledger');","const{classifyFindingLifecycle}=require('./finding-ledger');\nconst{eventForReview,eventForFailure,planNotificationActions}=require('./notification');")
          rep('src/service.js',"const actions=this.planPublication(job,snapshot,review,policy),receiptProjection=createServiceReviewReceipt(snapshot,review,policy);this.store.saveRunWithOutbox(job.id,review,Date.now()-started,policy,actions,receiptProjection);","const durationMs=Date.now()-started,actions=this.planPublication(job,snapshot,review,policy),receiptProjection=createServiceReviewReceipt(snapshot,review,policy),notificationEvent=eventForReview({job,mr,snapshot,review,durationMs,topFindings:this.config.notificationTopFindings}),notificationActions=planNotificationActions(this.config,notificationEvent,`run:${job.id}:${snapshot.headSha}`);this.store.saveRunWithOutbox(job.id,review,durationMs,policy,actions,receiptProjection,notificationActions);")
          rep('src/service.js',"this.store.finishJob(job.id,'failed',code);this.enqueueStatus(job,'failed',code==='EPROJECTPOLICY'?'Codex review policy is invalid':code==='ETOKENBUDGET'?'Codex review token budget exhausted':'Codex review service failed');","this.store.finishJob(job.id,'failed',code);this.enqueueStatus(job,'failed',code==='EPROJECTPOLICY'?'Codex review policy is invalid':code==='ETOKENBUDGET'?'Codex review token budget exhausted':'Codex review service failed');const notificationEvent=eventForFailure(job,code);for(const action of planNotificationActions(this.config,notificationEvent,`job:${job.id}`))this.store.enqueueNotification(action);")

          # Remove notification-store monkey-patch from startup.
          rep('src/index.js',"const { installNotificationStore }=require('./notification-store');\n",'')
          rep('src/index.js',"const store=installNotificationStore(new Store(config.dbPath),config),scheduler=installFairScheduling(store),","const store=new Store(config.dbPath),scheduler=installFairScheduling(store),")
          rep('src/index.js',"store.setNotificationConfig(config);",'')
          rep('src/index.js',"notificationSchemaVersion:store.notificationSchemaVersion(),",'')
          rep('src/index.js',"store.setNotificationConfig(config);service.config=config;","service.config=config;")

          # Verifier now enforces one canonical DB schema, no compatibility/extension store.
          rep('scripts/verify-family-v4.js',"const { NOTIFICATION_SCHEMA_VERSION } = require('../src/notification-store');\n",'')
          rep('scripts/verify-family-v4.js',"assert.equal(SCHEMA_VERSION, 4, 'Review database schema remains v4');\nassert.equal(NOTIFICATION_SCHEMA_VERSION, 1, 'Notification extension schema must remain v1 for 4.1.0');","assert.equal(SCHEMA_VERSION, 5, 'Review + notification durable database schema must be v5');")
          rep('scripts/verify-family-v4.js',"const notificationStore = fs.readFileSync(path.join(root, 'src', 'notification-store.js'), 'utf8');\n",'')
          rep('scripts/verify-family-v4.js',"assert.match(notificationStore, /notification_outbox/);\nassert.match(notificationStore, /BEGIN IMMEDIATE|withTransaction/);\nassert.match(notificationStore, /saveRunWithOutbox/);","const dbSource = fs.readFileSync(path.join(root, 'src', 'db.js'), 'utf8');\nassert.match(dbSource, /notification_outbox/);\nassert.match(dbSource, /saveRunWithOutbox/);\nassert.match(dbSource, /notificationActions/);\nassert.equal(fs.existsSync(path.join(root, 'src', 'notification-store.js')), false, 'notification-store compatibility/monkey-patch layer is forbidden');")

          # Replace extension-store tests with canonical schema tests.
          Path('src/notification-store.js').unlink()
          if Path('test/notification-store.test.js').exists(): Path('test/notification-store.test.js').unlink()
          dbtest=read('test/db.test.js')
          add=r'''\n          test('schema 5 persists notification actions atomically with review publication',()=>{const{store}=makeStore();try{assert.equal(store.schemaVersion(),5);const job=store.enqueue({projectId:1,mrIid:2,headSha:'a',trigger:'open',dedupeKey:'n1'});const review={verdict:'pass',summary:'ok',coverageComplete:true,findings:[],usage:{}};const policy={source:'service-default',fingerprint:'x'};const runId=store.saveRunWithOutbox(job,review,1,policy,[{projectId:1,mrIid:2,type:'summary',dedupeKey:'p1',payload:{body:'ok'}}],null,[{routeName:'team',provider:'feishu',secretRef:'team',eventType:'review.completed',dedupeKey:'n1:team',payload:{type:'review.completed',projectId:1,mrIid:2}}]);assert.ok(runId>0);assert.equal(store.publicationDepth(),1);assert.equal(store.notificationDepth(),1);const n=store.claimNotification();assert.equal(n.route_name,'team');assert.equal(n.payload.projectId,1);}finally{store.close();}});\n'''
          if "schema 5 persists notification actions atomically" not in dbtest:
              write('test/db.test.js',dbtest+add)
          PY
      - name: Validate terminal architecture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm pack --dry-run --ignore-scripts
      - name: Commit terminal architecture
        run: |
          rm -f .github/workflows/notification-terminal-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make notification outbox a canonical schema v5 domain [notification-terminal]"
          git push origin HEAD:feature/im-notifications-4.1.0

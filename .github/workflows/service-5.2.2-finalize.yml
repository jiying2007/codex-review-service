name: Finalize Service 5.2.2 once

on:
  push:
    branches: [fix/migration-backup-verification-5.2.2]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'chore: prepare Service 5.2.2 migration safety release' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/migration-backup-verification-5.2.2
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Synchronize 5.2.2 product identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const name of ['package.json','package-lock.json']){
            const x=JSON.parse(fs.readFileSync(name,'utf8'));
            x.version='5.2.2';
            if(x.packages?.[''])x.packages[''].version='5.2.2';
            fs.writeFileSync(name,JSON.stringify(x,null,2)+'\n');
          }
          const contract=JSON.parse(fs.readFileSync('product-contract.json','utf8'));
          contract.serviceVersion='5.2.2';
          fs.writeFileSync('product-contract.json',JSON.stringify(contract,null,2)+'\n');
          NODE
          python3 <<'PY'
          from pathlib import Path
          for name in ['deploy/docker/compose.yaml','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md']:
              p=Path(name)
              if p.exists(): p.write_text(p.read_text().replace('5.2.1','5.2.2'))
          p=Path('CHANGELOG.md'); s=p.read_text()
          if '\n## 5.2.2 - 2026-08-27\n' not in s:
              entry='''\n## 5.2.2 - 2026-08-27\n\n### Migration safety patch\n\n- Verify every Schema 5 migration backup independently with a read-only SQLite handle, `integrity_check`, and source `user_version` before Schema 6 DDL begins.\n- Close backup verification handles deterministically so Windows does not retain a file lock after validation; add a cross-platform regression test for cleanup and schema-mismatch failure.\n'''
              s=s.replace('# Changelog\n','# Changelog\n'+entry,1)
              p.write_text(s)
          PY
          node scripts/generate-contract-docs.js
          git add package.json package-lock.json product-contract.json CHANGELOG.md README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md deploy/docker/compose.yaml
      - name: Run full Service CI
        run: npm run ci
      - name: Push validated product state
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .github/workflows/service-5.2.2-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: prepare Service 5.2.2 migration safety release'
          git push origin HEAD:fix/migration-backup-verification-5.2.2

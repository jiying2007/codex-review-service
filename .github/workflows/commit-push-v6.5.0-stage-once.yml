name: Stage v6.5.0 commit push

on:
  push:
    branches:
      - feat-commit-push-v6.5.0

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat-commit-push-v6.5.0
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22.22.2
          cache: npm
      - name: Normalize patch harness literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/commit-push-v6.5.0-patch.js')
          s=p.read_text()
          old='^${}'
          new='^\\${}'
          if old not in s:
              raise SystemExit('expected literal not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply deterministic v6.5.0 patch
        run: node scripts/commit-push-v6.5.0-patch.js
      - name: Normalize generated candidate text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/flow-tracking.js','src/notification.js']:
              p=Path(name)
              s=p.read_text()
              while '\\`' in s:
                  s=s.replace('\\`','`')
              while '\\${' in s:
                  s=s.replace('\\${','${')
              p.write_text(s)
          bad_lines={
            "test('commit push cards aggregate bounded commit details safely'",
            "test('authenticated ordinary Push Hook",
          }
          for name in ['test/notification.test.js','test/flow-http.test.js']:
              p=Path(name)
              lines=p.read_text().splitlines()
              lines=[line for line in lines if line.strip() not in bad_lines]
              p.write_text('\n'.join(lines)+'\n')
          p=Path('CHANGELOG.md')
          s=p.read_text()
          if '## 6.5.0' not in s:
              entry="""## 6.5.0

- Add opt-in ordinary GitLab Push/Commit tracking with ref/exclusion/user filters, bounded aggregate commit details, deterministic routing, durable dedupe, and zero Codex token usage.
- Keep Branch create/delete tracking separate so Push Hook lifecycle events are never double-notified.
- Preserve Database Schema 7, Config Schema 4, Core v4.9.6, and GitLab 14.6.1/15.7/19.1 compatibility boundaries.

"""
              p.write_text(entry+s)
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused commit push tests
        run: node --test test/flow-tracking.test.js test/flow-http.test.js test/config.test.js test/notification.test.js test/flow-db.test.js
      - name: Form local candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/flow-tracking.js src/config.js src/notification.js \
            test/flow-tracking.test.js test/flow-http.test.js test/config.test.js test/notification.test.js \
            config.example.json deploy/systemd/config.example.json deploy/docker/config.example.json \
            package.json package-lock.json product-contract.json CHANGELOG.md LONG_TERM_ASSET.md \
            README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md \
            docs/FLOW_TRACKING.md docs/FLOW_TRACKING.zh-CN.md docs/NOTIFICATIONS.md docs/NOTIFICATIONS.zh-CN.md \
            docs/GITLAB_SETUP.md docs/GITLAB_SETUP.zh-CN.md docs/DEPLOYMENT.md docs/DEPLOYMENT.zh-CN.md
          git commit -m 'feat(service): add configurable ordinary push tracking in v6.5.0'
      - run: npm run check
      - run: git diff --check HEAD^ HEAD
      - name: Push validated candidate
        run: git push origin HEAD:feat-commit-push-v6.5.0

name: Finalize Core v4.2.1 adoption
on:
  push:
    branches: [family-governance-v4.2.0]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Finalize exact pin, product contract and governance scripts
        env:
          CORE_SHA: 1755262f51d5e15d74e432add38863d2383bb495
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C src/codex-safe-core fetch origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          node <<'NODE'
          const fs=require('fs'); const sha=process.env.CORE_SHA;
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts.governance='node src/codex-safe-core/scripts/verify-actions-pins.js .github/workflows && node src/codex-safe-core/scripts/verify-non-goals.js .';
          p.scripts.diagnostics='node src/codex-safe-core/scripts/family-diagnostics.js';
          p.scripts['test:fault']='node --test test/fault-injection.test.js';
          if(!p.scripts.check.includes('npm run governance')) p.scripts.check=`${p.scripts.check} && npm run governance`;
          if(!p.scripts.ci.includes('npm run test:fault')) p.scripts.ci=`${p.scripts.ci} && npm run test:fault`;
          const extra=['src/codex-safe-core/core-contract.json','src/codex-safe-core/family-non-goals.json','src/codex-safe-core/family-error-taxonomy.json','src/codex-safe-core/scripts/family-diagnostics.js','src/codex-safe-core/scripts/verify-release-artifact.js'];
          for(const f of extra) if(!p.files.includes(f)) p.files.push(f);
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const pc='product-contract.json',c=JSON.parse(fs.readFileSync(pc,'utf8'));c.safeCoreCommit=sha;fs.writeFileSync(pc,JSON.stringify(c,null,2)+'\n');
          const ex='.codex-safe.example.json',v=JSON.parse(fs.readFileSync(ex,'utf8'));v.$schema=v.$schema.replace(/[0-9a-f]{40}(?=\/codex-safe\.schema\.json)/i,sha);fs.writeFileSync(ex,JSON.stringify(v,null,2)+'\n');
          NODE
          git add package.json product-contract.json .codex-safe.example.json src/codex-safe-core
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize Codex Safe Core v4.2.1 adoption'
          git push origin HEAD:family-governance-v4.2.0

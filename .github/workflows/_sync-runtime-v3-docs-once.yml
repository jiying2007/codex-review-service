name: Sync Review Service 7.4 Generated Docs Once
on:
  push:
    branches: [feat/runtime-auto-7.4.0]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Generate and commit canonical product docs
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:generate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(contract): generate Review Service 7.4.0 identity'
            git push origin HEAD:feat/runtime-auto-7.4.0
          fi

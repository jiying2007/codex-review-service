name: Retry v6.4.0 flow tracking staging once
on:
  push:
permissions:
  contents: write
jobs:
  retry:
    if: github.ref == 'refs/heads/feat-flow-tracking-v6.4.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24.19.0
      - name: Reuse deterministic staging script with v4/v7 test updates
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./product-contract.json').serviceVersion==='6.4.0'?0:1)"; then
            echo 'v6.4.0 staging already committed; nothing to do.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/flow-tracking-v6.4.0-once.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if line.strip()=='run: |')
          body=[]
          for line in source[start+1:]:
              if line.startswith('          '): body.append(line[10:])
              elif not line.strip(): body.append('')
              else: break
          script='\n'.join(body)+'\n'
          marker='# Focused tests before committing; full CI runs on the formal PR.'
          if marker not in script: raise SystemExit('staging marker missing')
          patch=r'''python3 - <<'PYTESTS'
          from pathlib import Path
          def replace(path,old,new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing test replacement in {path}: {old[:100]}')
              p.write_text(s.replace(old,new))
          p='test/config.test.js'
          replace(p,'config schema is explicit and hard-cut at v3','config schema is explicit and hard-cut at v4')
          replace(p,'future=tempConfig({schemaVersion:4,...baseConfig()}),old=tempConfig({schemaVersion:2,...baseConfig()})','future=tempConfig({schemaVersion:5,...baseConfig()}),old=tempConfig({schemaVersion:3,...baseConfig()})')
          replace(p,'assert.equal(CONFIG_SCHEMA_VERSION,3)','assert.equal(CONFIG_SCHEMA_VERSION,4)')
          replace(p,'/Unsupported config schema 4/','/Unsupported config schema 5/')
          replace(p,'/Unsupported config schema 2/','/Unsupported config schema 3/')
          replace(p,'Config Schema 3 rejects retired sarifFiles','Config Schema 4 rejects retired sarifFiles')
          with Path(p).open('a') as f:
              f.write("\ntest('Flow Tracking defaults off and validates deterministic filters',()=>{const{parseFlowTracking}=require('../src/config'),defaults=parseFlowTracking({});assert.equal(defaults.flowTrackingEnabled,false);assert.deepEqual(defaults.flowPipeline.statuses,['failed']);assert.deepEqual(defaults.flowPipeline.refs,['*']);assert.deepEqual(defaults.flowMergeRequest.actions,['merge']);assert.equal(defaults.flowPush.enabled,false);assert.deepEqual(defaults.flowTag.patterns,['v*']);assert.throws(()=>parseFlowTracking({pipeline:{statuses:['running']}}),/unsupported value/);assert.throws(()=>parseFlowTracking({unexpected:true}),/unsupported field/);});\n")
          p='test/db-migrations.test.js'
          replace(p,'Schema 5 migrates transactionally to 6 with verified backup and preserved data','Schema 5 migrates transactionally through 7 with verified backups and preserved data')
          replace(p,"assert.equal(Number(db.prepare('PRAGMA user_version').get().user_version), 6);","assert.equal(Number(db.prepare('PRAGMA user_version').get().user_version), CURRENT_SCHEMA_VERSION);")
          replace(p,"assert.equal(db.prepare(\"SELECT COUNT(*) count FROM sqlite_master WHERE type='table' AND name='finding_resolutions'\").get().count, 1);\n    assert.equal(db.prepare('SELECT version FROM schema_migrations WHERE version=6').get().version, 6);","assert.equal(db.prepare(\"SELECT COUNT(*) count FROM sqlite_master WHERE type='table' AND name='finding_resolutions'\").get().count, 1);\n    assert.equal(db.prepare(\"SELECT COUNT(*) count FROM sqlite_master WHERE type='table' AND name='flow_state'\").get().count, 1);\n    assert.deepEqual(result.applied.map(step => [step.from, step.to]), [[5,6],[6,7]]);\n    assert.equal(db.prepare('SELECT version FROM schema_migrations WHERE version=6').get().version, 6);\n    assert.equal(db.prepare('SELECT version FROM schema_migrations WHERE version=7').get().version, 7);\n    assert.ok(fs.existsSync(result.applied[1].backupPath));\n    assert.equal(verifyMigrationBackup(result.applied[1].backupPath, 6), true);")
          p='test/db.test.js'
          replace(p,"test('schema 6 initializes fresh and rejects unsupported pre-migration databases'","test('schema 7 initializes fresh and rejects unsupported pre-migration databases'")
          replace(p,"assert.equal(store.db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='notification_outbox'\").get().name,'notification_outbox');","assert.equal(store.db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='notification_outbox'\").get().name,'notification_outbox');assert.equal(store.db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='flow_state'\").get().name,'flow_state');")
          replace(p,"/expected fresh database, Schema 5 migration source, or Schema 6/","/expected fresh database, Schema 5\\/6 migration source, or Schema 7/")
          replace(p,"test('schema 6 persists notification actions atomically with review publication'","test('schema 7 persists notification actions atomically with review publication'")
          PYTESTS
          '''
          script=script.replace(marker,patch+'\n'+marker,1)
          old="git add product-contract.json package.json package-lock.json config.example.json deploy/docker/config.example.json deploy/systemd/config.example.json deploy/docker/compose.yaml deploy/docker/README.md docs README.md README.zh-CN.md CHANGELOG.md VERIFY_RELEASE.md src/config.js src/db-migrations.js src/db.js src/http.js src/index.js src/notification.js"
          new=old+" test/config.test.js test/db-migrations.test.js test/db.test.js"
          if old not in script: raise SystemExit('git add marker missing')
          script=script.replace(old,new,1)
          Path('/tmp/stage-v640.sh').write_text(script)
          PY
          bash /tmp/stage-v640.sh

name: Provider V2 Ops Fix Once

on:
  push:
    branches: [family/provider-contract-v2]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/provider-contract-v2
          fetch-depth: 0
      - name: Align deployment and operations baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const oldSha='8375907712db37492aff1ac0d0013e2753b1f6ab';
          const newSha='7878dae982088746c06e4fe747b2468e6af274a2';
          function replace(t,a,b,file){if(!t.includes(a))throw new Error(`${file}: missing anchor: ${a}`);return t.replace(a,b);}

          let compose=fs.readFileSync('deploy/docker/compose.yaml','utf8');
          compose=replace(compose,'ghcr.io/jiying2007/codex-review-service:7.2.1','ghcr.io/jiying2007/codex-review-service:7.3.0','deploy/docker/compose.yaml');
          fs.writeFileSync('deploy/docker/compose.yaml',compose);

          let en=fs.readFileSync('docs/DEPLOYMENT.md','utf8');
          en=replace(en,'**Codex Review Service 7.2.1** supports native/systemd Node.js **22 LTS >=22.22.2** or **24 LTS >=24.19.0**, GitLab Self-Managed **>=14.6.1**, Database Schema 8 and **Config Schema 6**.','**Codex Review Service 7.3.0** supports native/systemd Node.js **22 LTS >=22.22.2** or **24 LTS >=24.19.0**, GitLab Self-Managed **>=14.6.1**, Database Schema 8 and **Config Schema 7**.','docs/DEPLOYMENT.md');
          en=en.split(oldSha).join(newSha);
          en=replace(en,'## Config Schema 6 breaking boundary\n\nService 7.2.0 hard-cuts the configuration to Config Schema 6. Config Schema 5 is not translated at runtime. Before rollout, set `schemaVersion: 6`; configure `notifications.identities` and a `feishu_app` Route `responsibility` only when strict GitLab-to-Feishu user mappings are available. The prior `review.incrementalReviewEnabled` retirement remains unchanged.','## Config Schema 7 Provider Contract boundary\n\nService 7.3.0 hard-cuts Config Schema 6 -> 7 for Core Provider Contract v2. Runtime does not translate Config Schema 6. Before rollout, set `schemaVersion: 7`; `codex.credentialSource` is `auto|env|auth-json` and `codex.allowInsecureHttp` defaults to `false`. Non-loopback HTTP is accepted only when explicitly enabled for a trusted relay. The Service 7.2.0 Config Schema 5 -> 6 responsibility-notification boundary and the prior `review.incrementalReviewEnabled` retirement remain historical upgrade boundaries.','docs/DEPLOYMENT.md');
          en=replace(en,'  "schemaVersion": 6,','  "schemaVersion": 7,','docs/DEPLOYMENT.md');
          en=replace(en,'    "triggerAssignment": {"mode":"reviewer","userIds":[]}\n  }\n}','    "triggerAssignment": {"mode":"reviewer","userIds":[]}\n  },\n  "codex": {\n    "providerMode": "openai-compatible",\n    "providerBaseUrl": "http://192.168.2.109:3000/v1",\n    "apiKeyEnv": "CODEX_PROVIDER_API_KEY",\n    "credentialSource": "auth-json",\n    "allowInsecureHttp": true\n  }\n}','docs/DEPLOYMENT.md');
          en=replace(en,'Secrets do not belong in Config Schema 6 JSON.','Secrets do not belong in Config Schema 7 JSON. With `credentialSource: "auth-json"`, the provider key may instead remain in the configured Codex home `auth.json`; the key value still never belongs in service JSON.','docs/DEPLOYMENT.md');
          en=replace(en,'From v5.0.0 onward, released DB/Config compatibility is an explicit product contract. Service 7.2.0 introduces a **Config Schema 5 -> 6** hard cut for strict responsibility identity mappings; runtime does not translate the old configuration. Service 7.0.0 introduced the historical **Config Schema 4 -> 5** hard cut and retired `review.incrementalReviewEnabled` because persisted model Judgment reuse no longer exists.','From v5.0.0 onward, released DB/Config compatibility is an explicit product contract. Service 7.3.0 introduces the current **Config Schema 6 -> 7** hard cut for Provider Contract v2 credentials/transport controls. Service 7.2.0 introduced the historical **Config Schema 5 -> 6** hard cut for strict responsibility identity mappings, and Service 7.0.0 introduced the historical **Config Schema 4 -> 5** hard cut and retired `review.incrementalReviewEnabled`. Runtime translates none of these configuration versions.','docs/DEPLOYMENT.md');
          en=replace(en,'4. Rewrite Config Schema 6.','4. Rewrite Config Schema 7 and explicitly review `codex.credentialSource` / `codex.allowInsecureHttp`.','docs/DEPLOYMENT.md');
          fs.writeFileSync('docs/DEPLOYMENT.md',en);

          let zh=fs.readFileSync('docs/DEPLOYMENT.zh-CN.md','utf8');
          zh=replace(zh,'**Codex Review Service 7.2.1** 支持 Native/systemd Node.js **22 LTS >=22.22.2** 或 **24 LTS >=24.19.0**，GitLab Self-Managed **>=14.6.1**，Database Schema 8、**Config Schema 6**。','**Codex Review Service 7.3.0** 支持 Native/systemd Node.js **22 LTS >=22.22.2** 或 **24 LTS >=24.19.0**，GitLab Self-Managed **>=14.6.1**，Database Schema 8、**Config Schema 7**。','docs/DEPLOYMENT.zh-CN.md');
          zh=zh.split(oldSha).join(newSha);
          zh=replace(zh,'## Config Schema 6 硬切边界\n\nService 7.2.0 将配置硬切到 Config Schema 6。Runtime 不翻译 Config Schema 5；升级前必须设置 `schemaVersion: 6`。只有存在严格 GitLab→飞书用户映射时，才配置 `notifications.identities` 和 `feishu_app` Route `responsibility`；已退役的 `review.incrementalReviewEnabled` 保持不支持。','## Config Schema 7 Provider Contract 硬切边界\n\nService 7.3.0 将 Config Schema 6 -> 7 硬切到 Core Provider Contract v2。Runtime 不翻译 Config Schema 6；升级前必须设置 `schemaVersion: 7`。`codex.credentialSource` 支持 `auto|env|auth-json`，`codex.allowInsecureHttp` 默认 `false`；非 loopback HTTP 只有显式授权可信中转站时才允许。Service 7.2.0 的 Config Schema 5 -> 6 责任人通知边界，以及已退役的 `review.incrementalReviewEnabled`，继续作为历史升级边界保留。','docs/DEPLOYMENT.zh-CN.md');
          zh=replace(zh,'  "schemaVersion": 6,','  "schemaVersion": 7,','docs/DEPLOYMENT.zh-CN.md');
          zh=replace(zh,'    "triggerAssignment": {"mode":"reviewer","userIds":[]}\n  }\n}','    "triggerAssignment": {"mode":"reviewer","userIds":[]}\n  },\n  "codex": {\n    "providerMode": "openai-compatible",\n    "providerBaseUrl": "http://192.168.2.109:3000/v1",\n    "apiKeyEnv": "CODEX_PROVIDER_API_KEY",\n    "credentialSource": "auth-json",\n    "allowInsecureHttp": true\n  }\n}','docs/DEPLOYMENT.zh-CN.md');
          zh=replace(zh,'直接值和 `_FILE` 互斥，Secret 不进入 Config Schema 5 JSON。','直接值和 `_FILE` 互斥，Secret 不进入 Config Schema 7 JSON。使用 `credentialSource: "auth-json"` 时，Provider Key 也可以只保留在配置的 Codex Home `auth.json` 中，Key 值仍不得进入 Service JSON。','docs/DEPLOYMENT.zh-CN.md');
          zh=replace(zh,'从 v5.0.0 起，已发布 DB/Config Compatibility 是正式产品契约。Service 7.2.0 引入 **Config Schema 5 -> 6** 硬切，用于严格责任人身份映射；Runtime 不翻译旧配置。Service 7.0.0 引入的 **Config Schema 4 -> 5** 硬切与 `review.incrementalReviewEnabled` 退役继续作为历史升级边界保留。','从 v5.0.0 起，已发布 DB/Config Compatibility 是正式产品契约。Service 7.3.0 引入当前 **Config Schema 6 -> 7** 硬切，用于 Provider Contract v2 凭据/传输控制；Service 7.2.0 的 **Config Schema 5 -> 6** 责任人身份映射，以及 Service 7.0.0 的 **Config Schema 4 -> 5** 与 `review.incrementalReviewEnabled` 退役继续作为历史边界。Runtime 不翻译这些配置版本。','docs/DEPLOYMENT.zh-CN.md');
          zh=replace(zh,'4. 重写 Config Schema 6。','4. 重写 Config Schema 7，并显式复核 `codex.credentialSource` / `codex.allowInsecureHttp`。','docs/DEPLOYMENT.zh-CN.md');
          fs.writeFileSync('docs/DEPLOYMENT.zh-CN.md',zh);

          let ops=fs.readFileSync('OPERATIONS.md','utf8');
          ops=replace(ops,'Codex Review Service **7.2.1** is the current production-operations baseline.','Codex Review Service **7.3.0** is the current production-operations baseline.','OPERATIONS.md');
          ops=replace(ops,'- Config Schema 6','- Config Schema 7','OPERATIONS.md');
          ops=ops.split(oldSha).join(newSha);
          ops=replace(ops,'/etc/codex-review/config.json        Config Schema 6, non-secret','/etc/codex-review/config.json        Config Schema 7, non-secret','OPERATIONS.md');
          ops=replace(ops,'Config Schema 6 is the responsibility-notification hard boundary. It retains the prior removal of `review.incrementalReviewEnabled`, adds strict GitLab-to-Feishu identity mappings and optional responsible-owner direct delivery, and continues to fail closed on unknown fields or unsupported versions.','Config Schema 7 is the Provider Contract v2 hard boundary. It adds `codex.credentialSource=auto|env|auth-json` and explicit `codex.allowInsecureHttp`, while preserving the Config Schema 6 responsibility-notification contract and the prior removal of `review.incrementalReviewEnabled`. Unknown fields and unsupported versions still fail closed.','OPERATIONS.md');
          ops=replace(ops,'2. Create Config Schema 6.','2. Create Config Schema 7 and review the Provider Contract v2 credential/transport fields.','OPERATIONS.md');
          ops=replace(ops,'From v5.0.0 onward, released DB/Config compatibility is a product contract. Service 7.2.1 uses Config Schema 6 and Database Schema 8; responsibility delivery is configuration-only and does not alter the Schema 8 database. Service 7.0.0 introduced the historical Config Schema 4 -> 5 hard cut. Before upgrade:','From v5.0.0 onward, released DB/Config compatibility is a product contract. Service 7.3.0 uses Config Schema 7 and Database Schema 8; Config Schema 7 adds Provider Contract v2 controls only and does not alter Schema 8. Service 7.2.x used Config Schema 6 for responsibility delivery, and Service 7.0.0 introduced the historical Config Schema 4 -> 5 hard cut. Before upgrade:','OPERATIONS.md');
          ops=replace(ops,'3. rewrite Config Schema 6, retain the removal of `incrementalReviewEnabled`, and add only verified identity mappings;','3. rewrite Config Schema 7, retain the removal of `incrementalReviewEnabled`, preserve verified identity mappings, and explicitly choose Provider credential/HTTP policy;','OPERATIONS.md');
          fs.writeFileSync('OPERATIONS.md',ops);
          NODE
          rm .github/workflows/provider-v2-ops-fix-once.yml
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs(service): align 7.3 deployment baseline"
          git push origin HEAD:family/provider-contract-v2

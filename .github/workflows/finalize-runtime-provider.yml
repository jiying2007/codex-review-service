name: Finalize provider runtime
on:
  push:
    branches: [runtime-provider-v6.1.0]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Finalize and validate
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ada3733a0d938b763fd241628da86990af7cfad7
          OLD_CORE_SHA: 0caabb91ad7f2bcedb9f3e5ac50ba4c68a315d46
        run: |
          set -euo pipefail
          git init .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_REF_NAME}" --depth=1
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          git submodule update --init --recursive
          git -C src/codex-safe-core fetch origin "${CORE_SHA}" --depth=1
          git -C src/codex-safe-core checkout --detach "${CORE_SHA}"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          core=os.environ['CORE_SHA']; old_core=os.environ['OLD_CORE_SHA']
          p=Path('src/config.js'); s=p.read_text()
          s=s.replace("codex:new Set(['path','model','fastModel','home','versionPolicy','allowedVersionPattern'])","codex:new Set(['path','model','fastModel','home','versionPolicy','allowedVersionPattern','providerMode','providerBaseUrl','apiKeyEnv','connectTimeoutSeconds','requestTimeoutSeconds','streamIdleTimeoutSeconds'])",1)
          helper="""function normalizeProviderBaseUrl(value,label){let url;try{url=new URL(value);}catch{throw configError(`${label} must be a valid URL`);}if(url.protocol!=='https:'||url.username||url.password||url.search||url.hash)throw configError(`${label} must be an https URL without credentials, query, or fragment`);return url.toString().replace(/\\/$/,'');}\n"""
          anchor='function repositoryPaths(value,label)'
          if 'function normalizeProviderBaseUrl' not in s: s=s.replace(anchor,helper+anchor,1)
          old="codexAllowedVersionPattern:stringValue(c.allowedVersionPattern,'','codex.allowedVersionPattern',256),reviewTimeoutSeconds:"
          new="codexAllowedVersionPattern:stringValue(c.allowedVersionPattern,'','codex.allowedVersionPattern',256),codexProviderMode:enumValue(c.providerMode,'openai','codex.providerMode',['openai','openai-compatible']),codexProviderBaseUrl:c.providerMode==='openai-compatible'?normalizeProviderBaseUrl(stringValue(c.providerBaseUrl,'','codex.providerBaseUrl',2048),'codex.providerBaseUrl'):stringValue(c.providerBaseUrl,'','codex.providerBaseUrl',2048),codexProviderApiKeyEnv:stringValue(c.apiKeyEnv,c.providerMode==='openai-compatible'?'CODEX_PROVIDER_API_KEY':'OPENAI_API_KEY','codex.apiKeyEnv',128),codexConnectTimeoutSeconds:intValue(c.connectTimeoutSeconds,15,'codex.connectTimeoutSeconds',1,120),codexRequestTimeoutSeconds:intValue(c.requestTimeoutSeconds,180,'codex.requestTimeoutSeconds',10,900),codexStreamIdleTimeoutSeconds:intValue(c.streamIdleTimeoutSeconds,60,'codex.streamIdleTimeoutSeconds',5,600),reviewTimeoutSeconds:"
          if old not in s: raise SystemExit('config codex return anchor missing')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('src/secrets.js'); s=p.read_text(); s=s.replace("'OPENAI_API_KEY'","'OPENAI_API_KEY','CODEX_PROVIDER_API_KEY'",1); p.write_text(s)
          p=Path('src/codex.js'); s=p.read_text()
          old="""  if (config?.codexHome) env.CODEX_HOME = config.codexHome;\n  if (process.env.OPENAI_API_KEY) env.OPENAI_API_KEY = process.env.OPENAI_API_KEY;\n  return env;\n}"""
          new="""  if (config?.codexHome) env.CODEX_HOME = config.codexHome;\n  const credentialName=String(config?.codexProviderApiKeyEnv||'').trim();\n  if(credentialName&&process.env[credentialName])env[credentialName]=process.env[credentialName];\n  return env;\n}\n\nfunction runtimeFromConfig(config){const mode=config.codexProviderMode||'openai';const provider=mode==='openai-compatible'?{mode,baseUrl:config.codexProviderBaseUrl||'',apiKeyEnv:config.codexProviderApiKeyEnv||'CODEX_PROVIDER_API_KEY'}:{mode:'openai'};return Object.freeze({provider:Object.freeze(provider),timeouts:Object.freeze({connectMs:(config.codexConnectTimeoutSeconds||15)*1000,requestMs:(config.codexRequestTimeoutSeconds||180)*1000,operationMs:(config.reviewTimeoutSeconds||180)*1000,idleMs:(config.codexStreamIdleTimeoutSeconds||60)*1000})});}"""
          if old not in s: raise SystemExit('filteredEnv anchor missing')
          s=s.replace(old,new,1)
          marker='async function runCodexLocal(prompt, config, signal, maxFindings=config.maxFindings) {'
          probe="""async function probeCodexRuntimeLocal(config,force=false){if(force)capabilityCache.clear();const cli=createLocalCli(config),result=await cli.probeCodexRuntime({codexPath:config.codexPath,model:config.codexModel||'',runtime:runtimeFromConfig(config)});return Object.freeze({...result,versionMatched:checkVersionPolicy(result.codexVersion||'unknown',config),mode:'local'});}\n\n"""
          if 'async function probeCodexRuntimeLocal' not in s: s=s.replace(marker,probe+marker,1)
          s=s.replace("const result=await cli.runStructuredCodex({codexPath:config.codexPath,model:config.codexModel||'',timeoutMs:config.reviewTimeoutSeconds*1000,schema:","const result=await cli.runStructuredCodex({codexPath:config.codexPath,model:config.codexModel||'',runtime:runtimeFromConfig(config),schema:",1)
          insert="""async function probeCodexRuntime(config,force=false){const socket=runnerSocket(config);if(!socket)return probeCodexRuntimeLocal(config,force);const value=await unixRequest(socket,'POST','/probe',{},(config.codexRequestTimeoutSeconds+15)*1000);return{...value,mode:'runner'};}\n"""
          anchor='async function runCodex(prompt,config,signal,maxFindings=config.maxFindings)'
          if 'async function probeCodexRuntime(config' not in s: s=s.replace(anchor,insert+anchor,1)
          s=s.replace("module.exports={runCodex,runCodexLocal,filteredEnv,parseJsonl,parseJsonlEvents,buildCodexArgs,probeCodexCapabilities,probeCodexCapabilitiesLocal,","module.exports={runCodex,runCodexLocal,filteredEnv,runtimeFromConfig,parseJsonl,parseJsonlEvents,buildCodexArgs,probeCodexRuntime,probeCodexRuntimeLocal,probeCodexCapabilities,probeCodexCapabilitiesLocal,",1)
          p.write_text(s)

          p=Path('src/runner-server.js'); s=p.read_text(); s=s.replace("const{runCodexLocal,probeCodexCapabilitiesLocal}=require('./codex');","const{runCodexLocal,probeCodexRuntimeLocal,probeCodexCapabilitiesLocal}=require('./codex');",1)
          old="return{socket,maxBodyBytes:8*1024*1024,codexPath:str(codex.path,'codex','codex.path')||'codex',codexHome:str(codex.home,'','codex.home'),codexModel:str(codex.model,'','codex.model'),codexVersionPolicy:versionPolicy,codexAllowedVersionPattern:str(codex.allowedVersionPattern,'','codex.allowedVersionPattern'),reviewTimeoutSeconds:integer(review.timeoutSeconds,180,'review.timeoutSeconds',30,900)};"
          new="return{socket,maxBodyBytes:8*1024*1024,codexPath:str(codex.path,'codex','codex.path')||'codex',codexHome:str(codex.home,'','codex.home'),codexModel:str(codex.model,'','codex.model'),codexVersionPolicy:versionPolicy,codexAllowedVersionPattern:str(codex.allowedVersionPattern,'','codex.allowedVersionPattern'),codexProviderMode:str(codex.providerMode,'openai','codex.providerMode'),codexProviderBaseUrl:str(codex.providerBaseUrl,'','codex.providerBaseUrl'),codexProviderApiKeyEnv:str(codex.apiKeyEnv,codex.providerMode==='openai-compatible'?'CODEX_PROVIDER_API_KEY':'OPENAI_API_KEY','codex.apiKeyEnv'),codexConnectTimeoutSeconds:integer(codex.connectTimeoutSeconds,15,'codex.connectTimeoutSeconds',1,120),codexRequestTimeoutSeconds:integer(codex.requestTimeoutSeconds,180,'codex.requestTimeoutSeconds',10,900),codexStreamIdleTimeoutSeconds:integer(codex.streamIdleTimeoutSeconds,60,'codex.streamIdleTimeoutSeconds',5,600),reviewTimeoutSeconds:integer(review.timeoutSeconds,180,'review.timeoutSeconds',30,900)};"
          s=s.replace(old,new,1)
          old="if(req.method==='GET'&&req.url==='/health'){const capability=await probeCodexCapabilitiesLocal(config);return json(res,200,capabilityEnvelope(config,capability));}if(req.method!=='POST'||req.url!=='/review')return json(res,404,{error:'not_found'});"
          new="if(req.method==='GET'&&req.url==='/health'){const capability=await probeCodexCapabilitiesLocal(config);return json(res,200,capabilityEnvelope(config,capability));}if(req.method==='POST'&&req.url==='/probe'){const runtime=await probeCodexRuntimeLocal(config,true);return json(res,200,runtime);}if(req.method!=='POST'||req.url!=='/review')return json(res,404,{error:'not_found'});"
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('src/doctor.js'); s=p.read_text(); s=s.replace("const{probeCodexCapabilities}=require('./codex');","const{probeCodexRuntime}=require('./codex');",1)
          old="const capability=await probeCodexCapabilities(config,true);checks.codex={ok:true,mode:config.runnerMode,version:capability.version,versionMatched:capability.versionMatched,versionPolicy:config.codexVersionPolicy};if(config.codexVersionPolicy==='warn'&&capability.versionMatched===false)checks.codex.warning='Codex version does not match codex.allowedVersionPattern';"
          new="const runtime=await probeCodexRuntime(config,true);checks.codex={ok:true,mode:config.runnerMode,version:runtime.codexVersion||runtime.version||'unknown',versionMatched:runtime.versionMatched!==false,versionPolicy:config.codexVersionPolicy,provider:runtime.provider?.mode||config.codexProviderMode,endpointHost:runtime.provider?.endpointHost||'',liveProbeMs:runtime.durationMs||0};if(config.codexVersionPolicy==='warn'&&runtime.versionMatched===false)checks.codex.warning='Codex version does not match codex.allowedVersionPattern';"
          s=s.replace(old,new,1); p.write_text(s)

          for name in ['config.example.json','deploy/docker/config.example.json','deploy/systemd/config.example.json']:
            p=Path(name)
            if not p.exists(): continue
            data=json.loads(p.read_text()); c=data.setdefault('codex',{}); c.update({'providerMode':'openai','providerBaseUrl':'','apiKeyEnv':'OPENAI_API_KEY','connectTimeoutSeconds':15,'requestTimeoutSeconds':180,'streamIdleTimeoutSeconds':60}); p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          for name in ['.env.example','deploy/docker/.env.example','deploy/systemd/codex-review.env.example']:
            p=Path(name)
            if p.exists():
              x=p.read_text()
              if 'CODEX_PROVIDER_API_KEY_FILE' not in x: p.write_text(x.rstrip()+"\n# OpenAI-compatible relay credential; use this instead of storing the key in JSON.\nCODEX_PROVIDER_API_KEY_FILE=\n")
          for name in ['.codex-safe.example.json','product-contract.json']:
            p=Path(name); x=p.read_text();
            if old_core in x: p.write_text(x.replace(old_core,core))
          # Release/deployment current-state surfaces are part of the product contract.
          for name in ['deploy/docker/compose.yaml','docs/DEPLOYMENT.md','docs/DEPLOYMENT.zh-CN.md','deploy/docker/README.md']:
            p=Path(name)
            if p.exists(): p.write_text(p.read_text().replace('6.0.1','6.1.0'))
          p=Path('CHANGELOG.md'); x=p.read_text(); marker='# Changelog\n'; entry='''\n## 6.1.0 - 2026-08-28\n\n- Consume Core v4.6 Codex Runtime/Provider Contract. Add explicit OpenAI-compatible relay configuration, HTTP/SSE transport, dedicated provider secret bridging, live doctor probes for inline/isolated runners, split request/runtime timeouts and provider-aware diagnostics.\n'''
          if '## 6.1.0 - 2026-08-28' not in x: p.write_text(x.replace(marker,marker+entry,1))
          PY
          npm run release:prepare -- 6.1.0
          npm run docs:generate
          git add -A
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm pack --dry-run --ignore-scripts
          rm .github/workflows/finalize-runtime-provider.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: add shared Codex provider runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"

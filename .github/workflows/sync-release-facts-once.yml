name: Sync v5.1.1 release facts
on:
  push:
    branches: [release-v5.1.1]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Add canonical changelog entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node <<'NODE'
          const fs=require('fs');
          const file='CHANGELOG.md';
          let text=fs.readFileSync(file,'utf8');
          if(text.includes('## 5.1.1 - 2026-08-26')) process.exit(0);
          const entry=`# Changelog\n\n## 5.1.1 - 2026-08-26\n\n### Family governance and durable-state verification\n\n- Pin the Service to formally released Codex Safe Core v4.2.1 and adopt the shared Actions-pin, non-goal, diagnostics, dependency-review and release-guard governance gates.\n- Add cross-platform fault-injection coverage for incompatible SQLite schema handle release plus publication/notification outbox crash-and-reopen recovery.\n- Govern the additional Core contract/diagnostic files in the exact release-package allowlist while retaining the existing rootless Docker and immutable release boundaries.\n- Preserve Database Schema 5, Config Schema 1, Policy Schema 3, Review Receipt 4, Safe Contract 2 and the GitLab 14.6.1 / 17.11.7 / 19.3.0 provider compatibility profiles; this patch changes governance and verification only.\n\n`;
          if(!text.startsWith('# Changelog\n')) throw new Error('unexpected changelog header');
          text=entry+text.slice('# Changelog\n\n'.length);
          fs.writeFileSync(file,text);
          NODE
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add v5.1.1 changelog'
          git push origin HEAD:release-v5.1.1

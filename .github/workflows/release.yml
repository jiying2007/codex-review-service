name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.13.0', cache: npm }
      - id: version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            previous_version=""
            if [[ "$GITHUB_EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$GITHUB_EVENT_BEFORE" =~ ^0+$ ]]; then
              previous_version=$(git show "${GITHUB_EVENT_BEFORE}:package.json" 2>/dev/null | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})" || true)
            fi
            if [[ "$previous_version" == "$version" ]]; then publish=false; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.version.outputs.publish == 'true'
        run: node scripts/release.js check

  test:
    name: Release test / Node ${{ matrix.node }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts

  release:
    name: Package / attest / publish
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22.13.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run core:init
      - name: Build and verify immutable package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tgz=$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")
          test "$tgz" = "codex-review-service-${version}.tgz"
          tar -tzf "$tgz" > /tmp/package-files.txt
          for required in \
            package/package.json \
            package/config.example.json \
            package/src/index.js \
            package/src/codex.js \
            package/src/codex-safe-core/codex-cli.js \
            package/src/codex-safe-core/process-runner.js \
            package/src/codex-safe-core/policy.js \
            package/deploy/systemd/codex-review-service.service; do
            grep -Fx "$required" /tmp/package-files.txt >/dev/null
          done
          if grep -Eq '^package/(test/|scripts/|\.github/|\.gitmodules$|src/codex-safe-core/test/|src/codex-safe-core/\.github/|src/codex-safe-core/(ARCHITECTURE|CONTRIBUTING|package\.json))' /tmp/package-files.txt; then
            echo 'release package contains development-only files' >&2
            exit 1
          fi
          sha256sum "$tgz" > SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            codex-review-service-${{ needs.prepare.outputs.version }}.tgz
            SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-service-${{ needs.prepare.outputs.version }}
          path: |
            codex-review-service-${{ needs.prepare.outputs.version }}.tgz
            SHA256SUMS
          if-no-files-found: error
      - name: Ensure immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tgz="codex-review-service-${version}.tgz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets will not be overwritten." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$tgz" SHA256SUMS --title "Codex Review Service ${version}" --generate-notes --verify-tag

name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.event_name != 'issue_comment' || (((github.event.comment.body == '/release-retry') || startsWith(github.event.comment.body, '/release-retry ')) && github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with: { node-version: '24.19.0', cache: npm }
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          RELEASE_RETRY_REQUEST: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            git fetch --force --tags origin
            request="${RELEASE_RETRY_REQUEST:-}"
            retry_tag=""
            explicit_tag=""
            if [[ "$request" == "/release-retry" ]]; then
              :
            elif [[ "$request" =~ ^/release-retry[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              explicit_tag="${BASH_REMATCH[1]}"
            else
              echo 'Usage: /release-retry [vMAJOR.MINOR.PATCH]' >&2
              exit 1
            fi

            if [[ -n "$explicit_tag" ]]; then
              git rev-parse --verify --quiet "refs/tags/${explicit_tag}" >/dev/null || {
                echo "Requested immutable tag ${explicit_tag} does not exist." >&2
                exit 1
              }
              if gh release view "$explicit_tag" >/dev/null 2>&1; then
                echo "Release ${explicit_tag} already exists; refusing retry." >&2
                exit 1
              fi
              retry_tag="$explicit_tag"
            else
              while IFS= read -r candidate; do
                [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
                if ! gh release view "$candidate" >/dev/null 2>&1; then
                  if [[ -n "$retry_tag" ]]; then
                    echo "Multiple unreleased immutable tags exist; use /release-retry vMAJOR.MINOR.PATCH." >&2
                    exit 1
                  fi
                  retry_tag="$candidate"
                fi
              done < <(git tag --list 'v*' --sort=-version:refname)
              [[ -n "$retry_tag" ]] || { echo 'No unreleased immutable tag exists for /release-retry.' >&2; exit 1; }
            fi

            tag="$retry_tag"
            version="${tag#v}"
            release_sha=$(git rev-list -n 1 "$tag")
            package_version=$(git show "${release_sha}:package.json" | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version||''))")
            contract_version=$(git show "${release_sha}:product-contract.json" | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).serviceVersion||''))")
            test "$package_version" = "$version"
            test "$contract_version" = "$version"
          else
            version=$(node -p "require('./product-contract.json').serviceVersion")
            test "$version" = "$(node -p "require('./package.json').version")"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag="v${version}"
            release_sha="$GITHUB_SHA"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              previous_version=""
              if [[ "$GITHUB_EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$GITHUB_EVENT_BEFORE" =~ ^0+$ ]]; then
                previous_version=$(git show "${GITHUB_EVENT_BEFORE}:package.json" 2>/dev/null | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})" || true)
              fi
              if [[ "$previous_version" == "$version" ]] && git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
                publish=false
              fi
            fi
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical release candidate
        if: steps.version.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.version.outputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.version.outputs.publish == 'true'
        run: node scripts/release.js check

  test:
    name: Release test / Node ${{ matrix.node }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24.19.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm pack --dry-run --ignore-scripts

  release:
    name: Package / OCI / attest / publish
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with: { node-version: '24.19.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and inspect immutable package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.release_sha }}"
          tgz=$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")
          test "$tgz" = "codex-review-service-${version}.tgz"
          tar -tzf "$tgz" > /tmp/package-files.txt
          for required in \
            package/package.json \
            package/product-contract.json \
            package/config.example.json \
            package/src/index.js \
            package/src/admin-cli.js \
            package/src/codex.js \
            package/src/codex-safe-core/codex-cli.js \
            package/src/codex-safe-core/process-runner.js \
            package/src/codex-safe-core/policy.js \
            package/deploy/systemd/codex-review-service.service; do
            grep -Fx "$required" /tmp/package-files.txt >/dev/null
          done
          if grep -Eq '^package/(test/|scripts/|\.github/|\.gitmodules$|src/codex-safe-core/test/|src/codex-safe-core/\.github/|src/codex-safe-core/(ARCHITECTURE|CONTRIBUTING|package\.json))' /tmp/package-files.txt; then
            echo 'release package contains development-only files' >&2
            exit 1
          fi
          npm sbom --sbom-format spdx > SBOM.spdx.json
          test -s SBOM.spdx.json

      - name: Ensure immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - id: image
        name: Build or recover canonical OCI image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          image=$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')
          digest=""
          if docker buildx imagetools inspect "$image" >/tmp/existing-image.txt 2>/dev/null; then
            if [[ "$GITHUB_EVENT_NAME" != "issue_comment" ]]; then
              echo "OCI image ${image} already exists; immutable image will not be overwritten." >&2
              exit 1
            fi
            docker pull "$image" >/dev/null
            test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$RELEASE_SHA"
            test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$VERSION"
            digest=$(awk '/^Digest:/ {print $2; exit}' /tmp/existing-image.txt)
          else
            docker buildx create --name codex-review-release --use >/dev/null 2>&1 || docker buildx use codex-review-release
            docker buildx build \
              --file deploy/docker/Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --build-arg SERVICE_VERSION="$VERSION" \
              --build-arg VCS_REF="$RELEASE_SHA" \
              --tag "$image" \
              --provenance=mode=max \
              --sbom=true \
              --metadata-file /tmp/image-metadata.json \
              --push .
            digest=$(node -e "const m=require('/tmp/image-metadata.json');process.stdout.write(m['containerimage.digest']||'')")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Report High/Critical OCI vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Block unfixed Critical OCI vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Attest canonical OCI image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Finalize release manifests and checksums
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tgz="codex-review-service-${version}.tgz"
          printf '%s@%s\n' "$IMAGE_REF" "$IMAGE_DIGEST" > IMAGE_DIGEST.txt
          awk -v image="${IMAGE_REF}@${IMAGE_DIGEST}" '{if($1=="image:"){$0="    image: " image} print}' deploy/docker/compose.yaml > compose.release.yaml
          grep -F "${IMAGE_REF}@${IMAGE_DIGEST}" compose.release.yaml >/dev/null
          sha256sum "$tgz" SBOM.spdx.json IMAGE_DIGEST.txt compose.release.yaml > SHA256SUMS

      - name: Attest immutable release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            codex-review-service-${{ needs.prepare.outputs.version }}.tgz
            SBOM.spdx.json
            IMAGE_DIGEST.txt
            compose.release.yaml
            SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-service-${{ needs.prepare.outputs.version }}
          path: |
            codex-review-service-${{ needs.prepare.outputs.version }}.tgz
            SBOM.spdx.json
            IMAGE_DIGEST.txt
            compose.release.yaml
            SHA256SUMS
          if-no-files-found: error

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tgz="codex-review-service-${version}.tgz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets will not be overwritten." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$tgz" SBOM.spdx.json IMAGE_DIGEST.txt compose.release.yaml SHA256SUMS --title "Codex Review Service ${version}" --generate-notes --verify-tag

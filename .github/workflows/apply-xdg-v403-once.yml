name: Apply XDG v4.0.3 Once
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.comment.body == '/apply-xdg-v403' && github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: xdg-runtime-defaults-v4.0.3
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/config.js'); s=p.read_text()
          s=s.replace("const fs=require('node:fs');\nconst path=require('node:path');", "const fs=require('node:fs');\nconst os=require('node:os');\nconst path=require('node:path');")
          old="function loadStructuredConfig(filePath=process.env.CODEX_REVIEW_CONFIG_FILE||'/etc/codex-review/config.json'){"
          new="""function resolveXdgHome(name,fallback,env=process.env){const configured=String(env[name]||'').trim();if(configured&&path.isAbsolute(configured))return path.normalize(configured);const home=String(env.HOME||os.homedir()||'').trim();if(!home||!path.isAbsolute(home))throw configError(`Unable to resolve user home for ${name}`);return path.join(home,...fallback);}\nfunction defaultConfigPath(env=process.env){return path.join(resolveXdgHome('XDG_CONFIG_HOME',['.config'],env),'codex-review','config.json');}\nfunction defaultStateDir(env=process.env){return path.join(resolveXdgHome('XDG_STATE_HOME',['.local','state'],env),'codex-review');}\nfunction loadStructuredConfig(filePath=process.env.CODEX_REVIEW_CONFIG_FILE||defaultConfigPath()){\n"""
          if old not in s: raise SystemExit('config path marker missing')
          s=s.replace(old,new)
          old="const dataDir=path.resolve(stringValue(s.dataDir,'/var/lib/codex-review','server.dataDir',2048))"
          if old not in s: raise SystemExit('dataDir marker missing')
          s=s.replace(old,"const dataDir=path.resolve(stringValue(s.dataDir,defaultStateDir(),'server.dataDir',2048))")
          old="module.exports={loadConfig,loadStructuredConfig,validateSigningToken,normalizeBaseUrl,SEVERITIES,parseGroups,positiveIds,configError};"
          if old not in s: raise SystemExit('exports marker missing')
          s=s.replace(old,"module.exports={loadConfig,loadStructuredConfig,validateSigningToken,normalizeBaseUrl,defaultConfigPath,defaultStateDir,resolveXdgHome,SEVERITIES,parseGroups,positiveIds,configError};")
          p.write_text(s)

          p=Path('test/config.test.js'); s=p.read_text()
          s=s.replace("const{validateSigningToken,normalizeBaseUrl,loadStructuredConfig,loadConfig}=require('../src/config');", "const{validateSigningToken,normalizeBaseUrl,loadStructuredConfig,loadConfig,defaultConfigPath,defaultStateDir}=require('../src/config');")
          if "default paths are unprivileged XDG paths" not in s:
              s += "\ntest('default paths are unprivileged XDG paths',()=>{assert.equal(defaultConfigPath({HOME:'/home/alice'}),'/home/alice/.config/codex-review/config.json');assert.equal(defaultStateDir({HOME:'/home/alice'}),'/home/alice/.local/state/codex-review');assert.equal(defaultConfigPath({HOME:'/home/alice',XDG_CONFIG_HOME:'/srv/alice/config'}),'/srv/alice/config/codex-review/config.json');assert.equal(defaultStateDir({HOME:'/home/alice',XDG_STATE_HOME:'/srv/alice/state'}),'/srv/alice/state/codex-review');});\ntest('relative XDG homes are ignored',()=>{assert.equal(defaultConfigPath({HOME:'/home/alice',XDG_CONFIG_HOME:'relative'}),'/home/alice/.config/codex-review/config.json');assert.equal(defaultStateDir({HOME:'/home/alice',XDG_STATE_HOME:'relative'}),'/home/alice/.local/state/codex-review');});\ntest('loadConfig defaults dataDir to XDG state',()=>{const t=tempConfig(baseConfig());try{withEnvs({HOME:'/home/alice',XDG_STATE_HOME:'/tmp/alice-state',CODEX_REVIEW_CONFIG_FILE:t.file,GITLAB_API_TOKEN:'token',GITLAB_WEBHOOK_SIGNING_TOKEN:signingToken()},()=>{const config=loadConfig();assert.equal(config.dataDir,'/tmp/alice-state/codex-review');assert.equal(config.dbPath,'/tmp/alice-state/codex-review/review-service.sqlite');});}finally{t.close();}});\n"
          p.write_text(s)

          for name in ['deploy/systemd/codex-review-service.service','deploy/systemd/codex-review-runner.service']:
              p=Path(name); s=p.read_text()
              line='Environment=CODEX_REVIEW_CONFIG_FILE=/etc/codex-review/config.json\n'
              if line not in s: s=s.replace('EnvironmentFile=',line+'EnvironmentFile=',1)
              p.write_text(s)

          p=Path('.env.example'); s=p.read_text()
          s=s.replace("# Optional config path override. Non-secret settings belong in config.json.\n# CODEX_REVIEW_CONFIG_FILE=/etc/codex-review/config.json", "# Optional config path override. Without it, direct user-mode runtime follows XDG:\n# ${XDG_CONFIG_HOME:-$HOME/.config}/codex-review/config.json\n# System-level systemd units explicitly pin /etc/codex-review/config.json.\n# CODEX_REVIEW_CONFIG_FILE=/custom/path/config.json")
          p.write_text(s)

          p=Path('deploy/systemd/codex-review-runner.env.example'); s=p.read_text()
          s=s.replace("# Non-secret Codex/Runner settings are read from /etc/codex-review/config.json.\n# CODEX_REVIEW_CONFIG_FILE=/etc/codex-review/config.json", "# The systemd unit explicitly reads non-secret Codex/Runner settings from\n# /etc/codex-review/config.json. Do not duplicate that path here.")
          p.write_text(s)

          p=Path('OPERATIONS.md'); s=p.read_text()
          s=s.replace('Both use the same `/etc/codex-review/config.json`.', 'System-level deployments explicitly use the same `/etc/codex-review/config.json`; direct user-mode execution follows XDG defaults.')
          old="""## Configuration ownership\n\n```text\n/etc/codex-review/config.json        non-secret product configuration\n/etc/codex-review-service.env        GitLab/OpenAI secrets only\n/etc/codex-review-runner.env         optional Runner OpenAI secret only\n```"""
          new="""## Configuration ownership\n\nDirect user-mode execution requires no root-owned paths:\n\n```text\n${XDG_CONFIG_HOME:-$HOME/.config}/codex-review/config.json\n${XDG_STATE_HOME:-$HOME/.local/state}/codex-review/\n```\n\n`CODEX_REVIEW_CONFIG_FILE` explicitly overrides the config path. Relative XDG home values are ignored.\n\nSystem-level systemd deployment deliberately pins administrator-owned paths instead of relying on runtime defaults:\n\n```text\n/etc/codex-review/config.json        non-secret product configuration\n/etc/codex-review-service.env        GitLab/OpenAI secrets only\n/etc/codex-review-runner.env         optional Runner OpenAI secret only\n/var/lib/codex-review                state (via config + StateDirectory)\n```"""
          if old not in s: raise SystemExit('operations marker missing')
          p.write_text(s.replace(old,new))

          p=Path('README.md'); s=p.read_text()
          old="All non-secret service configuration comes only from:\n\n```text\n/etc/codex-review/config.json\n```"
          if old in s:
              s=s.replace(old,"All non-secret service configuration comes from one JSON file. Direct user-mode execution defaults to:\n\n```text\n${XDG_CONFIG_HOME:-$HOME/.config}/codex-review/config.json\n```\n\nSystem-level systemd deployment explicitly pins `/etc/codex-review/config.json`.")
          p.write_text(s)

          p=Path('README.zh-CN.md'); s=p.read_text()
          old="所有非 Secret 服务配置只来自：\n\n```text\n/etc/codex-review/config.json\n```"
          if old not in s: raise SystemExit('README.zh marker missing')
          s=s.replace(old,"所有非 Secret 服务配置仍只来自一份 JSON。普通用户直接运行时默认：\n\n```text\n${XDG_CONFIG_HOME:-$HOME/.config}/codex-review/config.json\n```\n\n系统级 systemd 部署显式固定为 `/etc/codex-review/config.json`。")
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          if '## 4.0.3' not in s:
              s=s.replace('# Changelog\n', "# Changelog\n\n## 4.0.3\n\n- Make direct runtime defaults rootless: config follows XDG config home and persistent state follows XDG state home.\n- Keep system-level deployment deterministic by explicitly pinning `/etc/codex-review/config.json` in both systemd units and `/var/lib/codex-review` in the production config example.\n- Add regression coverage for XDG overrides, relative-XDG fallback, and default state resolution.\n\n")
          p.write_text(s)
          PY
          npm version 4.0.3 --no-git-tag-version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm pack --dry-run --ignore-scripts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: make runtime defaults rootless'
          git push origin HEAD:xdg-runtime-defaults-v4.0.3

name: Temporary Service Routed Version Repair

on:
  push:
    branches: ["feat/model-routing-v1-runtime"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/model-routing-v1-runtime
          fetch-depth: 0
      - name: Preserve real Codex version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/service.js'); text=p.read_text()
          old="version=routed.calls.find(x=>!x.shadow)?.model?'routed':version;"
          new="version=routed.calls.find(x=>!x.shadow&&x.version)?.version||version;"
          count=text.count(old)
          if count!=1: raise SystemExit(f'expected one routed version placeholder, got {count}')
          p.write_text(text.replace(old,new,1))
          PY
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add src/service.js
          git commit -m 'fix(service): preserve routed Codex version metadata'
          git push origin HEAD:feat/model-routing-v1-runtime

name: Fix Review Service time v6.3.1 once
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix-review-time-v6.3.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-review-time-v6.3.1
          persist-credentials: true
      - name: Bind MR and notification time to exact Review Receipt
        env:
          OLD_SHA: 2011591e76cf73c0890b702a5bcd3499de91bbbc
          NEW_SHA: bc367cf3fbc57d7060bce343fcf4a6d5312f7ab8
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),old=process.env.OLD_SHA,neu=process.env.NEW_SHA;
          function replace(p,a,b){let s=fs.readFileSync(p,'utf8');if(!s.includes(a))throw new Error(`missing pattern ${p}`);fs.writeFileSync(p,s.replace(a,b));}
          replace('src/review.js',"function formatSummary(review,snapshot,policy){", "function formatSummary(review,snapshot,policy,createdAt=''){const reviewTime=createdAt?new Date(createdAt).toISOString():'';");
          replace('src/review.js',"const lines=['## Codex Review Service','',`**${zh?'结果':'Result'}:** ${status}`,`**${zh?'提交':'Commit'}:**", "const lines=['## Codex Review Service','',`**${zh?'结果':'Result'}:** ${status}`,reviewTime?`**${zh?'审查时间 (UTC)':'Review time (UTC)'}:** ${reviewTime}`:'',`**${zh?'提交':'Commit'}:**");
          replace('src/review.js',"return lines.join('\\n');}","return lines.filter(Boolean).join('\\n');}");
          replace('src/service.js',"planPublication(job,snapshot,review,policy){", "planPublication(job,snapshot,review,policy,createdAt=''){");
          replace('src/service.js',"body:`${formatSummary(review,snapshot,policy)}\\n\\n${lifecycleText}`", "body:`${formatSummary(review,snapshot,policy,createdAt)}\\n\\n${lifecycleText}`");
          replace('src/service.js',"const durationMs=Date.now()-started,actions=this.planPublication(job,snapshot,review,policy),receiptProjection=createServiceReviewReceipt(snapshot,review,policy),notificationEvent=eventForReview({job,mr,snapshot,review,durationMs,topFindings:this.config.notificationTopFindings}),notificationActions=", "const durationMs=Date.now()-started,receiptProjection=createServiceReviewReceipt(snapshot,review,policy),reviewCreatedAt=receiptProjection.receipt.createdAt,actions=this.planPublication(job,snapshot,review,policy,reviewCreatedAt),notificationEvent=eventForReview({job,mr,snapshot,review,durationMs,topFindings:this.config.notificationTopFindings,occurredAt:reviewCreatedAt}),notificationActions=");
          replace('src/notification.js',"function counts(findings=[]){", "function canonicalUtc(value=new Date()){const date=value instanceof Date?value:new Date(value);if(Number.isNaN(date.getTime()))throw notifyError('Notification event time is invalid','ENOTIFYEVENT');return date.toISOString();}\nfunction counts(findings=[]){");
          replace('src/notification.js',"function eventForReview({job,mr,snapshot,review,durationMs,topFindings=3}){", "function eventForReview({job,mr,snapshot,review,durationMs,topFindings=3,occurredAt}){");
          replace('src/notification.js',"return Object.freeze({type,projectId:Number(job.project_id)", "return Object.freeze({type,occurredAt:canonicalUtc(occurredAt),projectId:Number(job.project_id)");
          replace('src/notification.js',"function eventForFailure(job,code){return Object.freeze({type:'review.failed',", "function eventForFailure(job,code){return Object.freeze({type:'review.failed',occurredAt:canonicalUtc(),");
          replace('src/notification.js',"function systemEvent(type,details={}){if(!EVENTS.includes(type)||!type.startsWith('service.'))throw notifyError(`Unsupported system notification event: ${type}`,'ENOTIFYEVENT');return Object.freeze({type,projectId:0", "function systemEvent(type,details={}){if(!EVENTS.includes(type)||!type.startsWith('service.'))throw notifyError(`Unsupported system notification event: ${type}`,'ENOTIFYEVENT');return Object.freeze({type,occurredAt:canonicalUtc(),projectId:0");
          replace('src/notification.js',"function summaryLines(event){const c=event.findingCounts||counts([]),lines=[];if(event.projectId)lines.push(`Project: ${event.projectId}`,`MR: !${event.mrIid}${event.title?` ${event.title}`:''}`);lines.push(`Verdict: ${event.verdict}`);if(event.headSha)", "function summaryLines(event){const c=event.findingCounts||counts([]),lines=[];if(event.projectId)lines.push(`Project: ${event.projectId}`,`MR: !${event.mrIid}${event.title?` ${event.title}`:''}`);if(event.occurredAt)lines.push(`Time (UTC): ${event.occurredAt}`);lines.push(`Verdict: ${event.verdict}`);if(event.errorCode)lines.push(`Error: ${event.errorCode}`);if(event.headSha)");
          replace('src/notification.js',"if(event.durationMs)lines.push(`Duration: ${(event.durationMs/1000).toFixed(1)}s`);if(event.errorCode)lines.push(`Error: ${event.errorCode}`);return lines;}", "if(event.durationMs)lines.push(`Duration: ${(event.durationMs/1000).toFixed(1)}s`);return lines;}");
          replace('test/notification.test.js',"topFindings:3});assert.equal(event.type,'review.blocked');", "topFindings:3,occurredAt:'2026-08-30T13:00:00.000Z'});assert.equal(event.type,'review.blocked');assert.equal(event.occurredAt,'2026-08-30T13:00:00.000Z');");
          replace('test/notification.test.js',"assert.equal(wecom.template_card.card_action.url,event.url);", "assert.equal(wecom.template_card.card_action.url,event.url);assert.match(JSON.stringify(feishu),/2026-08-30T13:00:00.000Z/);assert.match(JSON.stringify(wecom),/2026-08-30T13:00:00.000Z/);");
          replace('test/review.test.js',"consolidateReviews,parseChangedLines,metadataOnlyDiff}=require('../src/review');", "consolidateReviews,parseChangedLines,metadataOnlyDiff,formatSummary}=require('../src/review');");
          fs.appendFileSync('test/review.test.js',"\ntest('summary labels the exact review receipt time as UTC',()=>{const snapshot={headSha:'a'.repeat(40),files:[],coverageGaps:[],advisories:[]},review={verdict:'pass',findings:[],summary:'ok'},text=formatSummary(review,snapshot,{language:'en',source:'test',fingerprint:'f'.repeat(64)},'2026-08-30T13:00:00.000Z');assert.match(text,/Review time \\(UTC\\).*2026-08-30T13:00:00.000Z/);});\n");
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version='6.3.1';fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));pc.serviceVersion='6.3.1';pc.productVersion='6.3.1';pc.safeCoreVersion='4.9.4';pc.safeCoreCommit=neu;fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          let c=fs.readFileSync('CHANGELOG.md','utf8');const e=`## 6.3.1 - 2026-08-30\n\n- Bind GitLab MR summaries and review notifications to the exact Review Receipt v4 creation time.\n- Label all server-side human timestamps explicitly as UTC so delayed outbox delivery cannot be confused with review execution time.\n- Preserve GitLab 14.6.1 Classic, 17.11.7 Modern and 19.3.0 Standard-HMAC compatibility behavior unchanged.\n\n`;if(!c.startsWith('# Changelog\n\n'))throw new Error('unexpected changelog');fs.writeFileSync('CHANGELOG.md','# Changelog\n\n'+e+c.slice('# Changelog\n\n'.length));
          for(const p of ['docs/NOTIFICATIONS.md','docs/NOTIFICATIONS.zh-CN.md']){let s=fs.readFileSync(p,'utf8');if(!s.includes('UTC'))s+='\n\nNotification event timestamps are canonical UTC ISO-8601 values and review notifications use the exact persisted Review Receipt time, not delayed delivery time.\n';fs.writeFileSync(p,s);}
          let ex=fs.readFileSync('.codex-safe.example.json','utf8').replaceAll(old,neu);fs.writeFileSync('.codex-safe.example.json',ex);
          NODE
          git update-index --cacheinfo 160000,$NEW_SHA,src/codex-safe-core
          git submodule update --init src/codex-safe-core
          node scripts/generate-contract-docs.js
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add src/review.js src/service.js src/notification.js test/notification.test.js test/review.test.js package.json product-contract.json CHANGELOG.md docs/NOTIFICATIONS.md docs/NOTIFICATIONS.zh-CN.md .codex-safe.example.json README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          git add -u src/codex-safe-core
          git commit -m 'fix(service): bind review publication time to receipt in v6.3.1'
          git push origin HEAD:fix-review-time-v6.3.1

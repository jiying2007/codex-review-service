name: Cleanup XDG Branches Once
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.number == 23 && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs-xdg-zh-cn' && github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed maintenance branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in docs-xdg-zh-cn xdg-runtime-defaults-v4.0.3; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done

name: Family v3 docs finalizer

on:
  push:
    branches: [feat/family-v3-service]
    paths: [.github/workflows/v3-docs-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Rewrite active docs to Family v3 contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const active=['OPERATIONS.md','SECURITY.md','LONG_TERM_ASSET.md','docs/ARCHITECTURE.md'];
          const reps=[
            [/\.codex-review\.json/g,'.codex-safe.json'],
            [/\.codex-review\.example\.json/g,'.codex-safe.example.json'],
            [/Codex Review Service v2\.0/g,'Codex Review Service v3.0'],
            [/Codex Review Service v2/g,'Codex Review Service v3'],
            [/SQLite schema 3/g,'SQLite schema 4'],
            [/schema version 3/g,'schema version 4']
          ];
          for(const p of active){
            if(!fs.existsSync(p)) continue;
            let s=fs.readFileSync(p,'utf8');
            for(const [a,b] of reps)s=s.replace(a,b);
            if(!s.includes('## Family v3 contract')){
              s=s.replace(/^# .+\n/, m=>m+'\n## Family v3 contract\n\n- Shared Codex/process execution, Safe Contract v2, Policy Schema v3, Review Evidence chunking, deterministic review rules, and Review Receipt v3 are owned by the commit-pinned `codex-safe-core` 3.0.1.\n- Service-owned responsibilities are GitLab provider semantics, immutable `start_sha`/`head_sha` evidence acquisition, SQLite schema 4, Queue/Outbox/Publisher, status/discussions, telemetry, and deployment.\n- The only repository policy is target-branch `.codex-safe.json` schemaVersion 3; there is no Service-only policy parser or legacy policy fallback.\n- Standard and isolated Runner modes execute the same Core runtime.\n\n');
            }
            fs.writeFileSync(p,s);
          }
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.includes('\n## 3.0.0\n')){
            c=c.replace('## Unreleased\n','## Unreleased\n\n## 3.0.0\n\n### Changed\n\n- Converged on Codex Safe Core 3.0.1 while keeping GitLab/SQLite/Outbox responsibilities Service-owned.\n- Hard-switched repository policy to `.codex-safe.json` Policy Schema v3 with no Service-only policy fallback.\n- Delegated Codex/process runtime, Review Evidence chunking and deterministic review rules to Core.\n- Added GitLab-MR Review Receipt v3 persisted atomically in SQLite schema 4.\n- Added immutable TGZ + SHA256 + provenance GitHub Release workflow.\n');
          }
          fs.writeFileSync('CHANGELOG.md',c);
          NODE
          git rm .github/workflows/v3-docs-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add OPERATIONS.md SECURITY.md LONG_TERM_ASSET.md docs/ARCHITECTURE.md CHANGELOG.md
          git commit -m 'docs!: align Service operations and architecture with Family v3'
          git push origin HEAD:feat/family-v3-service

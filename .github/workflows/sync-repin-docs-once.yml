name: Sync repin docs once
on:
  push:
    branches: [repin-core-v4.9.1]
permissions:
  contents: write
concurrency:
  group: sync-repin-docs-once
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repin-core-v4.9.1
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Generate product contract docs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-contract-docs.js
          git add README.md README.zh-CN.md docs/ARCHITECTURE.md docs/PRODUCT_CONTRACT.md
          if git diff --cached --quiet; then
            echo 'generated docs already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(service): regenerate Core v4.9.1 product contract facts'
          git push origin HEAD:repin-core-v4.9.1

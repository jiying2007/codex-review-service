# Merge into the operator's Prometheus configuration. Certificates are private
# files provisioned out of band; this file never contains credential values.
scrape_configs:
  - job_name: codex-review-sharded-edge
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 8s
    # The exporter owns instance="<gitlab-id>". Preserve it rather than
    # renaming it exported_instance because of Prometheus's target label.
    honor_labels: true
    tls_config:
      ca_file: /etc/prometheus/codex-review/server-ca.crt
      cert_file: /etc/prometheus/codex-review/client.crt
      key_file: /etc/prometheus/codex-review/client.key
      server_name: review-management.example.invalid
      insecure_skip_verify: false
    static_configs:
      - targets: ['127.0.0.1:9443']
        labels:
          edge_id: fleet-primary

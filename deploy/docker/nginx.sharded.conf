# Bind the container to 127.0.0.1 on the host; terminate HTTPS in an
# operator-managed trusted reverse proxy. This file does not authenticate GitLab;
# each downstream Service still checks its own raw Webhook token/signature.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 30s;

    # Exact routes: no user-supplied upstream host or dynamic project ID.
    location = /webhooks/gitlab {
      proxy_pass http://legacy:8787/webhooks/gitlab;
    }
    location = /webhooks/gitlab/sensor {
      proxy_pass http://sensor:8787/webhooks/gitlab;
    }

    # Explicit loopback-only operational diagnostics, not public application UI.
    location = /instances/legacy/health/ready {
      proxy_pass http://legacy:8787/health/ready;
    }
    location = /instances/sensor/health/ready {
      proxy_pass http://sensor:8787/health/ready;
    }
    location = /instances/legacy/metrics {
      proxy_pass http://legacy:8787/metrics;
    }
    location = /instances/sensor/metrics {
      proxy_pass http://sensor:8787/metrics;
    }
    location = /health/live {
      default_type application/json;
      return 200 '{"status":"gateway_alive"}';
    }
    location / {
      return 404;
    }
  }
}

services:
  codex-review-service:
    image: ${CODEX_REVIEW_IMAGE:-ghcr.io/jiying2007/codex-review-service:6.4.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config.json:/etc/codex-review/config.json:ro
      - codex-review-state:/var/lib/codex-review
      - codex-review-home:/home/codex-review
    environment:
      CODEX_REVIEW_CONFIG_FILE: /etc/codex-review/config.json
      GITLAB_API_TOKEN_FILE: /run/secrets/gitlab_api_token
      GITLAB_WEBHOOK_SIGNING_TOKEN_FILE: /run/secrets/gitlab_webhook_signing_token
    secrets:
      - gitlab_api_token
      - gitlab_webhook_signing_token
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 1G
secrets:
  gitlab_api_token:
    file: ./secrets/gitlab_api_token
  gitlab_webhook_signing_token:
    file: ./secrets/gitlab_webhook_signing_token
volumes:
  codex-review-state:
  codex-review-home:

# V8: unified ingress ONLY. Instances execute in independent per-host processes.
# Bare "docker compose up" starts nothing. No implicit default webhook target.
services:
  edge:
    profiles: ["cutover-edge"]
    image: ghcr.io/jiying2007/codex-review-service@sha256:${CODEX_REVIEW_IMAGE_DIGEST:?Verified_immutable_Service_OCI_index_digest_required}
    command: ["node", "src/sharded-edge.js"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${CODEX_REVIEW_EDGE_PORT:-8799}:8787"
    environment:
      CODEX_REVIEW_SHARDED_CATALOG_FILE: /etc/codex-review/catalog.json
      CODEX_REVIEW_SHARDED_TARGETS_FILE: /etc/codex-review/targets.json
    volumes:
      - ${CODEX_REVIEW_CATALOG_FILE:?Verified_non_secret_Catalog_Schema_2_file_required}:/etc/codex-review/catalog.json:ro
      - ${CODEX_REVIEW_TARGETS_FILE:?Verified_private_network_target_file_required}:/etc/codex-review/targets.json:ro
    networks: [edge-private]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8787/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
networks:
  edge-private:
    external: true
    name: ${CODEX_REVIEW_PRIVATE_NETWORK:?Operator_created_authenticated_private_Edge_network_required}

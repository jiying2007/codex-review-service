# Explicit opt-in: all services are profile-gated. Running bare "up" launches none.
# A new verified Service OCI digest is required. Never share a tenant's SQLite writer.
services:
  legacy:
    profiles: ["cutover-legacy"]
    image: ghcr.io/jiying2007/codex-review-service@sha256:${CODEX_REVIEW_IMAGE_DIGEST:?Set_verified_Service_64_hex_OCI_digest}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    expose: ["8787"]
    environment:
      CODEX_REVIEW_CONFIG_FILE: /etc/codex-review/config.json
      GITLAB_API_TOKEN_FILE: /run/secrets/legacy_api
      GITLAB_WEBHOOK_SIGNING_TOKEN_FILE: /run/secrets/legacy_webhook
    secrets: [legacy_api, legacy_webhook]
    volumes:
      - ./legacy.json:/etc/codex-review/config.json:ro
      - legacy-state:/var/lib/codex-review/legacy
      - legacy-home:/home/codex-review/legacy
    networks: [legacy-link]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits: {cpus: "3", memory: 3G}

  sensor:
    profiles: ["cutover-sensor"]
    image: ghcr.io/jiying2007/codex-review-service@sha256:${CODEX_REVIEW_IMAGE_DIGEST:?Set_verified_Service_64_hex_OCI_digest}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    expose: ["8787"]
    environment:
      CODEX_REVIEW_CONFIG_FILE: /etc/codex-review/config.json
      GITLAB_API_TOKEN_FILE: /run/secrets/sensor_api
      GITLAB_WEBHOOK_SIGNING_TOKEN_FILE: /run/secrets/sensor_webhook
    secrets: [sensor_api, sensor_webhook]
    volumes:
      - ./sensor.json:/etc/codex-review/config.json:ro
      - sensor-state:/var/lib/codex-review/sensor
      - sensor-home:/home/codex-review/sensor
    networks: [sensor-link]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits: {cpus: "3", memory: 3G}

  edge:
    profiles: ["cutover-edge"]
    image: ${CODEX_REVIEW_EDGE_IMAGE:?Set_separately_verified_digest_pinned_nginx_image}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    tmpfs:
      - /tmp:size=64m,uid=101,gid=101,mode=1777
      - /var/cache/nginx:size=64m,uid=101,gid=101,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${CODEX_REVIEW_EDGE_PORT:-8799}:8080"
    volumes:
      - ./nginx.sharded.conf:/etc/nginx/nginx.conf:ro
    networks: [legacy-link, sensor-link]

secrets:
  legacy_api:
    file: ${LEGACY_GITLAB_API_TOKEN_FILE:?Set_protected_legacy_API_token_file}
  legacy_webhook:
    file: ${LEGACY_GITLAB_WEBHOOK_TOKEN_FILE:?Set_protected_legacy_webhook_secret_file}
  sensor_api:
    file: ${SENSOR_GITLAB_API_TOKEN_FILE:?Set_protected_sensor_API_token_file}
  sensor_webhook:
    file: ${SENSOR_GITLAB_WEBHOOK_TOKEN_FILE:?Set_protected_sensor_webhook_secret_file}

volumes:
  legacy-state:
    external: true
    name: ${CODEX_REVIEW_LEGACY_STATE_VOLUME:?Use_verified_existing_legacy_state_volume}
  legacy-home:
    external: true
    name: ${CODEX_REVIEW_LEGACY_HOME_VOLUME:?Use_verified_existing_legacy_home_volume}
  sensor-state:
  sensor-home:

networks:
  legacy-link:
    driver: bridge
  sensor-link:
    driver: bridge
